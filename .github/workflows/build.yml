# Prerender content/*.json into the HTML files.
#
# This is the ONLY build trigger. It runs on GitHub's servers, so it covers
# every way a commit can happen — a local push, an edit in the github.com web
# editor, or the mobile app. There is no local git hook to install or forget.
#
# Why it is needed at all: the page scripts render from JSON at runtime, which
# alone leaves the HTML source empty. Search engines and link previews on
# Slack/LinkedIn/X do not run JavaScript, so the content is baked into the HTML
# between <!-- build:… --> markers instead.
#
# GitHub Pages continues to deploy from the main branch as before; this job
# only pushes the regenerated HTML back so there is something correct to serve.
name: Build content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/build.js'
      - 'tools/check-content.js'
      - 'js/icons.js'
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs. Two quick edits in a row would otherwise race each other
# and the second push would be rejected as non-fast-forward.
concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails the run on malformed JSON, missing fields, or a leaked client
      # name. The bad commit stays on main, but no broken HTML is generated
      # from it — and the failure is visible in the Actions tab.
      - name: Validate content
        run: node tools/check-content.js

      - name: Prerender HTML
        run: node tools/build.js

      - name: Commit if the build changed anything
        run: |
          set -e
          FILES="index.html projects.html books.html sitemap.xml robots.txt"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "HTML already matches content/ — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "build: prerender content from JSON"
          # Rebase in case another run landed first.
          git pull --rebase --autostash origin main
          git push
          echo "Prerendered HTML updated."

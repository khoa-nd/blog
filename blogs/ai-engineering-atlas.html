.why{color:var(--fg2);font-size:12.5px;margin:0 0 18px}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.m{background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:9px}
.m b{display:block;font-family:inherit;font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums}
.m span{font-size:9.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.07em}

.list{list-style:none;padding:0;margin:0 0 20px;display:flex;flex-direction:column;gap:5px}
.list li{font-size:12px;color:var(--fg2);padding:6px 9px;background:var(--ink2);

.empty{color:var(--fg3);font-size:12px;font-style:italic}
#close{position:absolute;top:14px;right:16px;background:0;border:1px solid var(--line);
  border-radius:3px;color:var(--fg2);width:28px;height:28px;padding:0;cursor:pointer}
.path{margin-block:14px 30px;padding:18px;border:1px solid var(--line);border-radius:4px;background:var(--ink2)}
.path h3{border:0;padding:0;margin-bottom:12px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:11px;padding:5px 10px;border-radius:3px;background:var(--panel);
  border:1px solid var(--line);color:var(--fg2)}
.chip b{color:var(--amber);font-weight:700}
.arrow{color:var(--fg3);font-size:11px}
footer{color:var(--fg3);font-size:11px;padding-block:20px 40px;border-top:1px solid var(--line)}
@media (max-width:640px){header{padding-block:30px 20px}.hint{display:none}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}

<script>const AC={found:"#F2A93B",math:"#F2A93B",ml:"#E2725B",dl:"#E2725B",repr:"#E2725B",
 vision:"#8B7FD4",nlp:"#8B7FD4",arch:"#8B7FD4",llm:"#8B7FD4",rl:"#8B7FD4",gen:"#8B7FD4",audio:"#8B7FD4",
 eng:"#3FB8C4",multi:"#3FB8C4",agent:"#3FB8C4",prod:"#5FB88A",safety:"#5FB88A",craft:"#5FB88A"};
const byId={}; D.nodes.forEach(n=>byId[n.i]=n);
const pre={},post={};
D.nodes.forEach(n=>{pre[n.i]=[];post[n.i]=[]});
D.edges.forEach(([a,b])=>{pre[a].push(b);post[b].push(a)});

let mode="all", sel=null, off=new Set();

// ---- longest path (critical chain) ----
const memo={};
function longest(id){ if(memo[id])return memo[id];
  if(!pre[id].length) return memo[id]=[id];
  let best=[]; for(const p of pre[id]){const c=longest(p); if(c.length>best.length)best=c;}
  return memo[id]=best.concat(id); }
let chain=[]; D.nodes.forEach(n=>{const c=longest(n.i); if(c.length>chain.length)chain=c;});
const chainSet=new Set(chain);
document.getElementById("chain").innerHTML = chain.map((id,k)=>
  `<span class="chip"><b>${k+1}</b> ${byId[id].l}</span>` +
  (k<chain.length-1?'<span class="arrow">&rarr;</span>':'')).join("");

// ---- legend ----
const areaOrder=[...new Set(D.nodes.map(n=>n.a))];
document.getElementById("legend").innerHTML = areaOrder.map(a=>
  `<button class="lg" data-a="${a}" aria-pressed="true"><i style="background:${AC[a]}"></i>${D.areas[a]}</button>`).join("");
document.getElementById("legend").addEventListener("click",e=>{
  const b=e.target.closest(".lg"); if(!b)return;
  const a=b.dataset.a;
  if(off.has(a)){off.delete(a);b.setAttribute("aria-pressed","true");}
  else{off.add(a);b.setAttribute("aria-pressed","false");}
  draw();
});

const svg=document.getElementById("svg");
const NS="http://www.w3.org/2000/svg";
const el=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;};

function visible(){
  return D.nodes.filter(n=>{
    if(off.has(n.a))return false;
    if(mode==="core") return n.dep>=40 || chainSet.has(n.i);
    return true;
  });
}

function draw(){
  const vis=visible(), vset=new Set(vis.map(n=>n.i));
  const layers={}; vis.forEach(n=>(layers[n.d]=layers[n.d]||[]).push(n));
  const depths=Object.keys(layers).map(Number).sort((a,b)=>a-b);

  const ROW=74, PADT=34, PADL=64, CW=158, GAP=12;
  const widest=Math.max(...depths.map(d=>layers[d].length),1);
  const W=Math.max(PADL+widest*(CW+GAP)+28, 900);
  const H=PADT+depths.length*ROW+40;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.innerHTML="";

  const pos={};
  depths.forEach((d,ri)=>{
    const row=layers[d].slice().sort((a,b)=>b.dep-a.dep);
    const y=PADT+ri*ROW;
    const totalW=row.length*CW+(row.length-1)*GAP;
    const x0=PADL+((widest*(CW+GAP)-GAP)-totalW)/2;
    row.forEach((n,ci)=>{pos[n.i]={x:x0+ci*(CW+GAP),y,w:CW,h:34};});
    svg.appendChild(el("line",{x1:PADL-12,y1:y+17,x2:W-16,y2:y+17,class:"lane-rule"}));
    const t=el("text",{x:12,y:y+21,class:"lane"}); t.textContent="L"+d; svg.appendChild(t);
  });

  // edges first
  const eg=el("g",{});
  D.edges.forEach(([a,b])=>{
    if(!vset.has(a)||!vset.has(b))return;
    const A=pos[a],B=pos[b]; if(!A||!B)return;
    const ax=A.x+A.w/2, ay=A.y, bx=B.x+B.w/2, by=B.y+B.h;
    const my=(ay+by)/2;
    let cls="edge";
    if(sel){ if(a===sel||b===sel) cls+= (b===sel?" cool":" hot"); }
    const p=el("path",{d:`M${ax},${ay} C${ax},${my} ${bx},${my} ${bx},${by}`,class:cls});
    eg.appendChild(p);
  });
  svg.appendChild(eg);

  const maxDep=Math.max(...vis.map(n=>n.dep),1);
  vis.forEach(n=>{
    const P=pos[n.i];
    const metric = n.dep/maxDep;
    const g=el("g",{class:"node"+(sel&&sel!==n.i&&!pre[sel].includes(n.i)&&!post[sel].includes(n.i)?" dim":"")+(sel===n.i?" sel":""),tabindex:"0",role:"button"});
    g.setAttribute("aria-label",n.l);
    const fill=AC[n.a];
    g.appendChild(el("rect",{x:P.x,y:P.y,width:P.w,height:P.h,
      fill:`color-mix(in srgb, ${fill} ${8+metric*30}%, #16213A)`,stroke:fill,opacity:.96}));
    // dependents pill
    const pw=26;
    g.appendChild(el("rect",{x:P.x+P.w-pw-5,y:P.y+8,width:pw,height:18,rx:2,fill:fill,opacity:.92}));
    const c=el("text",{x:P.x+P.w-pw/2-5,y:P.y+21,"text-anchor":"middle",class:"cnt"});
    c.textContent = n.dep; g.appendChild(c);

    const label=el("text",{x:P.x+9,y:P.y+21});
    let s=n.l; const lim=Math.floor((P.w-pw-22)/5.75);
    if(s.length>lim) s=s.slice(0,lim-1)+"…";
    label.textContent=s; g.appendChild(label);
    const title=el("title"); title.textContent=n.l+" — "+n.dep+" dependents"; g.appendChild(title);

    const open=()=>{sel=(sel===n.i?null:n.i); draw(); if(sel)panel(n);else close();};
    g.addEventListener("click",open);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
    svg.appendChild(g);
  });
}

const P=document.getElementById("panel");
function panel(n){
  document.getElementById("p-title").textContent=n.l;
  document.getElementById("p-tags").innerHTML=
    `<span class="tag">${D.areas[n.a]}</span><span class="tag">layer ${n.d}</span>`;
  document.getElementById("p-why").textContent=n.w;
  document.getElementById("p-dep").textContent=n.dep;
  document.getElementById("p-pre").textContent=n.pre;
  document.getElementById("p-lay").textContent=n.d;
  const mk=(arr,empty)=>arr.length
    ? arr.map(id=>`<li data-go="${id}">${byId[id].l}</li>`).join("")
    : `<li class="empty">${empty}</li>`;
  document.getElementById("p-before").innerHTML=mk(pre[n.i],"Nothing — this is a root concept.");
  document.getElementById("p-after").innerHTML=mk(post[n.i],"Nothing — this is a destination.");
  P.classList.add("open");
}
function close(){P.classList.remove("open");sel=null;draw();}
document.getElementById("close").addEventListener("click",close);
P.addEventListener("click",e=>{const li=e.target.closest("[data-go]");if(!li)return;
  const n=byId[li.dataset.go]; sel=n.i; draw(); panel(n); });
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});

const tog=(a,b,set)=>{
  document.getElementById(a).addEventListener("click",()=>{set(a);sync()});
  document.getElementById(b).addEventListener("click",()=>{set(b);sync()});
};
function sync(){
  document.getElementById("m-all").setAttribute("aria-pressed",mode==="all");
  document.getElementById("m-core").setAttribute("aria-pressed",mode==="core");
  draw();
}
tog("m-all","m-core",id=>mode=(id==="m-all"?"all":"core"));

draw();
</script>

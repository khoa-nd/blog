<main id="main">
  <div class="wrap page-header">
    <p class="breadcrumb"><a href="index.html">Home</a> / Reading</p>
    <h1>Reading</h1>
    <p>What I&rsquo;ve read, what I&rsquo;m in the middle of, and what&rsquo;s waiting.
       Notes are my own take, not summaries.</p>
  </div>

  <div class="gallery-toolbar">
    <div class="wrap toolbar-row">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="b-search" placeholder="Search by title, author, or topic…" aria-label="Search books">
      </div>
      <select id="b-status" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="reading">Currently reading</option>
        <option value="finished">Finished</option>
        <option value="queued">Queued</option>
      </select>
      <select id="b-sort" aria-label="Sort books">
        <option value="status">By status</option>
        <option value="title-asc">Title A → Z</option>
        <option value="year-desc">Newest first</option>
        <option value="rating-desc">Highest rated</option>
      </select>
    </div>
  </div>

  <div class="wrap">
    <p class="result-count" id="b-count" role="status" aria-live="polite"></p>
    <div class="book-list" id="book-list" style="padding-bottom:80px"></div>
  </div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Math Grand Prix 🏎️</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a49;--ink:#1b2a49;--org:#ff7a00;--yel:#ffd23f;--grn:#2fbf71;--blu:#3b82f6;--pur:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1a3a;color:var(--ink);font-family:'Baloo 2','Arial Rounded MT Bold','Nunito',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#bgc{position:fixed;inset:0;width:100%;height:100%;display:block}
#bgc::after{content:''}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:14px 14px 30px}
#app.racing{padding:0;overflow:hidden}
#app:not(.racing)::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(10,20,60,.1),rgba(10,20,60,.55));pointer-events:none;z-index:-1}
.screen{width:min(980px,100%);margin:auto 0;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0}
.card{background:rgba(255,255,255,.95);border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.panel{background:#f3f7ff;border-radius:18px;padding:12px 14px;border:3px solid #dbe6fb}
.panel h3{font-size:19px;margin-bottom:6px;color:#3b4b78}
.muted{color:#6a7899;font-weight:700}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

/* buttons */
.btn{font-weight:800;font-size:22px;border:0;border-radius:18px;padding:12px 22px;color:#fff;background:linear-gradient(#ffa133,#ff6a00);box-shadow:0 6px 0 #b34700,0 10px 18px rgba(0,0,0,.25);cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b34700,0 4px 8px rgba(0,0,0,.25)}
.btn.green{background:linear-gradient(#4fda88,#1fa85a);box-shadow:0 6px 0 #137a3f,0 10px 18px rgba(0,0,0,.25)}
.btn.green:active{box-shadow:0 2px 0 #137a3f}
.btn.blue{background:linear-gradient(#58a0ff,#2a6be0);box-shadow:0 6px 0 #1b48a0,0 10px 18px rgba(0,0,0,.25)}
.btn.purple{background:linear-gradient(#a37bff,#7040e0);box-shadow:0 6px 0 #4b25a6,0 10px 18px rgba(0,0,0,.25)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #b9c3d6,0 10px 18px rgba(0,0,0,.2)}
.btn.small{font-size:17px;padding:8px 14px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.big{font-size:34px;padding:16px 44px;border-radius:24px}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4)}
.btn.warn{background:#e0463a;color:#fff;box-shadow:0 4px 0 #8f2119}
.link{background:none;border:0;color:#2a6be0;font-weight:800;font-size:inherit;text-decoration:underline;cursor:pointer}
.chip{background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:3px 10px;font-weight:800;font-size:18px;white-space:nowrap}
.chip.coin{background:#fff;color:var(--ink);box-shadow:0 3px 0 #d7dff0;font-size:20px}
.ib{border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;width:40px;height:36px;border-radius:12px;cursor:pointer}
.ib:active{transform:scale(.92)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{color:#fff;font-size:clamp(24px,5vw,38px);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.note{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 14px;margin:0 0 12px;font-weight:700;text-align:center}
.note.ok{background:#d8f8e4;color:#13693a}
.sec{color:#fff;margin:14px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.3);font-size:24px}

/* title */
.title{text-align:center}
.logo{color:#fff;margin:6px 0 10px}
.logo .l1{font-size:clamp(46px,10vw,96px);font-weight:800;line-height:.85;letter-spacing:4px;color:var(--yel);-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.25)}
.logo .l2{font-size:clamp(36px,8vw,80px);font-weight:800;line-height:.95;color:#fff;-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.25);letter-spacing:2px}
.logo .sub{margin-top:8px;font-weight:800;font-size:clamp(16px,3vw,22px);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.hero{display:flex;align-items:center;justify-content:center;gap:18px;width:fit-content;margin:8px auto 16px;padding:10px 26px;flex-wrap:wrap}
.hero .welcome{font-size:28px;font-weight:800;text-align:left}.hero small{display:block;font-size:16px;color:#6a7899}
.cprev{display:block;max-width:100%;height:auto}
.menu{display:flex;flex-direction:column;align-items:center;gap:6px}
.coinfloat{position:fixed;top:12px;right:14px}

/* story */
.story{text-align:center;max-width:640px;margin-inline:auto}
.story .big{font-size:70px}.story h1{font-size:clamp(26px,6vw,40px);margin:4px 0 8px}.story p{font-size:20px;font-weight:700;margin:6px 0;color:#34436b}
.story .hl{color:var(--org)}
.story input{font:inherit;font-size:28px;font-weight:800;text-align:center;border:4px solid var(--blu);border-radius:16px;padding:8px 14px;width:min(100%,360px);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.story .ask{margin-top:14px}
.how{display:grid;gap:8px;text-align:left;font-size:19px;font-weight:700;margin-top:10px}.how div{background:#f3f7ff;border-radius:14px;padding:8px 14px}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#cfd8ee}.dots i.on{background:var(--org);transform:scale(1.3)}

/* cups */
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cup{position:relative;border:0;border-radius:24px;padding:12px 12px 14px;color:var(--ink);background:linear-gradient(var(--a) 0%,#fff 55%,var(--b) 130%);box-shadow:0 8px 0 rgba(0,0,0,.25),0 14px 24px rgba(0,0,0,.25);cursor:pointer;text-align:center;transition:transform .12s;overflow:hidden}
.cup:hover{transform:translateY(-4px) rotate(-.6deg)}
.cup:active{transform:translateY(2px)}
.cup .cn{position:absolute;left:10px;top:8px;background:var(--navy);color:#fff;border-radius:10px;padding:0 10px;font-weight:800;font-size:14px}
.cup .ce{font-size:60px;line-height:1.15;margin-top:12px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.cup .ct{font-weight:800;font-size:21px;line-height:1.05}.cup .cs{font-weight:700;color:#4a5a86;font-size:16px}
.cup .cr{font-size:22px;margin-top:4px}
.cst{font-size:30px;color:#c4cfe6;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.1)}.cst .on{color:#ffb800;text-shadow:0 2px 0 #b57b00}
.cup .cb{font-weight:800;font-size:15px;color:#3b4b78}
.cup.lock{filter:grayscale(.85) brightness(.9);cursor:not-allowed}
.cup.lock:hover{transform:none}

/* brief */
.brief{background:linear-gradient(var(--a),#fff 35%)}
.bh{display:flex;gap:16px;align-items:center}.bh .ce{font-size:78px}.bh h1{font-size:clamp(26px,5vw,40px);line-height:1}.bh p{margin:2px 0 0;font-weight:700;color:#34436b;font-size:19px}.bh small{font-weight:800;color:var(--org)}
.rv{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:12px;font-size:20px}.rv span{font-size:28px}.rv i{font-style:normal;width:34px;text-align:center}.rv em{background:#e0463a;color:#fff;font-style:normal;font-size:12px;padding:0 8px;border-radius:8px;font-weight:800}
.rv.me{background:#fff3c4;box-shadow:inset 0 0 0 3px #ffd23f}
.tips{display:grid;gap:6px;margin-top:12px;font-size:18px;font-weight:700}.tips div{background:#fff8dd;border-radius:12px;padding:6px 12px}

/* garage */
.upgs{display:grid;gap:10px}.upg{display:flex;align-items:center;gap:14px;padding:10px 16px}
.upg .ui{font-size:42px}.upg .ud{flex:1}.upg .ud b{font-size:21px;display:block}.upg .ud small{display:block;font-weight:700;color:#5a6a94;line-height:1.1;font-size:15px}
.pips{display:flex;gap:6px;margin-top:4px}.pips i{width:22px;height:10px;border-radius:6px;background:#d3dbef}.pips i.on{background:var(--grn)}
.maxed{font-weight:800;color:#13693a;background:#d8f8e4;border-radius:12px;padding:4px 12px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.carc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:linear-gradient(#eaf2ff,#fff)}.carc.eq{box-shadow:0 0 0 5px var(--yel),0 10px 30px rgba(0,0,0,.28)}.carc b{font-size:19px}

/* trophies / settings */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;text-align:center;margin-bottom:12px}.stats b{display:block;font-size:34px;color:var(--org);line-height:1}.stats small{font-weight:800;color:#5a6a94}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.bd{text-align:center;padding:12px 8px;opacity:.6}.bd.got{opacity:1;background:linear-gradient(#fff9d6,#fff)}.bd span{font-size:44px;display:block}.bd b{display:block;font-size:18px;line-height:1.1}.bd small{font-weight:700;color:#5a6a94;line-height:1.1;display:block}
.set h3{margin:12px 0 6px}.set h3:first-child{margin-top:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.seg.two{grid-template-columns:1fr 1fr}
.seg button{background:#f3f7ff;border:4px solid #dbe6fb;border-radius:18px;padding:10px 6px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:0;font-size:inherit}
.seg button.on{background:#fff3c4;border-color:var(--yel);box-shadow:0 4px 0 #e0b400}
.seg span{font-size:34px;line-height:1}.seg b{font-size:19px}.seg small{font-weight:700;color:#5a6a94;line-height:1.05;font-size:13px}

/* results */
.res{max-width:760px;margin-inline:auto}.rt{text-align:center}.rt h1{font-size:clamp(30px,7vw,54px);color:var(--org);-webkit-text-stroke:0}.rt p{margin:4px 0;font-weight:700;font-size:19px;color:#34436b}
.rstars{font-size:62px;letter-spacing:8px;line-height:1}.rstars span{color:#d3dbef;display:inline-block}.rstars .on{color:#ffb800;text-shadow:0 4px 0 #b57b00;animation:pop .6s both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
.ln{display:flex;justify-content:space-between;font-size:19px;font-weight:700;padding:3px 0}.ln.tot{border-top:3px dashed #c6d3ef;margin-top:4px;padding-top:6px;font-size:23px;font-weight:800;color:#13693a}
.miss{margin-top:12px}.mi{background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;border-left:8px solid #ff5964}.mq{font-weight:800;font-size:19px}.mv svg{height:42px;width:auto;vertical-align:middle;margin-right:8px}.ma{color:#13693a;font-weight:800}.mh{font-weight:700;color:#4a5a86}.mh svg{vertical-align:middle;max-height:70px;width:auto}
.perfect{margin-top:12px;text-align:center;font-size:22px;font-weight:800;background:#e8fbf0;border-color:#bdeccf}

/* ===== RACE ===== */
#race{position:absolute;inset:0;display:flex;flex-direction:column;background:#0b1230}
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#13204a;color:#fff;flex:none}
.hud .trk{flex:1;min-width:60px;height:30px;position:relative;background:linear-gradient(#2a4388,#223874);border-radius:15px;margin:0 6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.hud .trk i{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:19px;transition:left .12s linear;line-height:1}
.hud .trk i.me{font-size:25px;filter:drop-shadow(0 0 6px #ffd23f);z-index:2}
.hud .trk .fl{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:20px}
.qbar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:linear-gradient(#fff,#e6f0ff);border-bottom:5px solid var(--yel);flex:none;min-height:88px;flex-wrap:wrap}
.qbar.pop{animation:qpop .35s}
@keyframes qpop{0%{transform:scale(.97);filter:brightness(1.2)}100%{transform:none}}
.qleft{flex:1 1 280px;min-width:0}
.qn{display:inline-block;font-size:14px;background:var(--navy);color:#fff;border-radius:10px;padding:0 10px;font-weight:800}
.qp{font-size:clamp(22px,3.6vw,40px);font-weight:800;line-height:1.05;margin-top:2px}
.qp.long{font-size:clamp(17px,2.5vw,27px);line-height:1.1}
.qvis{display:flex;align-items:center;gap:6px}.qvis svg{max-height:96px;max-width:min(300px,40vw);width:auto;height:auto}
.qrt{display:flex;align-items:center;gap:10px}
.ib.sp{background:var(--blu);box-shadow:0 3px 0 #1b48a0}
.qopts{display:flex;gap:8px}
.opt{position:relative;min-width:76px;height:56px;border-radius:16px;border:4px solid rgba(255,255,255,.6);background:var(--c);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);padding:0 12px;transition:transform .1s}
.opt i{font-style:normal;font-size:14px;opacity:.85}
.opt .ob{background:#fff;border-radius:10px;padding:2px 6px;display:flex}.opt .ob svg{height:36px;width:auto;display:block}
.opt.sel{transform:translateY(-4px) scale(1.06);border-color:var(--yel);box-shadow:0 0 0 4px var(--yel),0 8px 0 rgba(0,0,0,.3)}
.typed{min-width:150px;height:56px;border-radius:16px;background:#fff;border:4px solid var(--yel);box-shadow:0 0 0 4px #ff9f1c,0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;letter-spacing:4px;color:var(--ink);animation:blink 1.2s infinite}
@keyframes blink{50%{box-shadow:0 0 0 4px #ffd23f,0 4px 0 rgba(0,0,0,.25)}}
.pad{display:none;position:absolute;right:10px;bottom:10px;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;background:rgba(19,32,74,.82);border-radius:18px;border:3px solid var(--yel);z-index:5}
.stage.typing .pad{display:grid}.stage.typing .ctl{display:none}
.pad button{width:54px;height:54px;border-radius:14px;border:0;background:#fff;color:var(--ink);font-size:28px;font-weight:800;box-shadow:0 4px 0 #b9c3d6;cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b9c3d6;background:var(--yel)}
.pad .del{background:#ff5964;color:#fff;box-shadow:0 4px 0 #a82a35}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-14px);max-width:min(94%,700px);background:#fff;border-radius:20px;padding:10px 18px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;border:4px solid #fff}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:var(--grn)}.toast.bad{border-color:#ff5964;text-align:left}.toast.meh{border-color:#ff9f1c}
.toast .th{font-size:24px;font-weight:800;line-height:1.1}.toast .th span{font-size:20px;color:#34436b}
.toast.ok .th span{color:#13693a}
.toast .tx{font-weight:700;color:#34436b;font-size:18px;margin-top:4px;line-height:1.15}.toast .tx svg{vertical-align:middle;max-height:64px;width:auto}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(90px,24vw,240px);font-weight:800;color:#fff;-webkit-text-stroke:8px var(--navy);paint-order:stroke fill;pointer-events:none;text-shadow:0 10px 0 rgba(0,0,0,.3)}
.count.go{animation:cgo .9s ease-out both}
@keyframes cgo{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.9);opacity:0}}
.ctl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.rb{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:4px solid rgba(255,255,255,.7);background:rgba(20,32,74,.55);color:#fff;font-size:30px;cursor:pointer;backdrop-filter:blur(2px)}
.rb:active{background:rgba(255,210,63,.8)}
.ovl{position:absolute;inset:0;background:rgba(10,18,48,.78);display:grid;place-items:center;z-index:20}.ovl[hidden]{display:none}
.pbox{text-align:center}.pbox h2{font-size:40px}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.cf{position:absolute;top:-40px;animation:cfall 3s linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(540deg)}}
.btoast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;border-radius:20px;padding:10px 20px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);border:4px solid var(--yel);animation:rise .4s}
.btoast span{font-size:44px}.btoast small{display:block;color:var(--org);font-weight:800}.btoast b{font-size:22px}

@media(max-width:700px){
  .pad button{width:46px;height:50px;font-size:24px}.pad{gap:5px;padding:6px}
  .typed{min-width:100px;height:46px;font-size:28px}
  .hud{gap:5px;padding:5px 6px}.chip{font-size:15px;padding:2px 7px}.hud #hGate{display:none}
  .qbar{padding:6px 8px;gap:6px;min-height:0}.qp{font-size:21px}.opt{min-width:58px;height:46px;font-size:24px;padding:0 8px}.opt i{display:none}.qvis svg{max-height:70px}
  .rb{width:60px;height:60px}.toast .th{font-size:19px}.toast .tx{font-size:15px}
  .btn.big{font-size:28px;padding:14px 30px}
}

@media(max-height:520px){.pad{grid-template-columns:repeat(6,1fr)}.pad button{width:44px;height:42px;font-size:22px}}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="app"></div>
<div id="fx"></div>
<script>
'use strict';
/* =====================  MATH GRAND PRIX  ·  LOGIC  ===================== */
const SEG = 200, ROAD = 1800, CAMH = 1000, PZ = 900, DRAW = 250, BASE = 8000;
const LANEX = [-1200, 0, 1200];
const LANECOL = ['#ff5964', '#2fbf71', '#3b82f6'];
const LANEDOT = ['🔴', '🟢', '🔵'];

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tens = n => n - n % 10;

/* ---------- picture helpers (SVG strings; used in the banner AND painted on the gate boards) ---------- */
const SHCOL = { circle: '#ff9f1c', square: '#2ec4b6', triangle: '#ff5d73', rectangle: '#4d8bff', pentagon: '#9b5de5', hexagon: '#43c59e', octagon: '#f15bb5' };
const SHSIDES = { triangle: 3, square: 4, rectangle: 4, pentagon: 5, hexagon: 6, octagon: 8, circle: 0 };
const SVGNS = 'xmlns="http://www.w3.org/2000/svg"';
const f1 = n => Math.round(n * 10) / 10;
function polyPts(n, cx, cy, r, rot) { const p = []; for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; p.push(f1(cx + r * Math.cos(a)) + ',' + f1(cy + r * Math.sin(a))); } return p.join(' '); }
function shapeSVG(name, size) {
  size = size || 64; const c = size / 2; let el;
  switch (name) {
    case 'circle': el = `<circle cx="${c}" cy="${c}" r="${f1(size * .40)}"/>`; break;
    case 'square': el = `<rect x="${f1(size * .15)}" y="${f1(size * .15)}" width="${f1(size * .7)}" height="${f1(size * .7)}" rx="3"/>`; break;

/* ---------- question builders ---------- */
const optT = t => ({ t: String(t), say: String(t) });
const optShape = n => ({ svg: shapeSVG(n, 64), key: 'shape-' + n, say: n });
const optLine = (k, len, say) => ({ svg: lineSVG(k, len), key: 'line-' + k + (len || ''), say });

function distract(ans, L) {

  const c = [], used = new Set([ans]);

  if (ans >= 10 && ans < 100) { const sw = +String(ans).split('').reverse().join(''); if (sw >= 10 && sw !== ans && Math.random() < .5) tryAdd(sw); }
  tryAdd(ans + near[0]); tryAdd(ans + far[0]); tryAdd(ans + near[1]); tryAdd(ans + far[1]);

}
function mkNum(topic, prompt, ans, L, hint, extra) {
  const d = distract(ans, L), arr = shuffle([ans, d[0], d[1]]);

}
function mkPick(topic, prompt, correct, wrongs, hint, extra) {
  const arr = shuffle([correct, ...wrongs]);

}

function addHint(a, b) {
  if (b >= 10) { const t = tens(b), o = b % 10; return o ? `${a} + ${t} = ${a + t}, then ${a + t} + ${o} = ${a + b}` : `${a} + ${t} = ${a + b}`; }
  const gap = 10 - a % 10;
  if (a % 10 && b > gap) return `${a} + ${gap} = ${a + gap} (make a ten!), then ${a + gap} + ${b - gap} = ${a + b}`;

}

  if (o && b > o) return `${a} − ${o} = ${a - o}, then ${a - o} − ${b - o} = ${a - b}`;

}
const skip = (a, n) => { const o = []; for (let i = 1; i <= n; i++) o.push(a * i); return o.join(', '); };

  return (a * b <= 60 && b <= 10 ? dotsSVG(a, b) + ' ' : '') + `${a} groups of ${b} → ${rep}`;
}

/* ----- add / subtract ----- */
function genAdd(L) {
  if (L >= 2 && Math.random() < .38) return genFormat('add', L);
  if (L >= 4) return genAdd4();
  const r = Math.random();
  if (L === 1) { const a = rnd(6, 30), b = rnd(3, 14); return mkNum('add', `${a} + ${b} = ?`, a + b, 1, addHint(a, b)); }
  if (L === 2) {
    if (r < .22) { const a = rnd(12, 60), b = rnd(11, 35), s = a + b; return mkNum('add', `${a} + □ = ${s}`, b, 2, `${s} − ${a} = ${b}. ${subHint(s, a)}`); }
    const a = rnd(14, 78), b = rnd(11, Math.min(60, 99 - a)); return mkNum('add', `${a} + ${b} = ?`, a + b, 2, addHint(a, b));
  }
  if (r < .25) { const a = rnd(12, 49), b = rnd(11, 49), c = rnd(10, 49); return mkNum('add', `${a} + ${b} + ${c} = ?`, a + b + c, 3, `${a} + ${b} = ${a + b}, then ${a + b} + ${c} = ${a + b + c}`); }
  if (r < .45) { const a = rnd(24, 80), b = rnd(18, 75), s = a + b; return mkNum('add', `□ + ${b} = ${s}`, a, 3, `${s} − ${b} = ${a}. ${subHint(s, b)}`); }
  const a = rnd(35, 99), b = rnd(25, 99); return mkNum('add', `${a} + ${b} = ?`, a + b, 3, addHint(a, b));
}

    const a = rnd(31, 99), b = rnd(11, a - 10); return mkNum('sub', `${a} − ${b} = ?`, a - b, 2, subHint(a, b));

/* ----- multiply / divide ----- */
function genMult(L) {
  if (L >= 2 && Math.random() < .38) return genFormat('mult', L);
  if (L >= 4) return genMult4();
  const r = Math.random();
  if (L === 1) { const a = pick([2, 2, 5, 5, 10, 3]), b = rnd(2, 6); return mkNum('mult', `${a} × ${b} = ?`, a * b, 1, multHint(a, b), { visual: dotsSVG(a, b) }); }

/* ----- shapes ----- */
const SHAPES_A = ['circle', 'square', 'triangle', 'rectangle'], SHAPES_B = ['circle', 'square', 'triangle', 'rectangle', 'pentagon', 'hexagon', 'octagon'];

    if (r < .78) { const p = pool.filter(x => SHSIDES[x] > 0), t = pick(p); return mkNum('shape', 'How many sides does this shape have?', SHSIDES[t], 2, sidesTxt(t), { visual: shapeSVG(t, 86) }); }

/* ----- lines & lengths ----- */
function genLine(L) {
  if (L >= 4) return genLine4();
  const r = Math.random();
  if (L === 1) {
    if (r < .2) return mkPick('line', 'Which one is a straight line?', optLine(pick(['straight', 'horizontal', 'vertical']), 0, 'the straight line'), [optLine('curved', 0, 'the curved line'), optLine('wavy', 0, 'the wavy line')], 'A straight line never bends.');
    if (r < .4) return mkPick('line', 'Which one is a curved line?', optLine('curved', 0, 'the curved line'), [optLine('horizontal', 0, 'a flat line'), optLine('slanted', 0, 'a slanted line')], 'A curved line bends. It is not straight.');
    if (r < .62) { const ls = shuffle([24, 40, 56]), big = r < .5; const target = big ? 56 : 24; const arr = ls.map(x => optLine('len', x, 'the line')); return Object.assign(mkPick('line', big ? 'Which line is the LONGEST?' : 'Which line is the SHORTEST?', arr[ls.indexOf(target)], arr.filter((_, i) => i !== ls.indexOf(target)), big ? 'The longest line stretches the farthest.' : 'The shortest line is the smallest one.'), {}); }
    if (r < .82) return mkPick('line', 'Which line goes straight up and down (vertical)?', optLine('vertical', 0, 'the up and down line'), [optLine('horizontal', 0, 'the flat line'), optLine('slanted', 0, 'the slanted line')], 'Vertical = standing up like a pole.');
    return mkPick('line', 'Which line lies flat (horizontal)?', optLine('horizontal', 0, 'the flat line'), [optLine('vertical', 0, 'the up and down line'), optLine('slanted', 0, 'the slanted line')], 'Horizontal = lying flat like the horizon.');
  }
  if (L === 2) {

    if (r < .4) return mkPick('line', 'Which lines CROSS each other?', optLine('crossing', 0, 'the crossing lines'), [optLine('parallel', 0, 'the parallel lines'), optLine('parallelV', 0, 'the parallel lines')], 'Crossing lines make an X.');

  if (r < .75) { const a = rnd(5, 14), b = rnd(5, 14), c = rnd(5, 14); return mkNum('line', 'Walk all the way round the triangle. How far is that?', a + b + c, 3, `${a} + ${b} = ${a + b}, then ${a + b} + ${c} = ${a + b + c} cm`, { visual: triSVG(a, b, c) }); }
  const b = rnd(15, 45), a = b + rnd(12, 40); return mkNum('line', `Rope A is ${a} cm. Rope B is ${b} cm. How much longer is rope A?`, a - b, 3, `${a} − ${b} = ${a - b}. ${subHint(a, b)}`, { visual: barsSVG([{ len: a, col: '#ff9f1c', txt: a + ' cm' }, { len: b, col: '#2ec4b6', txt: b + ' cm' }]) });
}

/* ----- racing story problems ----- */
function genMix(L) {
  if (L >= 4) return genMix4();
  const r = Math.random();
  if (L === 1) {
    if (r < .34) { const a = rnd(2, 5), b = rnd(2, 5); return mkNum('mix', `Each race gives you ${b} stars. You win ${a} races. How many stars?`, a * b, 1, `${a} × ${b} = ${a * b}`); }
    if (r < .67) { const a = rnd(15, 35), b = rnd(4, 14); return mkNum('mix', `You have ${a} coins and find ${b} more on the road. How many coins now?`, a + b, 1, addHint(a, b)); }
    const a = rnd(14, 30), b = rnd(4, 11); return mkNum('mix', `The pit crew has ${a} tyres. They use ${b}. How many tyres are left?`, a - b, 1, subHint(a, b));
  }
  if (L === 2) {
    if (r < .34) { const g = rnd(3, 6), e = rnd(3, 12); return mkNum('mix', `${g} race cars each have 4 wheels. Then ${e} spare wheels are added. How many wheels in all?`, g * 4 + e, 2, `${g} × 4 = ${g * 4}, then ${g * 4} + ${e} = ${g * 4 + e}`); }
    if (r < .67) { const p = rnd(3, 9), k = rnd(2, 5), a = p * k + rnd(8, 30); return mkNum('mix', `You have ${a} coins. A flag costs ${p} coins and you buy ${k} flags. How many coins are left?`, a - p * k, 2, `${p} × ${k} = ${p * k}, then ${a} − ${p * k} = ${a - p * k}`); }
    const a = rnd(25, 55), b = rnd(18, 44); return mkNum('mix', `Track A is ${a} km long and track B is ${b} km long. You race both. How many km is that?`, a + b, 2, addHint(a, b));
  }

    case 'mutetoggle': S.mute = !S.mute; save(); settings(); break;
    case 'voicetoggle': S.voice = !S.voice; save(); settings(); break;
    case 'reset': if (!resetArmed) { resetArmed = 1; b.textContent = 'Tap again to erase everything'; b.classList.add('warn'); } else { S = fresh(); save(); resetArmed = 0; story(0); } break;
    case 'lane': setLane(i); break;
    case 'dig': typeKey(k); break;
    case 'del': typeKey('del'); break;
    case 'left': setLane(R ? R.lane - 1 : 0); break;
    case 'right': setLane(R ? R.lane + 1 : 0); break;
    case 'speak': if (R && R.gates[R.gi]) say(R.gates[R.gi].q.prompt); break;
    case 'mute': S.mute = !S.mute; save(); b.textContent = S.mute ? '🔇' : '🔊'; if (S.mute && window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { } break;
    case 'pause': pauseGame(true); break;
    case 'resume': pauseGame(false); break;
    case 'quit': leaveRace(); cups(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') { const nx = document.querySelector('[data-act="storynext"]'); if (nx) nx.click(); } return; }
  if (mode !== 'race' || !R) return; const k = e.key;
  if (curTyping() && !paused) { if (/^\d$/.test(k)) { typeKey(k); e.preventDefault(); return; } if (k === 'Backspace' || k === 'Delete') { typeKey('del'); e.preventDefault(); return; } }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { setLane(R.lane - 1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { setLane(R.lane + 1); e.preventDefault(); }
  else if (k === '1' || k === '2' || k === '3') setLane(+k - 1);
  else if (k === 'Escape' || k === 'p' || k === 'P' || k === ' ') { pauseGame(!paused); e.preventDefault(); }
});
let dragging = false;
function laneFromPointer(ev) { const r = cv.getBoundingClientRect(); setLane(Math.floor((ev.clientX - r.left) / r.width * 3)); }
document.addEventListener('pointerdown', e => { if (mode === 'race' && cv && e.target === cv) { dragging = true; laneFromPointer(e); } });
document.addEventListener('pointermove', e => { if (dragging && mode === 'race' && cv) laneFromPointer(e); });
document.addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'race') pauseGame(true); });

/* =====================  BOOT  ===================== */
try { document.fonts && document.fonts.load('800 40px "Baloo 2"'); } catch (e) { }
requestAnimationFrame(frame);
if (!S.intro) story(0); else title();

</script>

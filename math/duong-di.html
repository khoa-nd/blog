<!doctype html>
<html lang="vi" data-lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đường đi ngắn nhất · Buổi 14</title>
<meta name="description" content="Game đếm đường đi ngắn nhất cho bé 7 tuổi: ghi số ở mỗi ngã tư, đi qua một nơi thì nhân, không qua thì trừ.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#25304a;--green:#2fbf71;--green-d:#1f9a58;--red:#ff5964;--blue:#3b82f6;--orange:#ff9f1c;--purple:#8b5cf6;--line:#2b2f3a;--shadow:0 8px 0 rgba(37,48,74,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,#b9e6ff 0%,#e6f6ff 45%,#fff2cf 100%) fixed;min-height:100vh;color-scheme:light;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:800}
.deco i{position:fixed;font-style:normal;font-size:44px;opacity:.55;pointer-events:none;animation:floaty 9s ease-in-out infinite;z-index:0}
@keyframes floaty{50%{transform:translateY(-16px) rotate(6deg)}}

.top{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;max-width:1200px;margin:0 auto}
.sp{flex:1}
.pill{display:inline-block;white-space:nowrap;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(37,48,74,.18)}
.pill.cur{background:#ffd447}
.tg{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 12px;font-weight:700;font-size:17px;box-shadow:0 4px 0 rgba(37,48,74,.18)}
.tg:active{transform:translateY(3px);box-shadow:none}
.tg[hidden]{display:none}
.tg.off{opacity:.5}
html[data-lang=vi] .l-en,html[data-lang=en] .l-vi{opacity:.4;font-weight:500}

.wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;padding:4px 14px 28px;max-width:1200px;margin:0 auto;align-items:start}
@media (max-width:880px){.wrap{grid-template-columns:1fr}}

.stageCard{background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:var(--shadow);padding:12px 12px 10px}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.qtitle{font-weight:800;font-size:clamp(17px,2.3vw,24px);line-height:1.15;padding-top:2px}
.badge{flex:none;min-width:84px;text-align:center;background:#ffe27a;border:3px solid var(--ink);border-radius:18px;padding:0 10px 2px;line-height:1;box-shadow:0 4px 0 rgba(37,48,74,.18)}
.badge .n{font-size:40px;font-weight:800;line-height:1.05}
.badge small{display:block;font-size:13px;font-weight:700;margin-top:-4px;opacity:.8}
.badge.bump .n{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
.badge.glow{animation:glow 1.2s ease-in-out 3;background:#7ee2a0}
@keyframes bump{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes glow{50%{transform:scale(1.14)}}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs:empty{display:none}
.tab{background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:0 14px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(37,48,74,.18)}
.tab.cur{background:#ffd447}
.tab.done{background:#c8f3d6}
.tab.cur.done{background:#ffd447}

#stage{display:block;width:100%;height:auto;max-height:64vh;border-radius:18px;border:2px solid #e3d9bd;
  background-color:#fffbea;background-image:linear-gradient(#f1e8c6 1px,transparent 1px),linear-gradient(90deg,#f1e8c6 1px,transparent 1px);background-size:24px 24px;touch-action:manipulation}
#stage text{font-family:'Baloo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#stage .num{font-weight:800;fill:#4a5568}

.galh{font-weight:800;font-size:15px;margin:8px 2px 2px;opacity:.8}
.gal{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;padding:6px;background:#f2f7ff;border:2px dashed #b9c8e6;border-radius:14px}
.gal .th{width:62px;background:#fff;border:2px solid #cfd9ee;border-radius:9px;padding:2px;line-height:0}
.gal .th svg{width:100%;height:auto}
.gal .th.pop{animation:popd .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes popd{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}

.talk{display:flex;flex-direction:column;gap:12px}
.say{display:flex;gap:10px;align-items:flex-start}
.owl{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:42px;box-shadow:0 5px 0 rgba(37,48,74,.18)}
.owl.talking{animation:hop .6s ease-in-out 2}
@keyframes hop{40%{transform:translateY(-10px) rotate(-6deg)}}
.bubble{position:relative;flex:1;min-height:150px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.2vw,25px);line-height:1.3;font-weight:500;box-shadow:0 6px 0 rgba(37,48,74,.18)}
.bubble::before{content:'';position:absolute;left:-14px;top:22px;width:22px;height:22px;background:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble b{color:#d6245a}
.bubble.flip{animation:fadein .35s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@media (max-width:880px){.bubble{min-height:120px}}

.choices{display:flex;gap:10px;flex-wrap:wrap}
.choices:empty{display:none}
.choice{min-width:76px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:2px 18px;font-weight:800;font-size:30px;box-shadow:0 5px 0 rgba(37,48,74,.2)}
.choice:active{transform:translateY(4px);box-shadow:none}
.choice.ok{background:#7ee2a0}
.choice.bad{background:#ffb3b9;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.ctrls{display:flex;gap:10px;position:sticky;bottom:8px;z-index:3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:18px;padding:4px 18px;font-weight:800;font-size:22px;background:#fff;box-shadow:0 5px 0 rgba(37,48,74,.22);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(37,48,74,.22)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--green);color:#fff;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sec{background:#fff}
.btn.big{font-size:28px;padding:8px 30px}
.btn.pri.ready{animation:readyp 1.1s ease-in-out infinite}
@keyframes readyp{50%{transform:scale(1.04)}}
.small{display:flex;gap:8px;flex-wrap:wrap}
.btn.mini{font-size:16px;padding:0 12px;border-radius:14px;box-shadow:0 3px 0 rgba(37,48,74,.2)}
.btn.mini.on{background:#ffd447}
.ic{font-size:.85em}

.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff;padding:0}
.dot.done{background:#7ee2a0}
.dot.cur{background:#ffd447;transform:scale(1.25)}

/* SVG animation helpers */
.pop{animation:svgpop .45s cubic-bezier(.2,1.7,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes svgpop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.fadein{animation:fadein2 .5s both}
@keyframes fadein2{from{opacity:0}to{opacity:1}}
.pulse{animation:pls 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pls{50%{transform:scale(1.07)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawl .8s ease-out forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
.drop{animation:dropin .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dropin{from{transform:translateY(-150px);opacity:0}to{transform:none;opacity:1}}
.shakeg{animation:shk2 .4s}
@keyframes shk2{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* cover + confetti */
#cover{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#b9e6ff,#fff2cf);display:grid;place-items:center;padding:18px}
#cover[hidden]{display:none}
.coverCard{max-width:560px;text-align:center;background:#fff;border:4px solid var(--ink);border-radius:32px;box-shadow:0 10px 0 rgba(37,48,74,.2);padding:22px 22px 18px}
.cemo{font-size:72px;line-height:1.1;animation:floaty 4s ease-in-out infinite}
.coverCard h1{margin:6px 0 4px;font-size:clamp(26px,5vw,38px);line-height:1.1}
.coverCard p{margin:6px 0 16px;font-size:clamp(17px,3vw,21px);line-height:1.3}
.cfoot{margin-top:14px}
.cf{position:fixed;top:-40px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.deco i,.cemo,.btn.pri.ready,.pulse{animation:none}}

@media (max-width:880px){
  .pill{font-size:15px;padding:0 10px}
  .tg{font-size:15px;padding:0 9px}
  .wrap{padding-bottom:300px}
  .talk{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.97);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.14);max-height:62vh;overflow:auto}
  .owl{width:46px;height:46px;font-size:28px;border-width:2px}
  .bubble{min-height:78px;font-size:17px;padding:8px 12px;border-width:2px;box-shadow:none}
  .bubble::before{top:14px;border-width:2px}
  .ctrls{position:static}
  .btn{font-size:19px;padding:2px 14px;border-radius:14px}
  .btn.mini{font-size:14px}
  .dot{width:16px;height:16px;border-width:2px}
  .dots{gap:5px}
  .choice{font-size:24px;min-width:64px;padding:0 14px}
  #stage{max-height:44vh}
  .galh{display:none}
  .gal{min-height:50px}
  .gal .th{width:48px}
  .qtitle{font-size:16px}
  .badge{min-width:70px}.badge .n{font-size:30px}
}

/* route page extras */
.choice.hint{font-size:20px;background:#fff7d6;min-width:0;padding:2px 14px}
.choice:disabled{opacity:.45}
#stage{touch-action:manipulation}

</style>
</head>
<body>
<div class="deco" aria-hidden="true"><i style="left:6%;top:14%">☁️</i><i style="left:86%;top:8%;animation-delay:-3s">⭐</i><i style="left:92%;top:58%;animation-delay:-6s">🧀</i><i style="left:3%;top:66%;animation-delay:-2s">🗺️</i><i style="left:46%;top:92%;animation-delay:-5s">☁️</i></div>

<header class="top">
  <a class="pill" id="n1" href="hcn1.html" data-vi="📐 Bài 2" data-en="📐 Problem 2">📐 Bài 2</a>
  <a class="pill" id="n2" href="hcn2.html" data-vi="🔲 Bài 3" data-en="🔲 Problem 3">🔲 Bài 3</a>
  <a class="pill" id="n3" href="triangle.html" data-vi="🔺 Tam giác" data-en="🔺 Triangles">🔺 Tam giác</a>
  <a class="pill" id="n4" href="duong-di.html" data-vi="🧀 Đường đi" data-en="🧀 Routes">🧀 Đường đi</a>
  <span class="sp"></span>
  <button class="tg" id="bVoice" title="Voice" aria-label="Voice">🔊</button>
  <button class="tg" id="bLang" title="Language" aria-label="Language"><b class="l-vi">VI</b>·<b class="l-en">EN</b></button>
</header>

<main class="wrap">
  <section class="stageCard">
    <div class="hud">
      <div class="qtitle" id="qt"></div>
      <div class="badge" id="badge"><div class="n" id="cnt">0</div><small data-vi="cách đi" data-en="routes">cách đi</small></div>
    </div>
    <div id="tabs" class="tabs"></div>
    <svg id="stage" viewBox="0 0 840 460" role="img" aria-label="figure"><g id="base"></g><g id="ov"></g></svg>
    <div class="galh" data-vi="🧺 Các đường đã tìm:" data-en="🧺 Routes found:">🧺 Các đường đã tìm:</div>
    <div class="gal" id="gal"></div>
  </section>

  <aside class="talk">
    <div class="say">
      <div class="owl" id="owl">🦉</div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
    <div id="choices" class="choices"></div>
    <div class="ctrls">
      <button class="btn sec" id="bBack"><span class="ic">◀</span> <span data-vi="Lùi" data-en="Back">Lùi</span></button>
      <button class="btn pri" id="bNext"><span id="nextTxt" data-vi="Tiếp" data-en="Next">Tiếp</span> <span class="ic" id="nextIc">▶</span></button>
    </div>
    <div class="small">
      <button class="btn mini" id="bRe"><span class="ic">↺</span> <span data-vi="Xem lại bước này" data-en="Replay step">Xem lại bước này</span></button>
      <button class="btn mini" id="bAuto"><span class="ic">⏵</span> <span data-vi="Tự chạy" data-en="Auto-play">Tự chạy</span></button>
    </div>
    <div class="dots" id="dots"></div>
  </aside>
</main>

<div id="cover">
  <div class="coverCard">
    <div class="cemo">🐭🧀</div>
    <h1 id="cTitle"></h1>
    <p id="cSub"></p>
    <button class="btn pri big" id="bStart"><span data-vi="Bắt đầu nào!" data-en="Let's start!">Bắt đầu nào!</span> <span class="ic">▶</span></button>
    <div class="cfoot"><button class="tg" id="cLang"><b class="l-vi">VI</b>·<b class="l-en">EN</b></button></div>
  </div>
</div>

<script>
const E=(function(){
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const svg=$('#stage'),base=$('#base'),ov=$('#ov'),bubble=$('#bubble'),choicesEl=$('#choices'),gal=$('#gal'),
  cntEl=$('#cnt'),badge=$('#badge'),dotsEl=$('#dots'),owl=$('#owl'),bBack=$('#bBack'),bNext=$('#bNext'),
  bVoice=$('#bVoice'),bAuto=$('#bAuto'),cover=$('#cover');
let lang='vi',cfg={},steps=[],cur=-1,token=0,auto=false,voiceOn=true,started=false,
    found=[],thumbFn=()=>'',galN=0,voice=null,reached={},qtObj=null;
const synth=window.speechSynthesis||null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function t(o){return o==null?'':typeof o==='string'?o:(o[lang]||o.vi)}
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in (a||{})){if(a[k]==null)continue;if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k])}if(p)p.appendChild(e);return e}
function setView(w,h){svg.setAttribute('viewBox','0 0 '+w+' '+h)}

/* ---------- static text / language ---------- */
function applyStatic(){
  document.documentElement.lang=lang;document.documentElement.dataset.lang=lang;
  document.querySelectorAll('[data-vi]').forEach(e=>{e.textContent=e.getAttribute('data-'+lang)||e.getAttribute('data-vi')});
  if(cfg.pageTitle)document.title=t(cfg.pageTitle);
  if(qtObj)$('#qt').innerHTML=t(qtObj);
  if(cfg.cover){$('#cTitle').innerHTML=t(cfg.cover.title);$('#cSub').innerHTML=t(cfg.cover.sub)}
  if(cfg.onLang)cfg.onLang();
  pickVoice();updateNav();
}
function setLang(l){lang=l;store.set('hcn-lang',l);applyStatic();if(started&&cur>=0)go(cur)}

/* ---------- voice ---------- */
function pickVoice(){
  if(!synth){bVoice.hidden=true;return}
  const vs=synth.getVoices();const pre=lang==='vi'?'vi':'en';
  voice=vs.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(pre))||null;
  bVoice.hidden=vs.length>0&&!voice;
  bVoice.classList.toggle('off',!voiceOn);
}
if(synth){synth.onvoiceschanged=pickVoice}
function speakable(h){
  let s=h.replace(/<[^>]+>/g,'').replace(/[\u{1F300}-\u{1FAFF}☀-➿⬀-⯿️]/gu,'');
  const m=lang==='vi'?{'+':' cộng ','×':' nhân ','=':' bằng ','→':' '}:{'+':' plus ','×':' times ','=':' equals ','→':' '};
  s=s.replace(/[+×=→]/g,c=>m[c]);
  s=s.replace(/[←↑↓↘↙✖❌]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function say(o,opt){
  opt=opt||{};const html=t(o);
  bubble.innerHTML=html;bubble.classList.remove('flip');void bubble.offsetWidth;bubble.classList.add('flip');
  owl.classList.remove('talking');void owl.offsetWidth;owl.classList.add('talking');
  const plain=speakable(html);const est=Math.max(1400,plain.length*62);
  if(voiceOn&&opt.speak!==false&&synth&&(voice||!synth.getVoices().length)&&started){
    try{synth.cancel()}catch(e){}
    return new Promise(res=>{
      let fin=false;const f=()=>{if(!fin){fin=true;res()}};
      const u=new SpeechSynthesisUtterance(plain);u.lang=lang==='vi'?'vi-VN':'en-US';if(voice)u.voice=voice;u.rate=.92;u.pitch=1.1;
      u.onend=f;u.onerror=f;setTimeout(f,est*1.6+1500);
      setTimeout(()=>{try{synth.speak(u)}catch(e){f()}},60);
    });
  }
  return new Promise(res=>setTimeout(res,opt.speak===false?0:est));
}

/* ---------- counter / gallery ---------- */
function setCount(n,anim){cntEl.textContent=n;if(anim){badge.classList.remove('bump');void badge.offsetWidth;badge.classList.add('bump')}}
function setFound(list,fn){found=list;thumbFn=fn;galN=0;gal.innerHTML=''}
function pushThumb(anim){
  if(galN>=found.length)return;
  const d=document.createElement('div');d.className='th'+(anim?' pop':'');d.innerHTML=thumbFn(found[galN],galN);gal.appendChild(d);galN++;
}
function fillGallery(n){gal.innerHTML='';galN=0;for(let k=0;k<n;k++)pushThumb(false)}

/* ---------- fx ---------- */
function confetti(){
  const em=['🎉','⭐','✨','🎈','🔷','🌟','🟩'];
  for(let k=0;k<38;k++){const s=document.createElement('span');s.className='cf';s.textContent=em[k%em.length];
    s.style.left=Math.random()*100+'vw';s.style.fontSize=(18+Math.random()*24)+'px';
    s.style.animationDuration=(2.4+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.7)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),5600)}
  badge.classList.remove('glow');void badge.offsetWidth;badge.classList.add('glow');
}
function choose(opts,onWrong){
  return new Promise(res=>{
    choicesEl.innerHTML='';
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='choice';b.textContent=o.label;
      b.onclick=()=>{
        if(o.ok){b.classList.add('ok');[...choicesEl.children].forEach(x=>x.disabled=true);setTimeout(()=>{choicesEl.innerHTML='';res()},700)}
        else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');onWrong&&onWrong(o)}
      };
      choicesEl.appendChild(b);
    });
  });
}

/* ---------- step engine ---------- */
function api(tk){
  const chk=()=>{if(tk!==token)throw 'cancel'};
  return {
    mk:(tag,a,p)=>{chk();return mk(tag,a,p||ov)},
    wait:ms=>new Promise((res,rej)=>setTimeout(()=>tk===token?res():rej('cancel'),ms)),
    say:(o,opt)=>{chk();return say(o,opt)},
    add(){chk();pushThumb(true);setCount(galN,true)},
    choose:(o,w)=>{chk();return choose(o,w)},
    until:fn=>{chk();return new Promise(fn)},
    confetti:()=>{chk();confetti()},
    alive:()=>tk===token,
    t,lang:()=>lang
  };
}
function buildDots(){
  dotsEl.innerHTML='';
  steps.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','step '+(i+1));d.onclick=()=>{if(started)go(i)};dotsEl.appendChild(d)});
}
function paintDots(){[...dotsEl.children].forEach((d,i)=>{d.classList.toggle('cur',i===cur);d.classList.toggle('done',!!reached[i]&&i!==cur)})}
function finishInfo(){return typeof cfg.finish==='function'?cfg.finish():cfg.finish}
function updateNav(){
  bBack.disabled=cur<=0;
  const last=cur>=steps.length-1&&steps.length>0;
  const n=$('#nextTxt'),ic=$('#nextIc');
  if(last&&cfg.finish){const f=finishInfo();n.removeAttribute('data-vi');n.removeAttribute('data-en');n.textContent=t(f.label);ic.textContent=f.icon||'▶'}
  else{n.setAttribute('data-vi','Tiếp');n.setAttribute('data-en','Next');n.textContent=lang==='vi'?'Tiếp':'Next';ic.textContent='▶'}
  bNext.disabled=last&&!cfg.finish;
}
async function go(i){
  if(!started||!steps.length)return;
  i=Math.max(0,Math.min(steps.length-1,i));cur=i;const tk=++token;
  if(synth){try{synth.cancel()}catch(e){}}

  V.ring=(i,j,col,r)=>{const p=P(i,j);const g=A.mk('g',{transform:`translate(${p[0]},${p[1]})`},lay.top);
    A.mk('circle',{r:r||26,fill:'none',stroke:col,'stroke-width':5,class:'pulse'},g);return g};
  V.shade=(a,z,col)=>{
    const pts=[P(a[0],a[1]),P(z[0],a[1]),P(z[0],z[1]),P(a[0],z[1])].map(q=>q.join(',')).join(' ');
    return A.mk('polygon',{points:pts,fill:col,'fill-opacity':.14,stroke:col,'stroke-width':14,'stroke-opacity':.14,'stroke-linejoin':'round',class:'fadein'},lay.shade)};
  V.seg=(a,c,col,w,layer)=>{const p=P(a[0],a[1]),q=P(c[0],c[1]);
    return A.mk('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:col,'stroke-width':w||9,'stroke-linecap':'round',class:'draw',style:'--len:'+dist(p,q)},layer||lay.trail)};
  V.route=(path,col,w,layer)=>{const L2=layer||lay.trail;for(let k=1;k<path.length;k++)V.seg(path[k-1],path[k],legColorAt(b,path,k)||col,w,L2);return L2};
  return V;
}

/* ---------- walking a route (animated, used for demos & hints) ---------- */
async function playRoute(A,V,route,col,o){
  o=o||{};
  V.walkerTo(route[0][0],route[0][1],true);
  const layer=A.mk('g',{},V.lay.trail);
  await A.wait(250);
  for(let k=1;k<route.length;k++){
    V.seg(route[k-1],route[k],legColorAt(V.b,route,k)||col,9,layer);
    V.walkerTo(route[k][0],route[k][1]);
    await A.wait(o.fast?240:380);
  }
  return layer;
}

/* ---------- explore: child walks the character and finds all routes ---------- */
async function findRoutes(A,V,b,o){
  o=o||{};
  const list=[];E.setFound(list,it=>thumb(b,it.route,it.col));
  const all=routes(b),total=all.length,got=new Set();
  let busy=false,cur=[0,0],path=[[0,0]],layer=A.mk('g',{},V.lay.trail),ghosts=[],tapLayer=A.mk('g',{},V.lay.top);
  const th=V.th,ar=arrows(b);
  const isBlocked=(i,j)=>b.avoid.some(a=>a.i===i&&a.j===j);
  const nameOf=it=>IT[it.k].n;
  const shake=v=>{v.walkerInner.classList.remove('shakeg');void v.walkerInner.getBoundingClientRect();v.walkerInner.classList.add('shakeg')};
  function say(o2,speak){A.say(o2,{speak:!!speak})}
  function showTaps(){
    tapLayer.innerHTML='';
    [[1,0],[0,1]].forEach((d,n)=>{
      const ni=cur[0]+d[0],nj=cur[1]+d[1];
      if(ni>=b.nx||nj>=b.ny||isBlocked(ni,nj))return;
      const p=V.pos(ni,nj);
      const g=A.mk('g',{transform:`translate(${p[0]},${p[1]})`,style:'cursor:pointer'},tapLayer);
      const inner=A.mk('g',{class:'pulse'},g);
      A.mk('circle',{r:Math.min(38,Math.max(26,V.L.s*.36)),fill:n?C.orange:C.blue,'fill-opacity':.28,stroke:n?C.orange:C.blue,'stroke-width':4},inner);
      A.mk('text',{x:0,y:2,'text-anchor':'middle','dominant-baseline':'central','font-size':30,'font-weight':800,fill:n?'#c2710c':'#1d4ed8',text:ar[n]},inner);
      g.addEventListener('pointerdown',ev=>{ev.preventDefault();onTap(ni,nj)});
    });
  }
  const colNow=()=>RC[got.size%RC.length];
  async function doMove(ni,nj){
    tapLayer.innerHTML='';
    const col=colNow();
    V.seg(cur,[ni,nj],legColorAt(b,path.concat([[ni,nj]]),path.length)||col,9,layer);
    V.walkerTo(ni,nj);
    cur=[ni,nj];path.push(cur);
    await A.wait(380);
    if(ni===b.nx-1&&nj===b.ny-1)await finish(col);else showTaps();
  }
  async function reset(){
    layer.remove();layer=A.mk('g',{},V.lay.trail);
    path=[[0,0]];cur=[0,0];V.walkerTo(0,0);
    await A.wait(420);showTaps();
  }
  async function finish(col){
    const key=keyOf(path);
    const miss=b.via.filter(v=>!path.some(p=>p[0]===v.i&&p[1]===v.j));
    if(miss.length){
      const nm=joinNames(miss.map(nameOf));
      say(T(`Ôi, chưa ghé qua <b>${nm.vi}</b>! Đường này không tính. Thử lại nhé.`,`Oops, you didn't stop at <b>${nm.en}</b>! That route doesn't count. Try again.`),false);
      shake(V);
      await A.wait(1500);await reset();return;
    }
    if(got.has(key)){
      say(T('Đường này con đi rồi! Thử một đường <b>khác</b> nhé.','You already walked this one! Try a <b>different</b> route.'),false);
      shake(V);
      await A.wait(1500);await reset();return;
    }
    got.add(key);list.push({route:path.slice(),col});A.add();
    ghosts.forEach(g=>g.style.opacity=.22);
    ghosts.push(layer);layer=A.mk('g',{},V.lay.trail);
    const g=A.mk('text',{x:V.pos(cur[0],cur[1])[0],y:V.pos(cur[0],cur[1])[1]-34,'text-anchor':'middle','font-size':40,class:'pop',text:'🎉'},V.lay.top);setTimeout(()=>g.remove(),900);
    if(got.size>=total){done();return}
    say(T(`Hoan hô! Đó là cách số <b>${got.size}</b>. Còn cách nào khác không? Cứ thử tiếp nhé!`,`Hooray! That's route number <b>${got.size}</b>. Any other routes? Keep trying!`),false);
    path=[[0,0]];cur=[0,0];await A.wait(700);V.walkerTo(0,0);await A.wait(450);showTaps();
  }
  async function onTap(ni,nj){
    if(busy)return;busy=true;
    try{await doMove(ni,nj)}catch(e){if(e!=='cancel')console.error(e)}
    busy=false;
  }
  let done;
  async function hint(){
    if(busy)return;busy=true;
    try{
      const rest=all.filter(r=>!got.has(keyOf(r)));
      if(!rest.length){busy=false;return}
      layer.remove();layer=A.mk('g',{},V.lay.trail);path=[[0,0]];cur=[0,0];V.walkerTo(0,0,true);tapLayer.innerHTML='';
      say(T('Cú chỉ cho con một đường nè 👀','Here is one route for you 👀'),false);
      await A.wait(700);
      for(let k=1;k<rest[0].length;k++){await doMove(rest[0][k][0],rest[0][k][1])}
    }catch(e){if(e!=='cancel')console.error(e)}
    busy=false;
  }
  hintBtn(lang()==='vi'?'💡 Gợi ý':'💡 Hint',hint);
  showTaps();
  await A.until(res=>{done=res});
  tapLayer.remove();
  const c=document.getElementById('choices');c.innerHTML='';
  return {total,list};
}

/* ---------- number method ---------- */
function sourceValues(Tb,i,j){return[i>0?Tb[i-1][j]:null,j>0?Tb[i][j-1]:null]}
async function fillNums(A,V,b,o){
  o=o||{};
  const Tb=o.table||table(b),ask=o.ask||(()=>false),sw=srcWords(b),pw=placeWord(b);
  let edgeSaid=false;
  for(let j=0;j<b.ny;j++)for(let i=0;i<b.nx;i++){
    const v=Tb[i][j],isStart=i===0&&j===0;
    const blocked=!o.noBlock&&b.avoid.some(a=>a.i===i&&a.j===j);
    if(!isStart&&!blocked&&i>0&&j>0&&ask(i,j,v)){
      const [a,c]=sourceValues(Tb,i,j);
      const r1=V.ring(i-1,j,C.blue,24),r2=V.ring(i,j-1,C.orange,24),r3=V.ring(i,j,C.green,26);
      const pa=(i-1)+','+j,pc=i+','+(j-1);
      const sum=a+c;
      const wr=[];[a*c,sum+1,sum-1,a,c,sum+2].forEach(x=>{if(x>0&&x!==sum&&!wr.includes(x))wr.push(x)});
      const opts=shuffle([{label:String(sum),ok:true}].concat(wr.slice(0,3).map(x=>({label:String(x),ok:false}))),Math.random);
      A.say(T(`${pw.vi[0].toUpperCase()+pw.vi.slice(1)} này: ô ${sw[0].vi} có <b style="color:${C.blue}">${a}</b> cách, ô ${sw[1].vi} có <b style="color:${C.orange}">${c}</b> cách. Ô ở giữa có mấy cách?`,
              `This ${pw.en}: the one ${sw[0].en} has <b style="color:${C.blue}">${a}</b> routes, the one ${sw[1].en} has <b style="color:${C.orange}">${c}</b>. How many routes here?`),{speak:o.speak!==false});
      await A.choose(opts,()=>A.say(T(`Chưa đúng. Cộng hai số lại: <b style="color:${C.blue}">${a}</b> + <b style="color:${C.orange}">${c}</b> = ?`,`Not quite. Add the two numbers: <b style="color:${C.blue}">${a}</b> + <b style="color:${C.orange}">${c}</b> = ?`),{speak:false}));
      r1.remove();r2.remove();r3.remove();
      V.pill(i,j,v,C.green);
      await A.say(T(`<b style="color:${C.blue}">${a}</b> + <b style="color:${C.orange}">${c}</b> = <b>${v}</b> cách. Đúng rồi!`,`<b style="color:${C.blue}">${a}</b> + <b style="color:${C.orange}">${c}</b> = <b>${v}</b> routes. Right!`),{speak:false});
      await A.wait(500);
    }else{
      if(!isStart&&!edgeSaid&&(i===0||j===0)&&!blocked&&o.explainEdge){
        edgeSaid=true;
        await A.say(T(`Ở <b>hàng đầu</b> và <b>cột đầu</b>: chỉ có <b>1 cách</b> (đi thẳng). Ghi số 1!`,`On the <b>first row</b> and <b>first column</b>: only <b>1 route</b> (straight). Write 1!`),{speak:false});
      }
      V.pill(i,j,v,blocked?C.red:(isStart?C.green:C.ink));
      await A.wait(o.delay||150);
    }
  }
  E.setCount(Tb[b.nx-1][b.ny-1],true);
  return Tb;
}

/* ---------- multiply: legs between stops ---------- */
async function legsDemo(A,V,b,o){
  o=o||{};
  const lg=legs(b);
  const barY=BOXF.y+BOXF.h+36;
  const bar=A.mk('g',{},V.lay.top);
  for(let k=0;k<lg.length;k++){
    const l=lg[k],col=LEG[k];
    V.pillsClear();
    V.shade(l.a,l.z,col);
    // numbers in this leg
    for(let i=l.a[0];i<=l.z[0];i++)for(let j=l.a[1];j<=l.z[1];j++){
      V.pill(i,j,ways(l.a,[i,j]),col,{still:true});
    }
    const fromN=k===0?T('chỗ xuất phát','the start'):IT[b.via[k-1].k].n;
    const toN=k===lg.length-1?T('đích','the goal'):IT[b.via[k].k].n;
    const opts=shuffle([{label:String(l.n),ok:true}].concat([l.n+1,l.n+2,Math.max(1,l.n-1),l.n*2].filter((x,m,a)=>x!==l.n&&a.indexOf(x)===m).slice(0,3).map(x=>({label:String(x),ok:false}))),Math.random);
    A.say(T(`<b style="color:${col}">Đoạn ${k+1}</b>: từ <b>${tx(fromN)}</b> đến <b>${tx(toN)}</b>. Mình ghi số như cũ. Đoạn này có mấy cách?`,
            `<b style="color:${col}">Leg ${k+1}</b>: from <b>${tx(fromN)}</b> to <b>${tx(toN)}</b>. Same number trick. How many routes in this leg?`),{speak:o.speak!==false});
    await A.choose(opts,()=>A.say(T('Nhìn số ở ngã tư cuối của đoạn màu này nhé 👀','Look at the number at the last junction of this colour 👀'),{speak:false}));
  }
  // formula bar: a × b × c
  bar.innerHTML='';
  const parts=[];lg.forEach((l,k)=>{if(k)parts.push({t:'×',op:true});parts.push({t:String(l.n),col:LEG[k]})});
  const totalW=parts.reduce((s,p)=>s+(p.op?44:70),0);let x=W/2-totalW/2;
  parts.forEach(p=>{
    if(p.op){A.mk('text',{x:x+22,y:barY,'text-anchor':'middle','dominant-baseline':'central','font-size':40,'font-weight':800,fill:C.ink,class:'pop',text:'×'},bar);x+=44}
    else{const g=A.mk('g',{class:'pop'},bar);A.mk('rect',{x:x,y:barY-24,width:62,height:48,rx:16,fill:'#fff',stroke:p.col,'stroke-width':5},g);
      A.mk('text',{x:x+31,y:barY+1,'text-anchor':'middle','dominant-baseline':'central','font-size':32,'font-weight':800,fill:p.col,text:p.t},g);x+=70}
  });
  const ans=answer(b);
  const opts=options(b,ans,Math.random);
  A.say(T(`Mỗi cách của đoạn này <b>ghép</b> với mỗi cách của đoạn kia. Vậy phải <b>nhân</b> lại: ${lg.map(l=>l.n).join(' × ')} = ?`,
          `Every route of one leg <b>pairs</b> with every route of the other leg. So we <b>multiply</b>: ${lg.map(l=>l.n).join(' × ')} = ?`),{speak:o.speak!==false});
  await A.choose(opts,()=>A.say(T('Nhân các số trong ô màu nhé!','Multiply the coloured numbers!'),{speak:false}));
  A.mk('text',{x:W/2+totalW/2+16,y:barY,'dominant-baseline':'central','font-size':40,'font-weight':800,fill:'#d6245a',class:'pop',text:'= '+ans},bar);
  E.setCount(ans,true);
  return ans;
}

/* ---------- answer a question about a board ---------- */
function questionText(b){
  const th=TH[b.theme]||TH.mouse;
  let vi=`Có bao nhiêu đường đi ngắn nhất để ${th.who.vi} đến ${th.to.vi}`,en=`How many shortest routes lead ${th.who.en} to ${th.to.en}`;
  if(b.kind==='rooms'){vi=`Có bao nhiêu cách để ${th.who.vi} đi từ phòng đầu tiên đến ${th.to.vi}`;en=`How many ways can ${th.who.en} get from the first room to ${th.to.en}`}
  if(b.via.length){const n=joinNames(b.via.map(v=>IT[v.k].n));vi+=`, mà phải ghé qua ${n.vi}`;en+=`, stopping at ${n.en}`}
  if(b.avoid.length){const n=joinNames(b.avoid.map(v=>IT[v.k].n));vi+=`, mà không đi qua ${n.vi}`;en+=`, without passing ${n.en}`}
  const d=dirWords(b);
  return T(`${vi}, ${d.vi}?`,`${en}, ${d.en}?`);
}

  await A.say(T('Mary 👧 đi về nhà 🏠, lần này đi <b>sang phải →</b> và <b>lên ↑</b>. Hướng đổi nhưng cách làm <b>y hệt</b>: bắt đầu từ chỗ Mary đứng, ghi <b>1</b>.','Mary 👧 walks home 🏠, this time <b>right →</b> and <b>up ↑</b>. The direction changes but the trick is the <b>same</b>: start where Mary stands, write <b>1</b>.'));
  await fillNums(A,V,b,{ask:ASK([1,1],[3,1],[3,2]),delay:230,explainEdge:true});
  A.confetti();
  await A.say(T('Có <b>10 đường</b> đi ngắn nhất! Luôn ghi số <b>từ chỗ xuất phát</b>, hướng nào cũng được.','There are <b>10 shortest routes</b>! Always write numbers <b>from the start</b>, in any direction.'));
}});

/* 5 – the ant: diamond */
steps.push({base:0,run:async A=>{
  const b=mkBoard({kind:'diamond',nx:3,ny:3,theme:'ant'});
  const bs=mkBoard({nx:3,ny:3,theme:'ant'});
  const VD=drawBoard(A,b,{x:30,y:76,w:390,h:316},{actors:'out',items:'small'});
  await A.say(T('Chú kiến 🐜 đi xuống chỗ viên kẹo 🍬, mỗi bước đi <b>xuống bên trái ↙</b> hoặc <b>xuống bên phải ↘</b>. Hình xoay chéo, nhưng vẫn là bài toán cũ!','The ant 🐜 goes down to the candy 🍬, each step <b>down-left ↙</b> or <b>down-right ↘</b>. The shape is tilted, but it\'s the same puzzle!'));
  await fillNums(A,VD,b,{ask:ASK([1,1],[2,2]),delay:230,speak:false});
  const VS=drawBoard(A,bs,{x:470,y:100,w:300,h:240},{actors:'out',items:'small'});
  const Tb=table(bs);
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){VS.pill(i,j,Tb[i][j]);await A.wait(90)}
  A.mk('text',{x:445,y:210,'text-anchor':'middle','dominant-baseline':'central','font-size':40,class:'pop',text:'='});
  A.confetti();
  await A.say(T('Xoay hình lại thành ô vuông: các số <b>giống hệt nhau</b>! Đáp án vẫn là <b>6</b>.','Turn it into a square grid: the numbers are <b>exactly the same</b>! The answer is still <b>6</b>.'));
}});

/* 6 – rooms */
steps.push({base:0,run:async A=>{
  const b=mkBoard({kind:'rooms',nx:4,ny:3,theme:'room'});
  const V=drawBoard(A,b,{x:90,y:50,w:660,h:330},{actors:'room',items:'small'});
  await A.say(T('Hội trường có <b>12 phòng</b>. Mary 👧 đi sang phòng <b>bên cạnh</b>: <b>→</b> hoặc <b>↓</b>, để tới phòng Tom 👦. Lần này ta ghi số vào từng <b>phòng</b>!','The hall has <b>12 rooms</b>. Mary 👧 steps into a <b>neighbouring</b> room: <b>→</b> or <b>↓</b>, to reach Tom 👦. This time numbers go into the <b>rooms</b>!'));
  await fillNums(A,V,b,{ask:ASK([1,1],[2,1],[3,2]),delay:200,explainEdge:true});
  A.confetti();
  await A.say(T('Phòng của Tom ghi <b>10</b>: có <b>10 cách</b> để Mary đến được đó!','Tom\'s room says <b>10</b>: Mary has <b>10 ways</b> to get there!'));
}});

/* 7 – must stop at a place: find all routes */
steps.push({base:0,run:async A=>{
  const b=mkBoard({nx:3,ny:3,theme:'girl',items:[{k:'bakery',role:'via',c:1,r:1}]});
  const V=drawBoard(A,b,{x:150,y:46,w:540,h:340},{actors:'token',items:'big'});
  A.say(T('Mary 👧 về nhà 🏠 nhưng phải <b>ghé tiệm bánh 🧁</b> trên đường. Con dắt Mary đi, tìm <b>tất cả</b> các đường nhé!','Mary 👧 goes home 🏠 but must <b>stop at the bakery 🧁</b>. Guide Mary and find <b>all</b> the routes!'),{speak:false});
  const r=await findRoutes(A,V,b);
  A.confetti();
  await A.say(T(`Có <b>${r.total} đường</b> qua tiệm bánh. Cú hỏi: có cách nào <b>tính nhanh</b> không?`,`There are <b>${r.total} routes</b> through the bakery. Is there a <b>quick way</b> to count?`));
}});

/* 8 – multiply */
steps.push({base:0,run:async A=>{
  const b=mkBoard({nx:4,ny:4,theme:'girl',items:[{k:'bakery',role:'via',c:2,r:1}]});
  const V=drawBoard(A,b,BOXF,{actors:'out',items:'small'});
  await A.say(T('Mẹo: <b>cắt đường đi làm hai đoạn</b> tại tiệm bánh. Mỗi đoạn ta ghi số riêng, rồi <b>nhân</b> lại!','Trick: <b>cut the trip into two legs</b> at the bakery. Count each leg separately, then <b>multiply</b>!'));
  await legsDemo(A,V,b);
  A.confetti();
  await showCombos(A,V,b);
  await A.say(T('Đây là cả <b>9 đường</b>: mỗi đường <b>xanh</b> ghép với mỗi đường <b>cam</b>. Qua một nơi: <b>nhân</b> các đoạn.','Here are all <b>9 routes</b>: every <b>blue</b> part pairs with every <b>orange</b> part. Passing a stop: <b>multiply</b> the legs.'));
}});

/* 9 – must NOT pass */
steps.push({base:0,run:async A=>{
  const b=mkBoard({nx:6,ny:3,start:'tr',theme:'girl',items:[{k:'stadium',role:'avoid',c:2,r:1}]});
  const V=drawBoard(A,b,BOXF,{actors:'out',items:'small'});
  const bar=A.mk('g',{},V.lay.top);
  const barY=BOXF.y+BOXF.h+36;
  await A.say(T('Mary 👧 đi từ trường về nhà 🏠 (<b>← và ↓</b>) nhưng <b>không được đi qua sân vận động 🏟️</b>. Làm sao đếm?','Mary 👧 goes from school to home 🏠 (<b>← and ↓</b>) but must <b>not pass the stadium 🏟️</b>. How do we count?'));
  // step 1 total
  await A.say(T('<b>Bước 1</b>: đếm <b>tất cả</b> các đường, cứ coi như sân vận động không có.','<b>Step 1</b>: count <b>all</b> routes as if the stadium weren\'t there.'),{speak:false});
  const tot=table(b,true);
  await fillNums(A,V,b,{table:tot,noBlock:true,ask:(i,j)=>i===b.nx-1&&j===b.ny-1,delay:70});
  const total=tot[b.nx-1][b.ny-1];
  const t1=A.mk('text',{x:W/2,y:barY,'text-anchor':'middle','dominant-baseline':'central','font-size':34,'font-weight':800,fill:C.ink,class:'pop',text:E.lang==='vi'?`Tất cả: ${total}`:`All: ${total}`},bar);
  await A.wait(600);
  // step 2 through stadium
  V.pillsClear();
  await A.say(T('<b>Bước 2</b>: đếm các đường <b>có đi qua</b> sân vận động. (Cắt làm hai đoạn rồi nhân.)','<b>Step 2</b>: count the routes that <b>do pass</b> the stadium. (Two legs, then multiply.)'),{speak:false});
  const b2=mkBoard({nx:6,ny:3,start:'tr',theme:'girl',items:[{k:'stadium',role:'via',c:2,r:1}]});
  // reuse board visuals: shade legs
  const lg=legs(b2);
  for(let k=0;k<lg.length;k++){
    V.shade(lg[k].a,lg[k].z,LEG[k]);
    for(let i=lg[k].a[0];i<=lg[k].z[0];i++)for(let j=lg[k].a[1];j<=lg[k].z[1];j++){const key=i+','+j;if(k===1&&i===lg[k].a[0]&&j===lg[k].a[1])continue;V.pill(i,j,ways(lg[k].a,[i,j]),LEG[k],{still:true})}
    await A.wait(900);
  }
  const through=answer(b2);
  const op1=shuffle([{label:String(through),ok:true}].concat([through+1,through-2,lg[0].n+lg[1].n].filter((x,m,a)=>x>0&&x!==through&&a.indexOf(x)===m).slice(0,3).map(x=>({label:String(x),ok:false}))),Math.random);
  A.say(T(`Đoạn xanh có <b style="color:${C.blue}">${lg[0].n}</b> cách, đoạn cam có <b style="color:${C.orange}">${lg[1].n}</b> cách. Có bao nhiêu đường <b>đi qua</b> sân vận động?`,`The blue leg has <b style="color:${C.blue}">${lg[0].n}</b> routes, the orange one <b style="color:${C.orange}">${lg[1].n}</b>. How many routes <b>pass</b> the stadium?`),{speak:false});
  await A.choose(op1,()=>A.say(T('Nhân hai số lại nhé!','Multiply the two numbers!'),{speak:false}));
  t1.remove();
  A.mk('text',{x:W/2,y:barY,'text-anchor':'middle','dominant-baseline':'central','font-size':34,'font-weight':800,fill:C.ink,class:'pop',text:`${total} − ${through} = ?`},bar);
  const res=total-through;
  const op2=shuffle([{label:String(res),ok:true}].concat([total+through,through,res+2,res-1].filter((x,m,a)=>x>0&&x!==res&&a.indexOf(x)===m).slice(0,3).map(x=>({label:String(x),ok:false}))),Math.random);
  A.say(T(`<b>Bước 3</b>: lấy <b>tất cả</b> trừ đi các đường <b>qua sân vận động</b>: ${total} − ${through} = ?`,`<b>Step 3</b>: take <b>all</b> routes minus the ones <b>through the stadium</b>: ${total} − ${through} = ?`),{speak:false});
  await A.choose(op2,()=>A.say(T('Trừ đi nhé: lấy số lớn trừ số nhỏ.','Subtract: big number minus small number.'),{speak:false}));
  bar.innerHTML='';
  A.mk('text',{x:W/2,y:barY,'text-anchor':'middle','dominant-baseline':'central','font-size':38,'font-weight':800,fill:'#d6245a',class:'pop',text:`${total} − ${through} = ${res}`},bar);
  E.setCount(res,true);
  await A.say(T(`Có <b>${res} đường</b> không qua sân vận động.`,`There are <b>${res} routes</b> that avoid the stadium.`));
  // cách 2 – block
  V.pillsClear();V.lay.shade.innerHTML='';
  await A.say(T('<b>Cách khác</b>: <b>chặn đường</b>! Ở sân vận động ghi số <b>0</b> (không đi được), rồi ghi số như thường.','<b>Another way</b>: <b>block the road</b>! Write <b>0</b> at the stadium (can\'t go there), then do the number trick as usual.'));
  await fillNums(A,V,b,{delay:110});
  A.confetti();
  await A.say(T(`Đích ghi <b>${res}</b>. Hai cách cho cùng một đáp số!`,`The goal says <b>${res}</b>. Two methods, same answer!`));
}});

/* 10 – two stops */
steps.push({base:0,run:async A=>{
  const b=mkBoard({nx:6,ny:4,theme:'girl',items:[{k:'art',role:'via',c:2,r:1},{k:'piano',role:'via',c:3,r:2}]});
  const V=drawBoard(A,b,BOXF,{actors:'out',items:'small'});
  await A.say(T('Từ trường về nhà, Mary phải ghé <b>câu lạc bộ mĩ thuật 🎨</b> rồi <b>lớp đàn 🎹</b>. Hai điểm dừng thì cắt làm <b>3 đoạn</b>!','From school to home Mary must stop at the <b>art club 🎨</b> and the <b>piano class 🎹</b>. Two stops mean <b>3 legs</b>!'));
  await legsDemo(A,V,b);
  A.confetti();
  await showCombos(A,V,b,24);
  await A.say(T('Qua <b>hai nơi</b> thì nhân <b>ba</b> số: 3 × 2 × 3 = <b>18</b> đường.','With <b>two stops</b> multiply <b>three</b> numbers: 3 × 2 × 3 = <b>18</b> routes.'));
}});

/* 11 – summary */
steps.push({base:0,run:async A=>{
  panel(A);
  A.say(T('Ba mẹo của thám tử đường đi! 🗺️','Three tricks of a route detective! 🗺️'),{speak:false});
  const rows=[
    [C.blue,'1',T('Ghi số ở mỗi ngã tư','Number every junction'),T('trái + trên','left + above')],
    [C.orange,'2',T('Phải ghé qua một nơi','Must stop somewhere'),T('nhân các đoạn','multiply the legs')],
    [C.red,'3',T('Không được đi qua','Must not pass'),T('tất cả − đi qua','all − through')]];
  for(let k=0;k<rows.length;k++){
    const y=105+k*108,r=rows[k];const g=A.mk('g',{class:'fadein'});
    A.mk('rect',{x:46,y:y-40,width:748,height:86,rx:22,fill:r[0],'fill-opacity':.14,stroke:r[0],'stroke-width':4},g);
    A.mk('circle',{cx:92,cy:y+3,r:24,fill:r[0]},g);
    A.mk('text',{x:92,y:y+4,'text-anchor':'middle','dominant-baseline':'central','font-size':30,'font-weight':800,fill:'#fff',text:r[1]},g);
    A.mk('text',{x:134,y:y+3,'dominant-baseline':'central','font-size':30,'font-weight':800,fill:C.ink,text:tx(r[2])},g);
    A.mk('text',{x:770,y:y+3,'text-anchor':'end','dominant-baseline':'central','font-size':32,'font-weight':800,fill:r[0],text:tx(r[3])},g);
    await A.wait(900);
  }
  A.mk('text',{x:420,y:425,'text-anchor':'middle','dominant-baseline':'central','font-size':26,'font-weight':700,fill:C.ink,class:'fadein',text:E.lang==='vi'?'Hướng nào cũng vậy: luôn bắt đầu từ chỗ xuất phát = 1.':'Any direction works: always start with 1 at the start.'});
  await A.say(T('Nhớ nhé: đường đi ngắn nhất chỉ đi về phía đích, <b>không bao giờ đi lùi</b>. Sẵn sàng thử thách chưa?','Remember: a shortest route only goes toward the goal, <b>never back</b>. Ready for the challenge?'));
}});

/* 12 – challenge */
steps.push({base:0,run:async A=>{
  const types=['plain','diamond','rooms','via','avoid','via2'];
  const qs=types.map(t=>{let b;for(let n=0;n<40;n++){b=genBoard(t,Math.random);if(answer(b)<=26)break}return b});
  let stars=0;
  for(let q=0;q<qs.length;q++){
    clear();
    const b=qs[q],ans=answer(b);
    const V=drawBoard(A,b,{x:70,y:44,w:700,h:340},{actors:b.kind==='rooms'?'room':'out',items:'small'});
    A.mk('text',{x:20,y:24,'font-size':24,'font-weight':800,fill:C.ink,text:`${q+1}/${qs.length}`});
    A.mk('text',{x:820,y:24,'text-anchor':'end','font-size':24,'font-weight':800,fill:C.gold,text:'⭐'.repeat(stars)||'☆'});
    A.say(questionText(b),{speak:true});
    let tries=0,hinted=false;
    const opts=options(b,ans,Math.random);
    const pc=A.choose(opts,()=>{tries++;A.say(T('Chưa đúng, thử lại nhé! Cần thì bấm <b>💡 Xem số</b>.','Not yet, try again! Press <b>💡 Show numbers</b> if you like.'),{speak:false})});
    const hb=hintBtn(lang()==='vi'?'💡 Xem số':'💡 Show numbers',async()=>{
      if(hinted)return;hinted=true;hb.disabled=true;
      try{
        if(b.via.length){const lg=legs(b);lg.forEach((l,k)=>{V.shade(l.a,l.z,LEG[k]);for(let i=l.a[0];i<=l.z[0];i++)for(let j=l.a[1];j<=l.z[1];j++){if(k&&i===l.a[0]&&j===l.a[1])continue;V.pill(i,j,ways(l.a,[i,j]),LEG[k],{still:true})}})}
        else{const Tb=table(b);for(let j=0;j<b.ny;j++)for(let i=0;i<b.nx;i++){V.pill(i,j,Tb[i][j],i+j===0?C.green:C.ink);await A.wait(60)}}
      }catch(e){}
    });
    await pc;
    if(!tries&&!hinted){stars++;A.confetti()}
    await A.say(T(`<b>${ans}</b> đường! ${!tries&&!hinted?'Giỏi quá, đúng ngay lần đầu! ⭐':'Con làm được rồi!'}`,`<b>${ans}</b> routes! ${!tries&&!hinted?'Great, right on the first try! ⭐':'You got it!'}`),{speak:false});
    await A.wait(1100);
  }
  clear();panel(A);
  A.mk('text',{x:420,y:130,'text-anchor':'middle','font-size':84,class:'pop',text:stars>=5?'🏆':stars>=3?'🥈':'🥉'});
  A.mk('text',{x:420,y:240,'text-anchor':'middle','font-size':64,'font-weight':800,fill:C.ink,class:'pop',text:`${stars} / ${qs.length} ⭐`});
  A.mk('text',{x:420,y:320,'text-anchor':'middle','font-size':28,'font-weight':700,fill:C.ink,class:'fadein',text:E.lang==='vi'?'đúng ngay lần đầu, không xem gợi ý':'right first time, no hints'});
  A.confetti();
  await A.say(stars>=5?T('Tuyệt vời! Con là <b>thám tử đường đi</b> thực thụ! 🎉','Fantastic! You\'re a real <b>route detective</b>! 🎉'):T('Làm tốt lắm! Bấm <b>Chơi lại</b> để thử thách mới (đề sẽ khác mỗi lần) nhé!','Well done! Press <b>Play again</b> for new challenges (different every time)!'));
}});

E.setSteps(steps);
E.setFound([],()=>'');
E.init({
  pageTitle:T('Đường đi ngắn nhất','Shortest routes'),
  qTitle:T('Có bao nhiêu đường đi ngắn nhất?','How many shortest routes are there?'),
  nav:['n4'],
  cover:{title:T('Thám hiểm đường đi','Route Explorer'),sub:T('Có bao nhiêu đường đi ngắn nhất?<br>Cùng chuột Jerry và Cú Thông Thái tìm đường nhé!','How many shortest routes are there?<br>Help Jerry and Wise Owl find the way!')},
  finish:{label:T('Chơi lại','Play again'),icon:'↺',run:()=>{E.go(0)}}
});
})();

</script>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tank Fable II · Đại chiến xe tăng</title>
<meta name="description" content="Game xe tăng 3D: hạ các đợt xe tăng địch và 5 trùm cuối qua 5 vùng đất.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a1c;--olive:#3d4f2a;--olive2:#566b3a;--sand:#f3e7c4;--gold:#ffd23f;--red:#ff5a4e;--green:#4cc36b;--shadow:0 6px 0 rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#20281a;color:var(--ink);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 0}
.chip{background:rgba(31,42,28,.78);color:#fff;border:3px solid rgba(255,255,255,.85);border-radius:14px;padding:0 12px;font-weight:800;font-size:17px;line-height:1.7;white-space:nowrap}
.chip.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.sp{flex:1}
.ib{pointer-events:auto;background:#fff;border:3px solid var(--ink);border-radius:14px;min-width:42px;height:38px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.3);padding:0 8px}
.ib:active{transform:translateY(3px);box-shadow:none}
.ib.off{opacity:.5}
#hearts{font-size:20px;letter-spacing:1px}
#qwrap{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#qbox{background:#fffbea;border:4px solid var(--ink);border-radius:20px;padding:0 24px;font-weight:800;font-size:clamp(28px,6vw,48px);line-height:1.35;box-shadow:var(--shadow);white-space:nowrap}
#qbox.ok{background:#b8f5c8}
#qbox.pop{animation:qpop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes qpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
#bossbar{width:min(300px,70vw);height:22px;background:rgba(0,0,0,.55);border:3px solid #fff;border-radius:12px;overflow:hidden;position:relative}
#bossbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff3b30,#ff9f1c);transition:width .5s}
#bossbar b{position:absolute;inset:0;text-align:center;color:#fff;font-size:14px;line-height:16px;text-shadow:0 1px 2px #000}
#owl{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(255,251,234,.96);border:3px solid var(--ink);border-radius:18px;padding:4px 14px 4px 6px;max-width:min(620px,calc(100vw - 24px));font-size:clamp(15px,2.4vw,20px);font-weight:700;line-height:1.25;box-shadow:var(--shadow);transition:opacity .3s}
#owl .o{font-size:32px;flex:none}
#owl b{color:#d6245a}
#owl.flash{animation:owlf .5s}
@keyframes owlf{30%{transform:translateX(-50%) scale(1.06)}}
.touch #owl{bottom:calc(132px + env(safe-area-inset-bottom))}
#radar .ra{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-weight:800;color:#fff;text-shadow:0 2px 3px #000;font-size:18px}
#radar .ra i{font-style:normal;font-size:30px;color:var(--gold);line-height:1}
#radar .ra.boss i{color:#ff5a4e}
#fire{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb27a,#ff5a1e 60%,#c43a0c);border:5px solid #fff;font-size:44px;pointer-events:auto;box-shadow:0 6px 0 rgba(0,0,0,.35);touch-action:none}
#fire:active,#fire.on{transform:translateY(4px) scale(.96);box-shadow:none}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.18);border:4px solid rgba(255,255,255,.7);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid var(--ink)}
#joyHint{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 3px #000;opacity:.9}
#flashR{position:fixed;inset:0;background:radial-gradient(circle,transparent 45%,rgba(255,0,0,.55));opacity:0;pointer-events:none;z-index:3;transition:opacity .4s}
#flashR.on{opacity:1;transition:none}

/* screens */
.scr{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(18,24,14,.35)}
.scr.dim{background:rgba(18,24,14,.72)}
.card{width:min(620px,100%);background:var(--sand);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 rgba(0,0,0,.35);padding:18px 20px;text-align:center}
.card h1{margin:0;font-size:clamp(40px,10vw,72px);line-height:1;color:var(--olive);text-shadow:0 4px 0 var(--gold),0 7px 0 var(--ink);letter-spacing:1px}
.card h2{margin:4px 0 6px;font-size:clamp(24px,5vw,34px);line-height:1.1}
.card p{margin:6px 0;font-size:clamp(16px,3vw,20px);line-height:1.3}
.sub{font-weight:800;font-size:clamp(18px,4vw,24px);color:var(--olive2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--ink);border-radius:18px;padding:4px 22px;font-weight:800;font-size:22px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3);margin:6px 4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);font-size:26px;padding:6px 30px}
.btn.big{font-size:30px;padding:8px 38px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0 4px}
.mc{background:#fff;border:4px solid var(--ink);border-radius:20px;padding:8px 8px 6px;box-shadow:0 5px 0 rgba(0,0,0,.25);text-align:center;line-height:1.15}
.mc:active{transform:translateY(4px);box-shadow:none}
.mc .e{font-size:44px;line-height:1.1}
.mc .n{font-weight:800;font-size:20px}
.mc .t{font-size:15px;opacity:.85;min-height:36px}
.mc .s{font-size:20px;letter-spacing:2px}
.tank-emo{font-size:70px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.ctl{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 10px;margin:3px;font-weight:700;font-size:17px}
.stars{font-size:56px;letter-spacing:6px;line-height:1.1}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0}
.facts span{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 10px;font-weight:800;font-size:20px}
.lg b{opacity:.4}.lg b.on{opacity:1}
@media (max-width:600px){.chip{font-size:13px;padding:0 7px;border-width:2px}#hearts{font-size:12px;letter-spacing:0}#hScene .nm{display:none}.ib{height:32px;min-width:34px;font-size:15px}#top{gap:5px;padding-left:6px;padding-right:6px}#qwrap{top:calc(46px + env(safe-area-inset-top))}}
@media (max-height:520px){.card{padding:10px 16px}.tank-emo{font-size:46px}.card h1{font-size:44px}.mc .e{font-size:32px}.grid{gap:8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="top">
    <span class="chip" id="hScene"></span>
    <span class="chip gold" id="hProg"></span>
    <span class="chip gold hide" id="hPow"></span>
    <span class="sp"></span>
    <span class="chip" id="hearts"></span>
    <span class="chip" id="hScore">0</span>
    <button class="ib" id="bPause" aria-label="Pause">⏸</button>
  </div>
  <div id="qwrap"><div id="qbox">?</div><div id="bossbar" class="hide"><i></i><b id="bossTxt">BOSS</b></div></div>
  <div id="radar"></div>
  <div id="owl"><span class="o">📻</span><span id="owlT"></span></div>
  <div id="joyHint" class="hide"></div>
  <div id="joy" class="hide"><i></i></div>
  <button id="fire" class="hide" aria-label="Fire">💥</button>
</div>
<div id="flashR"></div>

<div class="scr" id="sCover">
  <div class="card">
    <div class="tank-emo">🪖🛡️</div>
    <h1>TANK FABLE II</h1>
    <div class="sub" data-vi="Đại chiến xe tăng" data-en="The Great Tank Battle"></div>
    <p data-vi="Lái xe tăng, né đạn và hạ từng đợt xe địch! Nhặt hộp ❤️ ⚡ 🛡️. 5 vùng đất, 5 trùm cuối." data-en="Drive your tank, dodge shells and wipe out wave after wave! Grab ❤️ ⚡ 🛡️ crates. 5 lands, 5 bosses."></p>
    <button class="btn go big" id="bPlay"><span data-vi="Chơi ngay" data-en="Play"></span> ▶</button>
    <div class="row"><button class="btn lg" id="bLang"><b class="vi">VI</b>·<b class="en">EN</b></button><button class="btn" id="bSnd">🔊</button></div>
  </div>
</div>

<div class="scr dim hide" id="sMenu">
  <div class="card" style="width:min(860px,100%)">
    <h2 data-vi="Chọn vùng đất" data-en="Choose a land"></h2>
    <div class="grid" id="mGrid"></div>
    <div class="row"><button class="btn" id="bMenuBack">◀ <span data-vi="Trang đầu" data-en="Title"></span></button></div>
  </div>
</div>

<div class="scr dim hide" id="sBrief">
  <div class="card">
    <div class="tank-emo" id="brE"></div>
    <h2 id="brN"></h2>
    <div class="sub" id="brT"></div>
    <p id="brD"></p>
    <div id="brC"></div>
    <div class="row"><button class="btn" id="bBriefBack">◀</button><button class="btn go" id="bGo"><span data-vi="Xuất phát!" data-en="Roll out!"></span> 🚀</button></div>
  </div>
</div>

<div class="scr dim hide" id="sPause">
  <div class="card">
    <h2 data-vi="Tạm dừng" data-en="Paused"></h2>
    <p id="pCtl"></p>
    <div class="row"><button class="btn go" id="bResume">▶ <span data-vi="Chơi tiếp" data-en="Resume"></span></button></div>
    <div class="row"><button class="btn" id="bSnd2">🔊</button><button class="btn" id="bRestart">↺ <span data-vi="Chơi lại màn" data-en="Restart"></span></button><button class="btn" id="bQuit">🗺️ <span data-vi="Bản đồ" data-en="Map"></span></button></div>
  </div>
</div>

<div class="scr dim hide" id="sResult">
  <div class="card">
    <h2 id="rTitle"></h2>
    <div class="stars" id="rStars"></div>
    <p id="rScore"></p>
    <div id="rFactsH"></div>
    <div class="facts" id="rFacts"></div>
    <div class="row"><button class="btn" id="bRMap">🗺️ <span data-vi="Bản đồ" data-en="Map"></span></button><button class="btn" id="bRAgain">↺ <span data-vi="Chơi lại" data-en="Again"></span></button><button class="btn go" id="bRNext"><span data-vi="Màn tiếp" data-en="Next land"></span> ▶</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('tank2-lang')==='en'?'en':'vi';
const L=(vi,en)=>({vi,en});const t=o=>o==null?'':typeof o==='string'?o:(o[lang]||o.vi);
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angN=a=>{a=(a+Math.PI)%(2*Math.PI);if(a<0)a+=2*Math.PI;return a-Math.PI};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(TOUCH)document.body.classList.add('touch');

/* ================= lands ================= */
const R=62; // arena radius
const SC=[
 {key:'grass',emoji:'🌳',name:L('Đồng cỏ xanh','Green Meadow'),topic:L('🔥 Tân binh · xe trinh sát','🔥 Rookie · scout tanks'),
  sky:[0x4f9ee8,0xd6efff],fog:0xcbe7fb,fogN:70,fogF:280,ground:[0x6cb04a,0x569a3a],hill:0x3f7f2e,hemi:[0xffffff,0x4f7a32,.6],sun:[0xfff1d0,.95],
  props:'grass',enemy:0xd9534f,boss:0x8a2b22,n:6,k:3,fire:7,boss_n:L('Tướng Bò Tót','General Bull')},
 {key:'desert',emoji:'🌵',name:L('Sa mạc vàng','Golden Desert'),topic:L('🔥🔥 Có xe hạng nặng','🔥🔥 Heavy tanks appear'),
  sky:[0xe58b3c,0xffe0a3],fog:0xf4d6a0,fogN:60,fogF:260,ground:[0xd9b06a,0xc89a52],hill:0xc08a44,hemi:[0xfff4dd,0x9c7240,.55],sun:[0xffe0b0,.85],
  props:'desert',enemy:0x2e5fa8,boss:0x23396b,n:6,k:3,fire:6.5,boss_n:L('Bọ Cạp Sắt','Iron Scorpion')},
 {key:'snow',emoji:'❄️',name:L('Rừng tuyết','Snow Forest'),topic:L('🔥🔥 Rừng rậm, tuyết rơi','🔥🔥 Thick woods, falling snow'),
  sky:[0x7fa6d6,0xeaf2fb],fog:0xe1ebf6,fogN:45,fogF:220,ground:[0xf4f8fc,0xdde7f2],hill:0xeaf0f8,hemi:[0xffffff,0x8aa0bb,.85],sun:[0xffffff,.85],
  props:'snow',snow:true,enemy:0xc0392b,boss:0x6e1a12,n:6,k:4,fire:6,boss_n:L('Gấu Băng','Ice Bear')},
 {key:'city',emoji:'🌃',name:L('Thành phố đêm','Night City'),topic:L('🔥🔥🔥 Đánh đêm, nhiều địch','🔥🔥🔥 Night fight, more enemies'),
  sky:[0x070b26,0x2a2f62],fog:0x141938,fogN:50,fogF:230,ground:[0x3b4152,0x333847],hill:0x23273a,hemi:[0x8896ff,0x1a1a2a,.55],sun:[0xb0bcff,.55],
  props:'city',night:true,enemy:0x9b59b6,boss:0x4a1f63,n:6,k:4,fire:5.5,boss_n:L('Cú Đêm Thép','Steel Night-Owl')},
 {key:'lava',emoji:'🌋',name:L('Núi lửa','Volcano'),topic:L('🔥🔥🔥 Thử thách cuối','🔥🔥🔥 The final challenge'),
  sky:[0x220a0d,0x7d2c18],fog:0x3a1612,fogN:45,fogF:220,ground:[0x413733,0x342c29],hill:0x2b2321,hemi:[0xffb488,0x2a0c0c,.6],sun:[0xffa060,.85],
  props:'lava',embers:true,enemy:0x8e9aa6,boss:0x1a1a1a,n:7,k:4,fire:5,boss_n:L('Rồng Dung Nham','Lava Dragon')}
];

/* ================= three.js setup ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,TOUCH?1.5:1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,.5,1200);
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=true;
sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:220});sun.shadow.bias=-.0006;
scene.add(sun,sun.target);
const head=new THREE.SpotLight(0xfff0c8,0,70,.55,.6,1);scene.add(head,head.target);
let world=new THREE.Group();scene.add(world);
const dyn=new THREE.Group();scene.add(dyn);   // tanks, shells, particles

function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?74:60;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const col=h=>new THREE.Color(h);
const STD=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.8,metalness:.05},o||{}));
const PH=(c,o)=>new THREE.MeshPhongMaterial(Object.assign({color:c,flatShading:true,shininess:4},o||{}));
function shadowAll(o,cast,recv){o.traverse(m=>{if(m.isMesh){m.castShadow=cast;m.receiveShadow=recv}});return o}
function disposeTree(o){o.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material){(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>{if(x.map)x.map.dispose();if(x.emissiveMap&&x.emissiveMap!==x.map)x.emissiveMap.dispose();x.dispose()})}})}

/* ---------- obstacles ---------- */
let OB=[];
function collide(e,rad){
  for(const o of OB){
    if(o.box){
      const cx=clamp(e.x,o.x-o.hw,o.x+o.hw),cz=clamp(e.z,o.z-o.hd,o.z+o.hd);
      let dx=e.x-cx,dz=e.z-cz,d=Math.hypot(dx,dz);
      if(d<rad){if(d<1e-4){dx=e.x-o.x;dz=0;d=Math.abs(dx)||1}e.x=cx+dx/d*rad;e.z=cz+dz/d*rad;e.bump=1}
    }else{
      const dx=e.x-o.x,dz=e.z-o.z,d=Math.hypot(dx,dz)||1e-3,m=o.r+rad;
      if(d<m){e.x=o.x+dx/d*m;e.z=o.z+dz/d*m;e.bump=1}
    }
  }
  const d=Math.hypot(e.x,e.z),m=R-2-rad*.5;if(d>m){e.x*=m/d;e.z*=m/d;e.bump=1}
}
function blocked(x,z,rad){
  for(const o of OB){
    if(o.low)continue;
    if(o.box){if(Math.abs(x-o.x)<o.hw+rad&&Math.abs(z-o.z)<o.hd+rad)return true}
    else if(Math.hypot(x-o.x,z-o.z)<o.r+rad)return true;
  }
  return false;
}
function freeSpot(minR,maxR,clear,tries){
  for(let k=0;k<(tries||60);k++){
    const a=rnd()*Math.PI*2,r=minR+Math.sqrt(rnd())*(maxR-minR),x=Math.sin(a)*r,z=Math.cos(a)*r;
    let ok=true;
    for(const o of OB){const ex=o.box?Math.max(o.hw,o.hd):o.r;if(Math.hypot(x-o.x,z-o.z)<ex+clear){ok=false;break}}
    if(ok)return [x,z];
  }
  return null;
}

/* ---------- world builders ---------- */
function tnoise(x,z){return Math.sin(x*.071)*Math.cos(z*.063)+Math.sin((x+z)*.13)*.5+Math.sin(x*.31-z*.27)*.25}
let envFx=[];  // per-frame updaters for the land
function buildWorld(si){
  dyn.children.slice().forEach(o=>{dyn.remove(o)});
  scene.remove(world);disposeTree(world);world=new THREE.Group();scene.add(world);
  OB=[];OCC=[];envFx=[];
  const s=SC[si];
  scene.fog=new THREE.Fog(s.fog,s.fogN,s.fogF);
  hemi.color.set(s.hemi[0]);hemi.groundColor.set(s.hemi[1]);hemi.intensity=s.hemi[2];
  sun.color.set(s.sun[0]);sun.intensity=s.sun[1];
  head.intensity=s.night?1.6:0;
  // sky dome
  const sg=new THREE.SphereGeometry(700,32,16),cs=[];const top=col(s.sky[0]),bot=col(s.sky[1]);
  const pa=sg.attributes.position;
  for(let i=0;i<pa.count;i++){const y=pa.getY(i)/700,c=bot.clone().lerp(top,clamp((y+.05)/.7,0,1));cs.push(c.r,c.g,c.b)}
  sg.setAttribute('color',new THREE.Float32BufferAttribute(cs,3));
  world.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false})));
  // ground

    if(!blocked(x,z,3))return [x,z]}

}

      for(const o of enemies){if(o===e||o.state==='leave')continue;const dx=e.x-o.x,dz=e.z-o.z,d=Math.hypot(dx,dz)||1,m=2.3*(e.s+o.s);if(d<m){const k=(m-d)/2;e.x+=dx/d*k;e.z+=dz/d*k}}
      if(boss&&!boss.dying){const dx=e.x-boss.x,dz=e.z-boss.z,d=Math.hypot(dx,dz)||1,m=2.3*e.s+4.4;if(d<m){e.x+=dx/d*(m-d);e.z+=dz/d*(m-d)}}

function updShells(dt){

      const want=Math.atan2(s.tgt.x-s.x,s.tgt.z-s.z),cur=Math.atan2(s.vx,s.vz),na=cur+clamp(angN(want-cur),-2.5*dt,2.5*dt),sp=Math.hypot(s.vx,s.vz);
      s.vx=Math.sin(na)*sp;s.vz=Math.cos(na)*sp;
    }
    s.x+=s.vx*dt;s.z+=s.vz*dt;s.m.position.set(s.x,s.y,s.z);
    if(s.own==='e'&&rnd()<.5)part({x:s.x,y:s.y,z:s.z,c:0xff6a3a,sph:true,add:true,s:.35,s1:.05,life:.25,op:.8});
    if(s.own==='p'&&rnd()<.6)part({x:s.x,y:s.y,z:s.z,c:0xfff0a0,sph:true,add:true,s:.25,s1:.05,life:.2,op:.8});
    let dead=s.life<=0||Math.hypot(s.x,s.z)>R+4;
    if(!dead&&blocked(s.x,s.z,.3)){dead=true;puff(s.x,s.y,s.z,0xbbbbbb,.8);sparks(s.x,s.y,s.z)}
    if(!dead&&s.own==='p'){
      for(const e of enemies){if(!live(e))continue;if(Math.hypot(e.x-s.x,e.z-s.z)<2.6*e.s){dead=true;hitEnemy(e,s);break}}
      if(!dead&&boss&&!boss.dying&&Math.hypot(boss.x-s.x,boss.z-s.z)<4.8){dead=true;hitBoss(s)}
    }
    if(!dead&&s.own==='e'&&P.alive&&Math.hypot(P.x-s.x,P.z-s.z)<(P.shield>0?4:2.5)){dead=true;hurtPlayer(s)}
    if(dead){dyn.remove(s.m);s.m.material.dispose();shells.splice(i,1)}
  }
}
function hitEnemy(e,s){

const radarEls=[];const v3=new THREE.Vector3();
function updRadar(){
  const list=[];
  if(G.mode==='play'){
    enemies.forEach(e=>{if(live(e))list.push({x:e.x,y:3,z:e.z,lbl:e.T.emo})});
    if(boss&&!boss.dying)list.push({x:boss.x,y:4,z:boss.z,lbl:'BOSS',boss:true});
  }
  const W=innerWidth,H=innerHeight;let n=0;
  list.forEach(o=>{
    v3.set(o.x,o.y,o.z).project(camera);
    const behind=v3.z>1;let x=v3.x,y=v3.y;if(behind){x=-x;y=-y}
    if(!behind&&Math.abs(x)<.92&&Math.abs(y)<.86)return;
    const a=Math.atan2(y,x),m=Math.max(Math.abs(Math.cos(a))/.9,Math.abs(Math.sin(a))/.78);
    const px=(Math.cos(a)/m*.5+.5)*W,py=(-Math.sin(a)/m*.5+.5)*H;
    let el=radarEls[n];if(!el){el=document.createElement('div');el.className='ra';el.innerHTML='<i>➤</i><span></span>';$('radar').appendChild(el);radarEls[n]=el}
    el.style.display='';el.style.left=clamp(px,40,W-40)+'px';el.style.top=clamp(py,70,H-60)+'px';
    el.firstChild.style.transform=`rotate(${-a}rad)`;el.lastChild.textContent=o.lbl;el.classList.toggle('boss',!!o.boss);n++;
  });

}

/* ---------- camera ---------- */
function updCamera(dt){

    camera.position.x+=(tx-camera.position.x)*Math.min(1,dt*5);camera.position.z+=(tz-camera.position.z)*Math.min(1,dt*5);camera.position.y+=(up-camera.position.y)*Math.min(1,dt*3);

  }
  if(G.shake>0){camera.position.x+=(rnd()-.5)*G.shake;camera.position.y+=(rnd()-.5)*G.shake*.6;G.shake=Math.max(0,G.shake-dt*2.2)}
  const fx=P.tk?P.x:0,fz=P.tk?P.z:0;
  sun.position.set(fx+40,70,fz+25);sun.target.position.set(fx,0,fz);
}

/* ---------- main loop ---------- */
let last=performance.now(),hudT=0;G.ts=1;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000)*G.ts;last=now;
  if(G.ts>1)dt=Math.min(dt,.05*G.ts);
  const steps=G.ts>1?Math.ceil(G.ts):1,sdt=dt/steps;
  for(let k=0;k<steps;k++){
    const live=G.mode==='play'&&!G.paused;
    if(live){
      G.time+=sdt;
      for(let i=S.timers.length-1;i>=0;i--){const tm=S.timers[i];tm.t-=sdt;if(tm.t<=0){S.timers.splice(i,1);tm.fn()}}
      if(P.alive)updPlayer(sdt);updWave(sdt);updEnemies(sdt);updBoss(sdt);updShells(sdt);updPickups(sdt);updParts(sdt);updFloats(sdt);hudT-=sdt;if(hudT<=0){hudT=.25;hud()}
    }else if(!G.paused){G.time+=sdt;updParts(sdt);updFloats(sdt);if(P.tk){P.tk.tur.rotation.y=Math.sin(G.time*.6)*.6}}
    if(!G.paused)envFx.forEach(f=>f(sdt,camera.position.x,camera.position.z));
  }
  updCamera(dt||.016);updOcc(dt||.016);
  renderer.render(scene,camera);
  updRadar();
}

/* ---------- screens & input ---------- */
const SCREENS=['sCover','sMenu','sBrief','sPause','sResult'];
function show(id){SCREENS.forEach(s=>$(s).classList.toggle('hide',s!==id))}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-vi]').forEach(e=>{e.innerHTML=e.getAttribute('data-'+lang)});
  document.querySelectorAll('.lg .vi').forEach(e=>e.classList.toggle('on',lang==='vi'));document.querySelectorAll('.lg .en').forEach(e=>e.classList.toggle('on',lang==='en'));
  document.title=lang==='vi'?'Tank Fable II · Đại chiến xe tăng':'Tank Fable II · The Great Tank Battle';
  buildMenu();if(S)hud();
}
function buildMenu(){
  const st=stars();
  $('mGrid').innerHTML=SC.map((s,i)=>`<button class="mc" data-i="${i}"><div class="e">${s.emoji}</div><div class="n">${i+1}. ${t(s.name)}</div><div class="t">${t(s.topic)}</div><div class="s">${'⭐'.repeat(st[s.key]||0)}${'☆'.repeat(3-(st[s.key]||0))}</div></button>`).join('');
  $('mGrid').querySelectorAll('.mc').forEach(b=>b.onclick=()=>{sfx('click');openBrief(+b.dataset.i)});
}
function toMenu(){G.mode='menu';G.paused=false;engineSet(0);$('hud').classList.add('hide');buildMenu();show('sMenu')}
function openBrief(i){
  G.si=i;const s=SC[i];G.mode='brief';
  if(G.shownWorld!==i){buildWorld(i);spawnPlayer();G.shownWorld=i}
  $('brE').textContent=s.emoji;$('brN').textContent=`${i+1}. ${t(s.name)}`;$('brT').textContent=t(s.topic);
  $('brD').innerHTML=t(L(`Hạ <b>${WAVES} đợt</b> xe tăng địch, rồi đánh bại trùm <b>${t(s.boss_n)}</b>!`,`Beat <b>${WAVES} waves</b> of enemy tanks, then defeat boss <b>${t(s.boss_n)}</b>!`));
  $('brC').innerHTML=(TOUCH?[L('👈 Kéo bên trái để lái','👈 Drag left side to drive'),L('💥 Nút bắn bên phải','💥 Fire button on the right')]:[L('⬆️ ⬇️ Chạy tới / lùi','⬆️ ⬇️ Drive / reverse'),L('⬅️ ➡️ Quay xe','⬅️ ➡️ Turn'),L('Space: Bắn','Space: Fire'),L('P: Tạm dừng','P: Pause')]).map(x=>`<span class="ctl">${t(x)}</span>`).join('')+`<p>${t(L('🎯 Nòng súng tự ngắm vào xe ở phía trước (vòng vàng).','🎯 The cannon auto-aims at the tank in front (yellow ring).'))}<br>${t(L('Hộp quà: ❤️ sửa xe · ⚡ bắn nhanh · 🛡️ khiên','Crates: ❤️ repair · ⚡ rapid fire · 🛡️ shield'))}</p>`;
  show('sBrief');
}
function pause(on){
  if(G.mode!=='play')return;G.paused=on;engineSet(0);
  $('pCtl').innerHTML=t(ctlText());show(on?'sPause':null);
}
$('bPlay').onclick=()=>{ac();sfx('click');toMenu()};
$('bLang').onclick=()=>{lang=lang==='vi'?'en':'vi';store.set('tank2-lang',lang);applyLang()};
$('bSnd').onclick=()=>{ac();setSnd(!sndOn)};$('bSnd2').onclick=()=>{ac();setSnd(!sndOn)};
$('bMenuBack').onclick=()=>{G.mode='cover';show('sCover')};
$('bBriefBack').onclick=()=>toMenu();
$('bGo').onclick=()=>{ac();sfx('click');G.shownWorld=null;startMission(G.si)};
$('bPause').onclick=()=>pause(true);
$('bResume').onclick=()=>pause(false);
$('bRestart').onclick=()=>{G.paused=false;G.shownWorld=null;startMission(G.si)};
$('bQuit').onclick=()=>{G.shownWorld=G.si;toMenu()};
$('bRMap').onclick=()=>{G.shownWorld=G.si;toMenu()};
$('bRAgain').onclick=()=>{G.shownWorld=null;startMission(G.si)};
$('bRNext').onclick=()=>{openBrief(Math.min(SC.length-1,G.si+1))};

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(G.mode!=='play')return;
  if(k===' '||k==='j'||k==='enter'){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(!G.paused){fireHeld=true;fire()}}
  if(k==='p'&&!e.repeat)pause(!G.paused);
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k===' '||k==='j'||k==='enter')fireHeld=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fireHeld=false;if(G.mode==='play'&&!G.paused)pause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play'&&!G.paused)pause(true)});
// touch / mouse on canvas
canvas.addEventListener('pointerdown',e=>{
  ac();if(G.mode!=='play'||G.paused)return;
  if(e.pointerType==='mouse'){fire();return}
  if(e.clientX<innerWidth*.6&&!joy.on){joy.on=true;joy.id=e.pointerId;joy.x0=e.clientX;joy.y0=e.clientY;joy.dx=joy.dy=0;const j=$('joy');j.classList.remove('hide');j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';j.firstElementChild.style.transform='';$('joyHint').classList.add('hide')}
  else fire();
});
addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x0,dy=e.clientY-joy.y0;const d=Math.hypot(dx,dy),m=55;if(d>m){dx*=m/d;dy*=m/d}joy.dx=dx;joy.dy=dy;$('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`});
const joyEnd=e=>{if(joy.on&&e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0;$('joy').classList.add('hide')}};
addEventListener('pointerup',joyEnd);addEventListener('pointercancel',joyEnd);
const fb=$('fire');
fb.addEventListener('pointerdown',e=>{e.preventDefault();ac();fireHeld=true;fb.classList.add('on');fire()});
const fu=()=>{fireHeld=false;fb.classList.remove('on')};fb.addEventListener('pointerup',fu);fb.addEventListener('pointercancel',fu);fb.addEventListener('pointerleave',fu);
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- boot ---------- */
setSnd(sndOn);applyLang();
buildWorld(0);spawnPlayer();G.shownWorld=0;
// a few parked tanks for the title screen
[[8,6,0xd9534f],[-9,9,0x3f6fc6]].forEach(([x,z,c])=>{const tk=makeTank(c,1);tk.g.position.set(P.x+x,0,P.z+z);tk.g.rotation.y=Math.atan2(-x,-z);dyn.add(tk.g)});
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load)document.fonts.load('800 40px "Baloo 2"');
window.__t={G,P,get S(){return S},get enemies(){return enemies},get boss(){return boss},startMission,openBrief,toMenu,SC,
  killAll(){enemies.filter(live).forEach(e=>{e.hp=1;hitEnemy(e,{x:e.x,y:2,z:e.z})});return 1},
  hitBoss(n){for(let k=0;k<(n||1)&&boss&&!boss.dying;k++)hitBoss({x:boss.x,y:2,z:boss.z});return 1},
  drop(x,z){maybeDrop(x,z,1);return 1}};
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mars Rover Explorer</title>
<meta name="description" content="Drive a rover across seven Mars missions, drill rocks and answer science questions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c4562d'/%3E%3Ccircle cx='22' cy='24' r='6' fill='%23a3431f'/%3E%3Ccircle cx='42' cy='40' r='8' fill='%23a3431f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12080f; --ink:#fff4ea; --mute:#c9a794; --card:rgba(30,14,20,.86); --line:rgba(255,190,150,.22);
  --mars:#ff7a3d; --mars2:#ffb067; --sci:#3fe0cf; --ok:#52e08a; --bad:#ff5d6c; --warn:#ffd166;
  --h:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --b:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--b);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:12px 22px;font:800 18px var(--h);color:#2a0f06;background:linear-gradient(180deg,#ffc48a,#ff8a45);box-shadow:0 4px 0 #a8461a,0 8px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8461a}
.btn.alt{background:linear-gradient(180deg,#8ff0e4,#2fc7b6);box-shadow:0 4px 0 #17776d,0 8px 18px rgba(0,0,0,.35);color:#05302b}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
.btn.small{padding:7px 14px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.45;pointer-events:none}

/* screens */
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.scr{width:min(1040px,96vw);max-height:96vh;overflow:auto;padding:22px 24px;touch-action:pan-y}
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:fixed;inset:0;justify-content:flex-start;padding-top:7vh;pointer-events:none}
.title>*{pointer-events:auto}
.title h1{font:800 clamp(40px,8vw,84px)/0.95 var(--h);margin:0;letter-spacing:.5px;color:#fff3e6;text-shadow:0 3px 0 #b4491e,0 6px 0 #6e2610,0 14px 28px rgba(0,0,0,.5)}
.title h1 small{display:block;font:800 clamp(14px,2.4vw,24px) var(--h);letter-spacing:7px;color:var(--mars2);text-shadow:0 2px 8px #000;margin-bottom:4px}
.title p{margin:6px 0 10px;color:#ffe2c8;font-weight:700;text-shadow:0 2px 8px #000;max-width:560px;padding:0 14px}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8px}
.menu .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;background:rgba(0,0,0,.4);border-radius:14px;padding:4px;gap:4px;border:1.5px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);font:800 15px var(--h);padding:7px 15px;border-radius:10px}
.seg button.on{background:linear-gradient(180deg,#ffc48a,#ff8a45);color:#2a0f06}
h2{font:800 clamp(24px,4vw,36px) var(--h);margin:0 0 4px}
h3{font:800 20px var(--h);margin:0}
.sub{color:var(--mute);font-weight:700;margin:0 0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}

/* map */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mc{position:relative;border-radius:18px;padding:14px;background:linear-gradient(160deg,rgba(255,150,90,.18),rgba(255,255,255,.04));border:1.5px solid var(--line);text-align:left;color:var(--ink);transition:transform .12s,border-color .12s;min-height:150px;display:flex;flex-direction:column;gap:4px}
.mc:hover{transform:translateY(-3px);border-color:var(--mars2)}
.mc .n{position:absolute;top:10px;right:12px;font:800 15px var(--h);color:var(--mars2)}
.mc .e{font-size:38px;line-height:1}
.mc .nm{font:800 20px var(--h)}
.mc .tg{font-size:13px;color:var(--mute);font-weight:700}
.mc .st{margin-top:auto;font-size:22px;letter-spacing:2px}
.mc.lock{opacity:.5;filter:grayscale(.7);pointer-events:none}
.mc.lock::after{content:'🔒';position:absolute;right:12px;bottom:10px;font-size:22px}
.star{color:#ffd24a;text-shadow:0 0 8px rgba(255,200,60,.5)}
.star.off{color:#5b4a48;text-shadow:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.hbox{background:rgba(20,8,12,.72);border:1.5px solid var(--line);border-radius:14px;padding:7px 11px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.gauges{display:flex;flex-direction:column;gap:5px;min-width:170px}
.g{display:flex;align-items:center;gap:7px;font:800 13px var(--h)}
.g .bar{flex:1;height:11px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;min-width:100px}
.g .bar i{display:block;height:100%;width:100%;border-radius:7px;background:linear-gradient(90deg,#ffd166,#52e08a);transition:width .15s}
.g.hull .bar i{background:linear-gradient(90deg,#ff5d6c,#ffb067)}
.g.low .bar i{background:#ff5d6c;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
.objs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font:800 15px var(--h);margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip.ok{background:rgba(82,224,138,.28)}
.hb{display:flex;gap:6px;margin-left:auto}
.ib{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:rgba(20,8,12,.72);color:var(--ink);font-size:20px;line-height:1}
#mini{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:168px;height:112px;border-radius:12px;border:1.5px solid var(--line);background:rgba(20,8,12,.7);z-index:5;pointer-events:none}
#msg{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;max-width:min(560px,92vw);pointer-events:none}
.toast{background:rgba(20,8,12,.9);border:1.5px solid var(--mars2);padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;line-height:1.35;text-align:center;animation:pop .25s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.sci{border-color:var(--sci)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
#scan{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;font:800 16px var(--h);text-shadow:0 2px 6px #000}
#scan .ring{width:74px;height:74px;border-radius:50%;margin:0 auto 4px;background:conic-gradient(var(--sci) var(--p,0%),rgba(255,255,255,.15) 0);display:flex;align-items:center;justify-content:center}
#scan .ring i{width:58px;height:58px;border-radius:50%;background:rgba(10,4,8,.85);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,190,140,.55);border:2px solid rgba(255,255,255,.6)}
#boost{position:fixed;left:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:2px solid var(--line);background:rgba(255,122,61,.55);color:#fff;font:800 14px var(--h)}

/* modal */
#ov{position:fixed;inset:0;background:rgba(8,3,6,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal{width:min(720px,100%);max-height:96vh;overflow:auto;padding:20px 22px;touch-action:pan-y}
.badge{display:inline-flex;align-items:center;gap:6px;font:800 13px var(--h);letter-spacing:1px;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:rgba(63,224,207,.18);color:var(--sci);margin-bottom:8px}
.badge.lab{background:rgba(255,176,103,.18);color:var(--mars2)}
.q{font:800 clamp(19px,3.4vw,26px)/1.25 var(--h);margin:2px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:800 clamp(15px,2.6vw,19px)/1.25 var(--b);display:flex;gap:11px;align-items:center;transition:transform .08s,background .12s,border-color .12s}
.opt:hover{border-color:var(--mars2);background:rgba(255,176,103,.14)}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font:800 15px var(--h)}
.opt.ok{border-color:var(--ok);background:rgba(82,224,138,.22)}
.opt.bad{border-color:var(--bad);background:rgba(255,93,108,.16);opacity:.55;pointer-events:none;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
.shake{animation:shake .35s}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;line-height:1.4;background:rgba(82,224,138,.14);border:1.5px solid rgba(82,224,138,.5)}
.fb.bad{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.5)}
.fb b{font-family:var(--h)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
.ord{display:flex;flex-wrap:wrap;gap:10px}
.tile{padding:12px 15px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:800 clamp(15px,2.6vw,18px) var(--b);position:relative;text-align:left}
.tile.done{border-color:var(--ok);background:rgba(82,224,138,.2);pointer-events:none}
.tile.done::before{content:attr(data-n);position:absolute;left:-8px;top:-10px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#06240f;font:800 14px/24px var(--h);text-align:center}
.slots{display:flex;gap:6px;margin-bottom:12px}
.slots i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14)}
.slots i.on{background:var(--ok)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.pairs .tile.sel{border-color:var(--mars2);background:rgba(255,176,103,.22)}
.pairs .tile.m1{border-color:#52e08a;background:rgba(82,224,138,.2)}
.pairs .tile.m2{border-color:#3fb6ff;background:rgba(63,182,255,.2)}
.pairs .tile.m3{border-color:#ffd166;background:rgba(255,209,102,.2)}
.pairs .tile.m4{border-color:#e79bff;background:rgba(231,155,255,.2)}
.pairs .tile.lk{pointer-events:none}
.big{font-size:54px;line-height:1;margin-bottom:6px}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:starIn .5s both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(3) rotate(-40deg);opacity:0}}
.facts{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-weight:700;font-size:15px;line-height:1.35}
.facts li{padding:8px 11px;border-radius:11px;background:rgba(255,255,255,.07)}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.kv div{background:rgba(255,255,255,.08);border-radius:12px;padding:6px 12px;font:800 15px var(--h)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:6px 12px;border-radius:999px;font:800 14px var(--h)}
.tabs button.on{background:var(--mars);color:#2a0f06;border-color:transparent}
.fcard{padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);font-weight:700;font-size:15px;line-height:1.4}
.fcard.lk{opacity:.5;font-style:italic}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
kbd{background:rgba(255,255,255,.14);padding:2px 8px;border-radius:7px;font:800 14px var(--h);border:1px solid var(--line)}
.rocket{font-size:90px;animation:lift 3.2s ease-in forwards}
@keyframes lift{0%{transform:translateY(0) scale(1)}15%{transform:translateY(6px) scale(1.02)}100%{transform:translateY(-120vh) scale(.6)}}
.cert{border:3px double var(--mars2);border-radius:18px;padding:22px;text-align:center;background:linear-gradient(160deg,rgba(255,150,90,.15),rgba(255,255,255,.03))}
.cert h2{color:var(--mars2)}
@media(max-width:640px){#hud{flex-wrap:wrap;gap:6px}.objs{order:3;flex-basis:100%;justify-content:center;margin:0}.hb{margin-left:auto}.scr{padding:16px 14px}.pairs{grid-template-columns:1fr}.hbox{padding:5px 8px}.gauges{min-width:130px}.g .bar{min-width:60px}#mini{width:120px;height:80px}.objs{font-size:13px}}
@media(max-height:520px){.title{padding-top:3vh}.title p{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div class="hbox gauges">
    <div class="g bat"><span>⚡</span><div class="bar"><i id="gbat"></i></div><span id="tbat">100%</span></div>
    <div class="g hull"><span>🛡️</span><div class="bar"><i id="ghull"></i></div><span id="thull">100%</span></div>
  </div>
  <div class="hbox objs" id="objs"></div>
  <div class="hb"><button class="ib" id="bmute" title="Sound">🔊</button><button class="ib" id="bpause" title="Pause">⏸</button></div>
</div>
<canvas id="mini" class="hide" width="336" height="224"></canvas>
<div id="scan" class="hide"><div class="ring"><i id="scani">🔬</i></div><span id="scant">Hold still…</span></div>
<div id="msg"></div>
<div id="stick" class="hide"><i></i></div>
<button id="boost" class="hide">BOOST</button>
<div id="ui"></div>
<div id="ov" class="hide"></div>
<script>
// ============ QUESTION BANK ============
// mc(topic, question, correct, [wrong...], why)
const BANK = [];
function mc(t, q, a, w, why) { BANK.push({ id: BANK.length, t, type: 'mc', q, a, w, why }); }
function ord(t, q, items, why) { BANK.push({ id: BANK.length, t, type: 'order', q, items, why }); }
function pairs(t, q, items, why) { BANK.push({ id: BANK.length, t, type: 'pairs', q, items, why }); }

const TOPICS = {
  rover:   { name: 'Rovers & landing',   emoji: '🤖' },
  mars:    { name: 'Meet Mars',           emoji: '🔴' },
  water:   { name: 'Water & rocks',       emoji: '💧' },
  volcano: { name: 'Volcano & gravity',   emoji: '🌋' },
  canyon:  { name: 'Canyons & distance',  emoji: '🏞️' },
  climate: { name: 'Cold, air & ice',     emoji: '🧊' },
  power:   { name: 'Power & moons',       emoji: '🔋' }
};

// ---- rover ----
mc('rover', 'What is a rover?', 'A robot vehicle that drives around another world to explore it', ['A rocket that carries astronauts', 'A kind of Martian rock', 'A space telescope'], 'A rover is a robot explorer on wheels. Scientists on Earth send it plans, and it drives, takes pictures and studies rocks.');
mc('rover', 'Why does a rover have a tall mast with cameras on top?', 'So it can see far, like eyes on a tall head', ['To catch rain water', 'To keep its wheels cool', 'To tell the time'], 'The mast lifts the cameras high up so the rover can spot rocks, hills and dangers far away.');
mc('rover', 'Which part of the rover drills and picks up rock samples?', 'The robotic arm', ['The wheels', 'The antenna', 'The solar panel'], 'The robotic arm holds tools: a drill, a camera and a tiny lab. It can reach out and touch rocks.');
mc('rover', 'Which rover landed on Mars in February 2021?', 'Perseverance', ['Sojourner', 'Opportunity', 'Voyager'], 'Perseverance landed in Jezero Crater on 18 February 2021. Sojourner was the very first Mars rover, in 1997.');
mc('rover', 'What did the little helicopter Ingenuity do on Mars?', 'It was the first helicopter to fly on another planet', ['It dug a deep hole', 'It carried the rover on its back', 'It made rain'], 'Ingenuity flew in April 2021. Mars air is very thin, so its blades had to spin super fast.');
mc('rover', 'Radio messages take minutes to reach Mars. Why can\'t scientists steer a rover live with a joystick, like in this game?', 'The message would arrive too late', ['Joysticks do not work in space', 'Mars has no radio waves', 'Rovers cannot move'], 'Real rovers get a plan from Earth, then drive short bits by themselves and check for danger with their own cameras.');
ord('rover', 'Put Perseverance\'s trip in the right order.', ['Rocket launches from Earth', 'Flies through space for about 7 months', 'Parachute opens', 'Sky crane lowers the rover', 'Rover drives away'], 'The landing took only about 7 minutes. Engineers called it "seven minutes of terror" because nobody could help in time.');
mc('rover', 'How many wheels does the Perseverance rover have?', '6', ['4', '8', '2'], 'Six strong metal wheels, each with its own motor, help it climb over rocks and sand.');
pairs('rover', 'Match each rover part to its job.', [['Mast camera', 'Takes pictures'], ['Robotic arm', 'Drills rock'], ['Wheels', 'Drive over rocks'], ['Antenna', 'Talks to Earth']], 'Every part has a job: eyes (camera), hand (arm), legs (wheels) and a radio (antenna).');

// ---- mars ----
mc('mars', 'Which planet from the Sun is Mars?', 'Fourth', ['Second', 'Sixth', 'First'], 'Mercury, Venus, Earth, then Mars. Mars is our next-door neighbour, farther from the Sun than Earth.');
mc('mars', 'Why does Mars look red?', 'Its dust has rust (iron oxide) in it', ['It is very hot like a fire', 'It is covered in red paint', 'It has red oceans'], 'Iron in the ground has rusted, just like an old nail. The rusty dust makes Mars the Red Planet.');
mc('mars', 'How many moons does Mars have?', 'Two', ['None', 'Five', 'One hundred'], 'Mars has two small moons called Phobos and Deimos.');
mc('mars', 'True or false: Mars is about half as wide as Earth.', 'True', ['False'], 'Mars is about 6,800 km wide and Earth about 12,700 km, so Mars is roughly half the width.');
mc('mars', 'A day on Mars is called a "sol". How long is it?', 'About the same as an Earth day (24 hours 40 minutes)', ['Twice as long as an Earth day', 'Only 6 hours', 'A whole week'], 'A sol is only about 40 minutes longer than an Earth day. Scientists on the rover team even live on "Mars time"!');
mc('mars', 'How long is a year on Mars?', '687 Earth days, almost 2 Earth years', ['365 days, the same as Earth', '88 days', '10 years'], 'Mars is farther from the Sun, so its trip around the Sun takes longer than ours.');
mc('mars', 'What colour is the Mars sky in the daytime?', 'Butterscotch (pinky-orange)', ['Bright blue', 'Green', 'Purple'], 'Fine dust floats in the thin air and turns the daytime sky pinky-orange. Sunsets on Mars look blue!');
mc('mars', 'What is a dust devil?', 'A spinning column of wind and dust', ['A Martian animal', 'A kind of rover', 'A rock made of fire'], 'Dust devils are whirling winds. On Mars some are taller than a skyscraper. They once cleaned dust off the solar panels of the Spirit rover.');
mc('mars', 'Mars dust has iron in it. Which tool could pick up iron-rich dust from the sand?', 'A magnet', ['A sieve', 'A ruler', 'A funnel'], 'Magnets attract iron. Mars rovers carry magnets to catch dust and learn what it is made of.');
mc('mars', 'You want to separate big pebbles from fine sand. Which tool is best?', 'A sieve', ['A magnet', 'A thermometer', 'A balance scale'], 'A sieve has holes. Fine sand falls through, and the pebbles stay on top. This is how mixtures can be separated.');

// ---- water ----
mc('water', 'Scientists think Jezero Crater was once...', 'A lake fed by a river', ['A hot volcano', 'A forest', 'A city'], 'Jezero has a fan-shaped delta where a river once flowed in. Perseverance landed there to search for signs of ancient life.');
mc('water', 'Why do scientists search for water on Mars?', 'Life as we know it needs water', ['Rovers need a drink', 'Water makes Mars red', 'To fill swimming pools'], 'All living things on Earth need water. If Mars once had water, tiny life might have lived there too.');
mc('water', 'Rocks made of tiny grains of mud and sand that settled in layers are called...', 'Sedimentary rocks', ['Igneous rocks', 'Magnet rocks', 'Cloud rocks'], 'Sedimentary rock forms in layers, often under water. Finding it on Mars is a clue that water was there long ago.');
mc('water', 'Rocks that form when hot melted rock (lava) cools down are called...', 'Igneous rocks', ['Sedimentary rocks', 'Ice rocks', 'Salt rocks'], 'Igneous means "made by fire". Volcanoes make igneous rocks such as basalt.');
mc('water', 'Perseverance seals rock samples inside...', 'Metal sample tubes', ['Paper bags', 'Water bottles', 'Glass jars of sand'], 'The rover packs rock cores in tidy tubes so they can be collected and studied by labs on Earth one day.');
mc('water', 'Mars was once warmer and wetter. About how long ago?', 'About 3 to 4 billion years ago', ['Last year', 'About 100 years ago', 'About 5,000 years ago'], 'That is longer ago than the dinosaurs! Mars lost most of its thick air and its water slowly.');

// ================= update =================
const HAZ = {

  ice: '🧊 <b>Slippery ice!</b> Steer gently and brake early. Mars\'s poles are covered in water ice and dry ice.',
  rough: '🌋 <b>Lava rock field!</b> Bumpy ground slows the rover. Take it easy.',

  rock: '💥 <b>Bonk!</b> Hitting rocks hurts the hull. Curiosity\'s wheels got dents from sharp rocks.',
  cliff: '⚠️ <b>Cliff edge!</b> Rovers must never drive over a canyon edge.',

function once(k, cls) { if (!P.seen[k]) { P.seen[k] = 1; toast(HAZ[k], cls); } }
function zoneAt(x, y) { for (const z of P.Wd.zones) if (dist(x, y, z.x, z.y) < z.r * .8) return z.k; return null; }

function update(dt) {

          for (let i = 0; i < 8; i++) spawn(r.x - nx * 18, r.y - ny * 18, (Math.random() - .5) * 90 + nx * 40, (Math.random() - .5) * 90 + ny * 40, .6, 3 + Math.random() * 3, W.m.biome.dust);

    if (i >= qs.length) { const ov = $('#ov'); ov.classList.remove('hide'); ov.innerHTML = '<div class="panel modal" style="text-align:center"><div class="big">🧠</div><h2>Quiz lab done!</h2><p style="font-weight:700">' + (mist ? 'You made ' + mist + ' mistake' + (mist > 1 ? 's' : '') + '. Those questions will come back first next time.' : 'No mistakes at all. Fantastic!') + '</p><div class="row" style="justify-content:center"><button class="btn" data-act="quiz">Another round</button><button class="btn ghost" data-act="title">Home</button></div></div>'; ov.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; ov.classList.add('hide'); ov.onclick = null; act(a.dataset.act); }; return; }
    const q = qs[i++]; ask(q, { practice: true, badge: '🧠 Quiz lab ' + i + ' of ' + qs.length, next: i === qs.length ? 'Finish ▶' : 'Next ▶' }, m => { mist += m; if (m) { SAVE.missed[q.id] = (SAVE.missed[q.id] || 0) + 1; persist(); } next(); });
  };
  next();
}
function howTo() {
  const ov = $('#ov'); ov.classList.remove('hide');
  ov.innerHTML = '<div class="panel modal"><h2>❓ How to play</h2><div class="fcard">🚙 <b>Drive</b> your rover with ' + (TOUCH ? 'one finger: drag anywhere on the screen.' : '<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>W A S D</kbd>. Hold <kbd>Space</kbd> to boost (uses more battery).') + '</div>' +
    '<div class="fcard" style="margin-top:8px">🪨 <b>Drill rings</b> (teal) and 🔬 <b>science stations</b> (purple): stop inside the ring and hold still. A question appears. Right answers refill your battery!</div>' +
    '<div class="fcard" style="margin-top:8px">⚡ <b>Battery</b> drains when you drive and recharges when you rest. 🛡️ <b>Hull</b> drops when you bump into rocks. If it hits zero Mission Control repairs you at your last checkpoint.</div>' +
    '<div class="fcard" style="margin-top:8px">🌪️🧊🏜️ <b>Hazards:</b> dust devils push you, ice makes you slide, sand slows you down, cliffs block you.</div>' +
    '<div class="fcard" style="margin-top:8px">⭐ <b>Stars:</b> 3 stars for 0–1 wrong answers and no repairs. Then drive back to the lander to finish!</div>' +
    '<div class="row end"><button class="btn" id="hgo">Got it!</button></div></div>';
  $('#hgo').onclick = () => { ov.classList.add('hide'); ov.innerHTML = ''; SAVE.seen = true; persist(); };
}
function act(a) {
  SFX.click();
  if (a === 'map') { audio(); toMap(); if (!SAVE.seen) howTo(); } else if (a === 'title') showTitle(); else if (a === 'log') showLog(); else if (a === 'quiz') startQuiz(); else if (a === 'how') howTo();
  else if (a === 'snd') { SAVE.sound = !SAVE.sound; persist(); showTitle(); } else if (a === 'resume') resume();
}
$('#ui').addEventListener('click', e => {
  const lv = e.target.closest('[data-lv]'); if (lv) { SAVE.level = lv.dataset.lv; persist(); SFX.click(); $('#lvseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === lv)); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { logTab = tab.dataset.tab; showLog(); return; }
  const mi = e.target.closest('[data-mi]'); if (mi) { SFX.click(); startMission(+mi.dataset.mi); return; }
  const a = e.target.closest('[data-act]'); if (a) act(a.dataset.act);
});

// pause
function pause() {
  if (!P || P.paused || scr !== 'play') return; P.paused = true; engineSound(false, 0); const ov = $('#ov'); ov.classList.remove('hide');
  ov.innerHTML = '<div class="panel modal" style="text-align:center"><div class="big">⏸</div><h2>Paused</h2><div class="row" style="justify-content:center"><button class="btn" data-act="resume">▶ Resume</button><button class="btn ghost" data-act="restart">↻ Restart mission</button><button class="btn alt" data-act="map">🗺️ Mission map</button></div></div>';
  ov.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; ov.classList.add('hide'); ov.innerHTML = ''; ov.onclick = null; if (a.dataset.act === 'resume') P.paused = false; else if (a.dataset.act === 'restart') startMission(P.mi); else toMap(); };
}
function resume() { }
$('#bpause').onclick = pause;
$('#bmute').onclick = () => { SAVE.sound = !SAVE.sound; persist(); $('#bmute').textContent = SAVE.sound ? '🔊' : '🔇'; if (!SAVE.sound) engineSound(false, 0); };

// ================= input =================
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
  keys[k] = true; if ((k === 'Escape' || k === 'p') && scr === 'play') { P && P.paused ? 0 : pause(); } audio();
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; if (k === 'Shift') keys.Shift = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('pointerdown', e => { if (scr !== 'play' || !P || P.paused) return; audio(); stick.on = true; stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.dx = stick.dy = 0; const s = $('#stick'); s.classList.remove('hide'); s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px'; s.firstChild.style.transform = 'none'; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!stick.on || e.pointerId !== stick.id) return; stick.dx = e.clientX - stick.ox; stick.dy = e.clientY - stick.oy; const l = Math.hypot(stick.dx, stick.dy), m = Math.min(l, 50); $('#stick').firstChild.style.transform = 'translate(' + (l ? stick.dx / l * m : 0) + 'px,' + (l ? stick.dy / l * m : 0) + 'px)'; });
const endStick = e => { if (e.pointerId !== stick.id) return; stick.on = false; stick.dx = stick.dy = 0; $('#stick').classList.add('hide'); };
cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick);
const bb = $('#boost'); bb.addEventListener('pointerdown', e => { e.stopPropagation(); if (P) P.boostBtn = true; }); bb.addEventListener('pointerup', () => { if (P) P.boostBtn = false; }); bb.addEventListener('pointerleave', () => { if (P) P.boostBtn = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && scr === 'play') pause(); });

// ================= main loop =================
function frame(ts) {
  const dt = Math.min(.05, (ts - wallT) / 1000); wallT = ts; const t = ts / 1000;
  if (scr === 'play' && P) {
    if (!P.paused) { const n = P.ts > 1 ? P.ts : 1; for (let i = 0; i < n && !P.paused && scr === 'play'; i++) update(dt * (P.ts < 1 ? P.ts : 1)); }
    if (P) { renderPlay(t); hudTick(); }
  } else if (scr !== 'play') { drawAttract(t); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(ts => { wallT = ts; frame(ts); });
$('#bmute').textContent = SAVE.sound ? '🔊' : '🔇';
showTitle();

// debug hook (used by the automated tests)
window.__m = { get P() { return P; }, start: startMission, save: SAVE, BANK, MISSIONS, genWorld, reachable, ask, title: showTitle, map: toMap, quiz: startQuiz, log: showLog, fin: () => { if (P) finishMission(); } };
</script></body></html>

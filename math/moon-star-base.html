<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Moon Starbase Builder</title>
<meta name="description" content="Launch from Earth, land on the Moon and build a starbase from scratch. Answer science questions to power every mission.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c9ccd6'/%3E%3Ccircle cx='22' cy='24' r='7' fill='%23959aa8'/%3E%3Ccircle cx='42' cy='38' r='9' fill='%23959aa8'/%3E%3Ccircle cx='38' cy='18' r='4' fill='%23959aa8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050912; --ink:#eef4ff; --mute:#9fb3d1; --card:rgba(12,19,36,.88); --line:rgba(160,200,255,.24);
  --gold:#ffc24d; --gold2:#ffe08a; --sci:#3fe0cf; --ok:#52e08a; --bad:#ff5d6c; --warn:#ffd166; --ice:#8fd0ff;
  --h:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --b:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--b);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:12px 22px;font:800 18px var(--h);color:#2b1a02;background:linear-gradient(180deg,#ffe9a8,#ffb93d);box-shadow:0 4px 0 #a8700f,0 8px 18px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8700f}
.btn.alt{background:linear-gradient(180deg,#a9ecff,#4aa8e8);box-shadow:0 4px 0 #1c5e92,0 8px 18px rgba(0,0,0,.4);color:#04243d}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
.btn.small{padding:7px 14px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.45;pointer-events:none}

/* screens */
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.scr{width:min(1040px,96vw);max-height:96vh;overflow:auto;padding:22px 24px;touch-action:pan-y}
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:fixed;inset:0;justify-content:flex-start;padding-top:6vh;pointer-events:none}
.title>*{pointer-events:auto}
.title h1{font:800 clamp(40px,8vw,82px)/0.95 var(--h);margin:0;letter-spacing:.5px;color:#f6faff;text-shadow:0 3px 0 #4a6aa6,0 6px 0 #1f3258,0 14px 28px rgba(0,0,0,.6)}
.title h1 small{display:block;font:800 clamp(14px,2.4vw,24px) var(--h);letter-spacing:7px;color:var(--gold2);text-shadow:0 2px 8px #000;margin-bottom:4px}
.title p{margin:6px 0 10px;color:#dce9ff;font-weight:700;text-shadow:0 2px 8px #000;max-width:580px;padding:0 14px}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8px}
.menu .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;background:rgba(0,0,0,.45);border-radius:14px;padding:4px;gap:4px;border:1.5px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);font:800 15px var(--h);padding:7px 15px;border-radius:10px}
.seg button.on{background:linear-gradient(180deg,#ffe9a8,#ffb93d);color:#2b1a02}
h2{font:800 clamp(24px,4vw,36px) var(--h);margin:0 0 4px}
h3{font:800 20px var(--h);margin:0}
.sub{color:var(--mute);font-weight:700;margin:0 0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}

/* map */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mc{position:relative;border-radius:18px;padding:14px;background:linear-gradient(160deg,rgba(120,170,255,.18),rgba(255,255,255,.04));border:1.5px solid var(--line);text-align:left;color:var(--ink);transition:transform .12s,border-color .12s;min-height:150px;display:flex;flex-direction:column;gap:4px}
.mc:hover{transform:translateY(-3px);border-color:var(--gold2)}
.mc .n{position:absolute;top:10px;right:12px;font:800 15px var(--h);color:var(--gold2)}
.mc .e{font-size:38px;line-height:1}
.mc .nm{font:800 20px var(--h)}
.mc .tg{font-size:13px;color:var(--mute);font-weight:700}
.mc .bd{font-size:12px;color:var(--sci);font-weight:800}
.mc .st{margin-top:auto;font-size:22px;letter-spacing:2px}
.mc.lock{opacity:.5;filter:grayscale(.7);pointer-events:none}
.mc.lock::after{content:'🔒';position:absolute;right:12px;bottom:10px;font-size:22px}
.star{color:#ffd24a;text-shadow:0 0 8px rgba(255,200,60,.5)}
.star.off{color:#47506a;text-shadow:none}
#bcv{display:block;width:100%;border-radius:16px;border:1.5px solid var(--line);background:#06101f;margin:0 0 14px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.hbox{background:rgba(7,13,28,.74);border:1.5px solid var(--line);border-radius:14px;padding:7px 11px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.gauges{display:flex;flex-direction:column;gap:5px;min-width:170px}
.g{display:flex;align-items:center;gap:7px;font:800 13px var(--h)}
.g .bar{flex:1;height:11px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;min-width:100px}
.g .bar i{display:block;height:100%;width:100%;border-radius:7px;background:linear-gradient(90deg,#ffd166,#52e08a);transition:width .15s}
.g.hull .bar i{background:linear-gradient(90deg,#ff5d6c,#ffb067)}
.g.low .bar i{background:#ff5d6c;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
.objs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font:800 15px var(--h);margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip.ok{background:rgba(82,224,138,.28)}
.chip.go{background:rgba(255,194,77,.34);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px rgba(255,194,77,.25)}}
.hb{display:flex;gap:6px;margin-left:auto}
.ib{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:rgba(7,13,28,.74);color:var(--ink);font-size:20px;line-height:1}
#mini{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:168px;height:112px;border-radius:12px;border:1.5px solid var(--line);background:rgba(7,13,28,.7);z-index:5;pointer-events:none}
body.touch #msg{bottom:112px!important}
#msg{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;max-width:min(560px,92vw);pointer-events:none}
.toast{background:rgba(7,13,28,.92);border:1.5px solid var(--gold2);padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;line-height:1.35;text-align:center;animation:pop .25s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.sci{border-color:var(--sci)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
#scan{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;font:800 16px var(--h);text-shadow:0 2px 6px #000}
#scan .ring{width:74px;height:74px;border-radius:50%;margin:0 auto 4px;background:conic-gradient(var(--sci) var(--p,0%),rgba(255,255,255,.15) 0);display:flex;align-items:center;justify-content:center}
#scan .ring i{width:58px;height:58px;border-radius:50%;background:rgba(5,9,20,.88);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(150,200,255,.55);border:2px solid rgba(255,255,255,.6)}
#boost,.tb{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;width:74px;height:74px;border-radius:50%;border:2px solid var(--line);background:rgba(255,194,77,.5);color:#fff;font:800 14px var(--h);touch-action:none}
#boost{left:14px}
#tl{left:14px}#tr{left:98px}#tact{right:14px;width:92px;height:92px;background:rgba(255,120,60,.6);font-size:15px}
.tb{background:rgba(120,170,255,.45);font-size:28px}
#tact{background:rgba(255,150,60,.6);font-size:15px}

/* modal */
#ov{position:fixed;inset:0;background:rgba(2,5,14,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal{width:min(720px,100%);max-height:96vh;overflow:auto;padding:20px 22px;touch-action:pan-y}
.badge{display:inline-flex;align-items:center;gap:6px;font:800 13px var(--h);letter-spacing:1px;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:rgba(63,224,207,.18);color:var(--sci);margin-bottom:8px}
.badge.lab{background:rgba(255,194,77,.18);color:var(--gold2)}
.q{font:800 clamp(19px,3.4vw,26px)/1.25 var(--h);margin:2px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:800 clamp(15px,2.6vw,19px)/1.25 var(--b);display:flex;gap:11px;align-items:center;transition:transform .08s,background .12s,border-color .12s}
.opt:hover{border-color:var(--gold2);background:rgba(255,194,77,.14)}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font:800 15px var(--h)}
.opt.ok{border-color:var(--ok);background:rgba(82,224,138,.22)}
.opt.bad{border-color:var(--bad);background:rgba(255,93,108,.16);opacity:.55;pointer-events:none;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
.shake{animation:shake .35s}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;line-height:1.4;background:rgba(82,224,138,.14);border:1.5px solid rgba(82,224,138,.5)}
.fb.bad{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.5)}
.fb b{font-family:var(--h)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
.ord{display:flex;flex-wrap:wrap;gap:10px}
.tile{padding:12px 15px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:800 clamp(15px,2.6vw,18px) var(--b);position:relative;text-align:left}
.tile.done{border-color:var(--ok);background:rgba(82,224,138,.2);pointer-events:none}
.tile.done::before{content:attr(data-n);position:absolute;left:-8px;top:-10px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#06240f;font:800 14px/24px var(--h);text-align:center}
.slots{display:flex;gap:6px;margin-bottom:12px}
.slots i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14)}
.slots i.on{background:var(--ok)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.pairs .tile.sel{border-color:var(--gold2);background:rgba(255,194,77,.22)}
.pairs .tile.m1{border-color:#52e08a;background:rgba(82,224,138,.2)}
.pairs .tile.m2{border-color:#3fb6ff;background:rgba(63,182,255,.2)}
.pairs .tile.m3{border-color:#ffd166;background:rgba(255,209,102,.2)}
.pairs .tile.m4{border-color:#e79bff;background:rgba(231,155,255,.2)}
.pairs .tile.lk{pointer-events:none}
.big{font-size:54px;line-height:1;margin-bottom:6px}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:starIn .5s both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(3) rotate(-40deg);opacity:0}}
.facts{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-weight:700;font-size:15px;line-height:1.35}
.facts li{padding:8px 11px;border-radius:11px;background:rgba(255,255,255,.07)}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.kv div{background:rgba(255,255,255,.08);border-radius:12px;padding:6px 12px;font:800 15px var(--h)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:6px 12px;border-radius:999px;font:800 14px var(--h)}
.tabs button.on{background:var(--gold);color:#2b1a02;border-color:transparent}
.fcard{padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);font-weight:700;font-size:15px;line-height:1.4}
.fcard.lk{opacity:.5;font-style:italic}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
kbd{background:rgba(255,255,255,.14);padding:2px 8px;border-radius:7px;font:800 14px var(--h);border:1px solid var(--line)}
.rocket{font-size:90px;animation:lift 3.2s ease-in forwards}
@keyframes lift{0%{transform:translateY(0) scale(1)}15%{transform:translateY(6px) scale(1.02)}100%{transform:translateY(-120vh) scale(.6)}}
.cert{border:3px double var(--gold2);border-radius:18px;padding:22px;text-align:center;background:linear-gradient(160deg,rgba(255,194,77,.15),rgba(255,255,255,.03))}
.cert h2{color:var(--gold2)}
@media(max-width:640px){#hud{flex-wrap:wrap;gap:6px}.objs{order:3;flex-basis:100%;justify-content:center;margin:0}.hb{margin-left:auto}.scr{padding:16px 14px}.pairs{grid-template-columns:1fr}.hbox{padding:5px 8px}.gauges{min-width:130px}.g .bar{min-width:60px}#mini{width:120px;height:80px}.objs{font-size:13px}}
@media(max-height:520px){.title{padding-top:3vh}.title p{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div class="hbox gauges">
    <div class="g bat"><span id="gi1">⚡</span><div class="bar"><i id="gbat"></i></div><span id="tbat">100%</span></div>
    <div class="g hull"><span>🛡️</span><div class="bar"><i id="ghull"></i></div><span id="thull">100%</span></div>
  </div>
  <div class="hbox objs" id="objs"></div>
  <div class="hb"><button class="ib" id="bmute" title="Sound">🔊</button><button class="ib" id="bpause" title="Pause">⏸</button></div>
</div>
<canvas id="mini" class="hide" width="336" height="224"></canvas>
<div id="scan" class="hide"><div class="ring"><i id="scani">🔬</i></div><span id="scant">Hold still…</span></div>
<div id="msg"></div>
<div id="stick" class="hide"><i></i></div>
<button id="boost" class="hide">BOOST</button>
<button class="tb hide" id="tl">◀</button><button class="tb hide" id="tr">▶</button><button class="tb hide" id="tact">BOOST</button>
<div id="ui"></div>
<div id="ov" class="hide"></div>
<script>
// ============ QUESTION BANK ============
// mc(topic, question, correct, [wrong...], why)
const BANK = [];
function mc(t, q, a, w, why) { BANK.push({ id: BANK.length, t, type: 'mc', q, a, w, why }); }
function ord(t, q, items, why) { BANK.push({ id: BANK.length, t, type: 'order', q, items, why }); }
function pairs(t, q, items, why) { BANK.push({ id: BANK.length, t, type: 'pairs', q, items, why }); }

const TOPICS = {
  launch:    { name: 'Rockets & launch',     emoji: '🚀' },
  earthmoon: { name: 'Earth & Moon',         emoji: '🌍' },
  landing:   { name: 'Landing & gravity',    emoji: '🛬' },
  solar:     { name: 'Sun & solar power',    emoji: '☀️' },
  habitat:   { name: 'Habitat & suits',      emoji: '🏠' },
  ice:       { name: 'Water ice & oxygen',   emoji: '🧊' },
  garden:    { name: 'Moon garden',          emoji: '🌱' },
  comms:     { name: 'Radio & signals',      emoji: '📡' },
  moonfacts: { name: 'Craters & Moon facts', emoji: '🌑' }
};

// ---- launch ----
mc('launch', `Why does a rocket blast hot gas downward?`, `The gas pushes back, and that pushes the rocket up`, [`To keep the launch pad warm`, `To make the rocket look pretty`, `To paint the sky orange`], `Push down on the gas and the gas pushes back on the rocket. It is like letting go of a balloon: the air rushes out one way and the balloon zooms the other way.`);
ord('launch', `Put the countdown steps in order.`, [`Check the rocket and fill the tanks`, `Astronauts climb aboard`, `Count down: 3, 2, 1…`, `Engines ignite: liftoff!`], `Every launch follows a careful checklist. Teams check everything long before the countdown ends.`);
mc('launch', `What do rocket engines burn to make their powerful push?`, `Fuel mixed with oxygen`, [`Only water`, `Wood and paper`, `Sunshine`], `Fire needs oxygen. Space has no air, so rockets carry their own oxygen along with the fuel. Burning them together makes a huge push.`);
mc('launch', `A big rocket has "stages". Why does it drop empty stages on the way up?`, `To get lighter, so the rest can go faster`, [`Because they are broken`, `To make room for snacks`, `To scare away birds`], `An empty fuel tank is just heavy metal. Dropping it makes the rocket lighter, so the engines can push it faster and farther.`);
mc('launch', `About how high does space begin (the Kármán line)?`, `100 km`, [`10 km`, `1 km`, `1,000,000 km`], `Most scientists say space starts about 100 km above the ground. Airplanes fly at about 10 km, so space is ten times higher than a jet.`);
mc('launch', `The sky turns black high above Earth. Why?`, `There is hardly any air left to scatter the sunlight`, [`The Sun switches off`, `Clouds cover the rocket`, `Space is always night`], `On Earth, air scatters blue light all over the sky. Up high the air is very thin, so there is nothing to scatter it and the sky looks black.`);
mc('launch', `Why do astronauts float inside a spaceship that orbits Earth?`, `They and the ship are both falling around Earth together`, [`There is no gravity at all up there`, `Magnets hold them up`, `The ship spins upside-down`], `Gravity is still pulling, but astronauts and ship fall around the Earth together, so they feel weightless.`);
mc('launch', `How fast must a spaceship go to leave Earth's orbit and head for the Moon?`, `About 11 km every second`, [`As fast as a bicycle`, `About 11 km every hour`, `As fast as a running dog`], `That is about 40,000 km an hour! Only a very big rocket engine can reach that speed.`);
mc('launch', `Which rocket carried the Apollo astronauts to the Moon?`, `Saturn V`, [`Falcon Rover`, `Mars Express`, `Space Bus`], `Saturn V was 111 metres tall, taller than a 30-storey building. It flew Apollo crews to the Moon between 1968 and 1972.`);

// ---- earth & moon ----
mc('earthmoon', `How long did the Apollo trip from Earth to the Moon take?`, `About 3 days`, [`About 3 minutes`, `About 3 years`, `One hour`], `The Moon is far away, about 384,400 km. Apollo spaceships took roughly three days to get there.`);
mc('earthmoon', `About how far away is the Moon?`, `384,400 km`, [`38 km`, `3,844 km`, `384,400,000 km`], `If you could drive a car there at 100 km an hour, the trip would take about 160 days!`);
mc('earthmoon', `Does the Moon make its own light?`, `No, it reflects sunlight`, [`Yes, it is a small sun`, `Yes, it glows by itself`, `Only on Fridays`], `The Moon is a ball of rock. We see the sunny part of it, and the shape we see changes through the month. These changes are called phases.`);
ord('earthmoon', `Put the Moon's phases in order, starting with the New Moon.`, [`New Moon (dark)`, `Thin crescent`, `Half Moon`, `Full Moon`], `The Moon takes about 29½ days to go through all its phases and start again.`);
mc('earthmoon', `Which is bigger, the Moon or the Earth?`, `Earth. The Moon is about a quarter as wide`, [`The Moon`, `They are exactly the same`, `The Moon is ten times wider`], `Earth is about 12,700 km wide and the Moon about 3,500 km. Almost four Moons side by side would stretch across Earth.`);
mc('earthmoon', `The Moon travels around the Earth. What do we call a path around a planet?`, `An orbit`, [`A tunnel`, `A bridge`, `A runway`], `The Moon orbits Earth about once a month. The word "month" comes from the word "Moon"!`);
mc('earthmoon', `True or false: we always see the same side of the Moon from Earth.`, `True`, [`False`], `The Moon turns exactly once each time it goes around Earth, so the same face always looks at us. The other side is called the far side.`);
mc('earthmoon', `What does the Moon's pull do to the oceans on Earth?`, `It makes the tides: the sea level goes up and down`, [`It makes the sea freeze`, `It turns the sea purple`, `Nothing at all`], `The Moon's gravity pulls on the water. That is why most beaches have high tide and low tide every day.`);
mc('earthmoon', `Between Earth and the Moon the spaceship "coasts". What does that mean?`, `It flies along with its engines off, saving fuel`, [`It is parked on the Moon`, `It is dropping a stage`, `It is landing`], `After the big engine burn, nothing slows the ship down in space, so it glides on its own for days.`);
mc('earthmoon', `The Moon is slowly drifting away from Earth. How fast?`, `A few centimetres a year, about as fast as fingernails grow`, [`As fast as a jet plane`, `10 metres every day`, `It is moving closer instead`], `The Moon moves away about 3.8 cm each year. That is a very slow journey!`);

// ---- landing ----
mc('landing', `How strong is gravity on the Moon compared with Earth?`, `About 6 times weaker`, [`The same`, `About 6 times stronger`, `There is none`], `Moon gravity is about one-sixth of Earth's. A kid who weighs 30 kg on Earth would feel like 5 kg on the Moon, so astronauts can jump very high!`);
mc('landing', `Why can't a parachute help a lander on the Moon?`, `There is no air to push against`, [`Parachutes are too heavy`, `The Moon is too warm`, `Parachutes only work at night`], `A parachute works by catching air. The Moon has almost no air, so landers slow down with rocket engines instead.`);
mc('landing', `Which way does a lander fire its engine to slow its fall?`, `Downward, so the push goes upward`, [`Upward, toward the sky`, `Sideways only`, `It keeps the engine off`], `Just like a rocket on the launch pad, the engine pushes gas one way and the lander gets pushed the other way.`);
mc('landing', `Why do landers have wide legs with flat feet?`, `To land softly and stay balanced on bumpy ground`, [`To run across the Moon`, `To swim in craters`, `To hold the flag`], `Wide legs spread the weight so the lander does not sink into dust or tip over.`);
mc('landing', `What was the name of the Apollo 11 lander?`, `Eagle`, [`Falcon`, `Sparrow`, `Moonbird`], `Neil Armstrong and Buzz Aldrin landed Eagle on 20 July 1969. Armstrong radioed: "The Eagle has landed."`);
mc('landing', `What is the best place to land a spaceship?`, `A flat, smooth spot with few rocks`, [`The steep wall of a crater`, `The top of a big boulder`, `The edge of a deep crack`], `Engineers study photos from orbit to find flat, safe places. Steep slopes and boulders could tip a lander over.`);
mc('landing', `Your fuel is getting low during landing. What is a smart move?`, `Use the engine in short bursts, only when needed`, [`Keep the engine on full power`, `Turn off all the lights and hope`, `Throw out the astronauts`], `Fuel is precious. Pilots tap the engine only when they need it and let the Moon's gentle gravity do the rest.`);
mc('landing', `Who stayed in orbit around the Moon during the Apollo 11 landing?`, `Michael Collins`, [`Neil Armstrong`, `Buzz Aldrin`, `Nobody`], `Michael Collins flew the ship Columbia around the Moon, waiting to take his friends home.`);

// ---- solar ----
mc('solar', `What does a solar panel do?`, `It turns sunlight into electricity`, [`It turns electricity into sunlight`, `It makes rain`, `It cools the air`], `Solar panels catch sunlight and make electricity to run lights, computers and machines.`);
mc('solar', `How long does daytime last on the Moon?`, `About 2 weeks (14 Earth days)`, [`12 hours`, `1 hour`, `1 year`], `One Moon day plus night lasts about 29½ Earth days. That means about two weeks of sunshine, then two weeks of darkness!`);
mc('solar', `What can the base use at night when the panels get no sun?`, `Batteries that were charged in the day`, [`Candles`, `Wind turbines`, `Rain water`], `Batteries store energy. A Moon base needs big batteries to last through the long, dark night.`);
mc('solar', `Why do some bases choose a place near the Moon's poles?`, `Some high places there get sunlight almost all the time`, [`It is as warm as a beach`, `It rains there`, `Earth is closer there`], `At the poles the Sun stays low on the horizon, so some mountain tops are nearly always lit. People call them "peaks of eternal light".`);
mc('solar', `Solar panels work best when they…`, `Face the Sun and have no shade`, [`Face the ground`, `Are covered with dust`, `Sit inside a dark cave`], `Shadows and dust block the light, so panels must face the Sun and stay clean.`);
mc('solar', `Each row has 5 solar panels. How many panels are in 2 rows?`, `10`, [`7`, `12`, `8`], `5 + 5 = 10. Counting by fives is a fast way: 5, 10!`);
mc('solar', `True or false: there is no wind on the Moon, so nothing blows dust off the panels.`, `True`, [`False`], `No air means no wind. Dust stays where it lands, so a base needs a robot with a soft brush to clean the panels.`);
ord('solar', `Put the energy path in order, from sky to lamp.`, [`Sunlight hits the solar panel`, `The panel makes electricity`, `A battery stores it`, `The base lights shine`], `This is how a solar-powered base works: catch the light, make power, store it, then use it.`);
pairs('solar', `Match each part to its job.`, [[`Solar panel`, `Makes electricity`], [`Battery`, `Stores energy`], [`Cable`, `Carries power`], [`Lamp`, `Gives light`]], `A power system needs all four parts working together.`);

// ---- habitat ----
mc('habitat', `Why do astronauts on the Moon need a sealed habitat or a spacesuit?`, `There is no air to breathe`, [`The Moon is full of water`, `Gravity is too strong`, `The ground is made of jelly`], `The Moon has almost no air and no air pressure. Inside a habitat or suit, astronauts carry their own air.`);
mc('habitat', `How hot and cold does the Moon get?`, `About 120 °C in the day and −170 °C at night`, [`Always 20 °C like a classroom`, `Always freezing, never hot`, `Always 500 °C`], `With no thick air to hold the heat, the sunny side gets hotter than boiling water and the night side gets colder than any freezer.`);
mc('habitat', `What is regolith?`, `Loose dust and broken rock that covers the Moon`, [`A Moon plant`, `Water from a crater`, `A kind of spacesuit`], `Space rocks smashed the Moon's surface into dust over billions of years. Builders can press regolith into bricks!`);
mc('habitat', `Why bury a habitat under a thick layer of regolith?`, `To block harmful space radiation and keep the temperature steady`, [`To hide from Martians`, `To make it heavier`, `To grow carrots on the roof`], `Radiation from the Sun and stars can hurt people. A few metres of regolith make a strong shield.`);
mc('habitat', `What is an airlock?`, `A small room with two doors, so the base keeps its air`, [`A lock made of air`, `A kind of space food`, `A tool for digging`], `Astronauts go in, close one door, then open the other. The base never loses all its air.`);
mc('habitat', `Why are habitats shaped like domes or round tubes?`, `Round shapes hold the air pressure evenly`, [`They look like igloos`, `Corners cost extra`, `Squares are not allowed`], `Air inside pushes out in every direction. A round shape spreads that push evenly, like a balloon.`);
mc('habitat', `A crew of 4 astronauts needs 1 bed each. The base has 3 beds. How many more beds are needed?`, `1`, [`2`, `3`, `4`], `4 − 3 = 1. One more bed and everyone can sleep!`);
pairs('habitat', `Match each spacesuit part to its job.`, [[`Helmet visor`, `Shades the bright Sun`], [`Backpack`, `Supplies oxygen`], [`Gloves`, `Protect hands`], [`Boots`, `Grip the dusty ground`]], `A spacesuit is like a tiny spaceship you wear.`);
mc('habitat', `Moon dust is sharp and sticks to everything. What should a crew do?`, `Brush the suits before going inside`, [`Roll in the dust`, `Eat the dust`, `Never wear gloves`], `Apollo astronauts found dust clinging to their suits. It can scratch machines and get in lungs, so crews clean it off.`);

// ---- ice ----
mc('ice', `Where on the Moon is water ice found?`, `In deep, dark craters near the poles`, [`In the middle of the sunny plains`, `In the clouds`, `In rivers`], `Some craters near the poles never see sunlight, so they stay colder than −200 °C. Ice can hide there for billions of years.`);
mc('ice', `Can you drink Moon ice straight away?`, `No, it must be melted and cleaned first`, [`Yes, just lick it`, `Yes, it is already warm`, `It is made of juice`], `The ice is mixed with dust. A base melts it, then filters it to take out the dirt.`);
mc('ice', `What happens to ice when you warm it up?`, `It melts into liquid water`, [`It turns into rock`, `It disappears forever`, `It turns into sand`], `Solid ice plus heat gives liquid water. Heat it even more and it turns into steam, a gas.`);
mc('ice', `Water is made of hydrogen and oxygen. What do we get if we split water with electricity?`, `Hydrogen gas and oxygen gas`, [`Salt and sugar`, `Sand and dust`, `Helium and neon`], `Splitting water is called electrolysis. Oxygen is for breathing, and hydrogen with oxygen makes rocket fuel.`);
mc('ice', `Why is making rocket fuel on the Moon a great idea?`, `Carrying fuel from Earth is very heavy and costly`, [`Moon fuel smells nicer`, `Earth has no fuel`, `Rockets do not need fuel`], `Every kilogram launched from Earth costs a lot. A base that makes fuel from ice lets rockets refuel and fly farther, maybe to Mars!`);
mc('ice', `Why do some craters near the poles stay dark and cold forever?`, `The Sun stays so low that light never reaches the crater floor`, [`They are underwater`, `They are covered with a roof`, `The Moon has no Sun there`], `At the poles the Sun skims the horizon. The deep floors of some craters have been in shadow for billions of years.`);
mc('ice', `A crew of 4 drinks 2 litres each every day. How many litres is that in one day?`, `8 litres`, [`6 litres`, `4 litres`, `10 litres`], `2 + 2 + 2 + 2 = 8. The base has to make plenty of water every day!`);
ord('ice', `Put the water-making steps in order.`, [`Dig up icy dirt`, `Heat it to melt the ice`, `Filter out the dust`, `Store clean water in a tank`], `Dig, melt, filter, store: the same ideas you use to separate mixtures in science class.`);
mc('ice', `In 2009 NASA crashed a probe into a crater near the Moon's south pole. What did the dust cloud show?`, `Water`, [`Gold`, `Plants`, `Fish`], `The LCROSS mission found water in the cloud. That is one reason scientists are so excited about Moon ice.`);

// ---- garden ----
mc('garden', `What do plants need to grow?`, `Light, water, air and nutrients`, [`Only sand`, `Only music`, `Only candy`], `Plants use light, water and air to make their food, and nutrients (plant food) from the soil to grow strong.`);
mc('garden', `Which plant part takes in water from the soil?`, `Roots`, [`Leaves`, `Flowers`, `Seeds`], `Roots drink water and hold the plant in place. The stem carries the water up, and leaves make food from sunlight.`);
pairs('garden', `Match each plant part to its job.`, [[`Roots`, `Take in water`], [`Stem`, `Carries water up`], [`Leaves`, `Make food from sunlight`], [`Flower`, `Makes seeds`]], `Every part of a plant has a job, like the people in a base crew.`);
ord('garden', `Put the life of a plant in order.`, [`Seed`, `Sprout`, `Young plant`, `Flower and new seeds`], `Then the new seeds can start the cycle again.`);
mc('garden', `Moon dust has no plant food in it. What must a Moon farmer add?`, `Water and nutrients`, [`More dust`, `Sharp rocks`, `Nothing at all`], `Regolith has minerals, but plants also need water and nutrients. Some space farms grow plants in water with no soil at all.`);
mc('garden', `What was special about the cotton seed on China's Chang'e 4 lander in 2019?`, `It was the first plant to sprout on the Moon`, [`It grew into a giant tree`, `It made cotton shirts`, `It was a robot plant`], `The seed sprouted in a small sealed box on the far side of the Moon. It did not survive the freezing night, but it was a great first step.`);
mc('garden', `Why does a Moon greenhouse need grow lights?`, `A Moon night lasts two weeks and plants need light every day`, [`Plants like disco`, `To scare insects away`, `Earth is too bright`], `Lamps keep the plants growing when the Sun is gone. Many grow lights are pink because plants use red and blue light best.`);
mc('garden', `You plant 3 seeds in each pot. You have 4 pots. How many seeds?`, `12`, [`7`, `10`, `9`], `3 + 3 + 3 + 3 = 12 seeds.`);
mc('garden', `How can you test fairly if plants need light?`, `Grow two same plants: one in light and one in the dark`, [`Grow two different plants in different pots`, `Give one plant water and the other juice`, `Look at just one plant`], `A fair test changes only one thing (light) and keeps everything else the same.`);
mc('garden', `Astronauts on the space station grew and ate red lettuce in 2015. What does it show?`, `People can grow food in space`, [`Lettuce is a kind of rock`, `Space food is only pills`, `Plants cannot live in space`], `Growing fresh food helps long missions. One day the Moon base garden could feed the crew.`);

// ---- comms ----
mc('comms', `How do the base and Earth talk to each other?`, `With radio waves`, [`With paper planes`, `By shouting`, `With very long ropes`], `Radio waves travel through empty space at the speed of light, so messages and pictures can fly from the Moon to Earth.`);
mc('comms', `How long does a radio message take to travel from the Moon to Earth?`, `About 1 second`, [`About 1 hour`, `About 1 day`, `No time at all`], `Radio travels 300,000 km every second. The Moon is 384,400 km away, so a message takes about 1.3 seconds. A message from Mars takes minutes!`);
mc('comms', `Astronauts say "Over" at the end of a radio message. Why?`, `To tell the other person it is their turn to talk`, [`To say goodbye forever`, `To start a game`, `It is a space spell`], `Radios usually work one person at a time, so "over" means "your turn".`);
mc('comms', `Why does a communications dish have a curved bowl shape?`, `To collect weak signals and focus them on one spot`, [`To hold rain water`, `To look like a flower`, `To keep birds away`], `The curved dish gathers faint radio waves and bounces them to a receiver in the middle.`);
mc('comms', `The far side of the Moon never faces Earth. How can a base there talk to Earth?`, `Through a relay satellite orbiting the Moon`, [`It cannot`, `By waving`, `By digging a tunnel through the Moon`], `Radio waves travel in straight lines. In 2018 China launched the Queqiao satellite to relay signals from the far side.`);
mc('comms', `Sound cannot travel in empty space. How do astronauts hear each other outside?`, `Their suits have radios`, [`They shout very loudly`, `They use string telephones`, `Moon rocks carry the sound`], `Sound needs air to travel through. Radios send messages as radio waves, which do not need air.`);
mc('comms', `Why is the antenna on top of a tall mast?`, `So it can see Earth over hills and rocks`, [`To hold lights`, `To catch Moon rain`, `To hide from meteoroids`], `Radio needs a clear line of sight. A tall mast lifts the antenna above rocks and crater rims.`);
mc('comms', `A message takes 1 second to reach Earth and 1 second for the answer to come back. How many seconds before you hear the reply?`, `At least 2 seconds`, [`1 second`, `4 seconds`, `0 seconds`], `1 + 1 = 2. So there is always a small pause when you chat with Earth.`);
pairs('comms', `Match each tool to its job.`, [[`Dish`, `Sends and catches signals`], [`Camera`, `Takes pictures`], [`Microphone`, `Picks up voices`], [`Speaker`, `Plays sound`]], `A communication station needs ears, eyes, a mouth and a big radio antenna.`);

// ---- moon facts ----
mc('moonfacts', `How were most Moon craters made?`, `Space rocks (meteoroids) crashed into the Moon`, [`Giant animals dug them`, `Ice cream volcanoes`, `Rain drops`], `The Moon has almost no air, so even small space rocks hit the ground at super speed and dig bowls called craters.`);
mc('moonfacts', `Why does Earth have fewer craters than the Moon?`, `Air burns up many space rocks, and weather wears craters away`, [`Earth is magnetic`, `Earth is too small`, `Nobody counts them`], `Earth's thick air burns up most small meteoroids, and rain, wind and plants hide old craters. The Moon keeps its craters for billions of years.`);
mc('moonfacts', `What are the dark patches on the Moon called "maria" (seas)?`, `Huge flat plains of old, hardened lava`, [`Seas of water`, `Forests`, `Shadows of clouds`], `Long ago lava flooded big craters and cooled into dark rock. Early astronomers thought they were seas, so they named them maria, Latin for seas.`);
mc('moonfacts', `Why do footprints on the Moon last so long?`, `There is no wind or rain to blow them away`, [`The ground is made of glue`, `Robots repaint them`, `The Moon is cold jelly`], `The Apollo boot prints from 1969 are probably still there, and may last for millions of years.`);
mc('moonfacts', `If you drop a hammer and a feather on the Moon, which lands first?`, `They land at the same time`, [`The hammer`, `The feather`, `Neither one falls`], `With no air to slow the feather, both fall the same way. Astronaut David Scott tried it in 1971 and it worked!`);
mc('moonfacts', `Could you hear a meteoroid crash on the Moon?`, `No, sound cannot travel without air`, [`Yes, it would be very loud`, `Only with a trumpet`, `Only at night`], `Sound needs air (or something else) to travel through. The Moon is silent.`);
mc('moonfacts', `How many people have walked on the Moon so far?`, `12`, [`2`, `100`, `1,000`], `Twelve astronauts walked on the Moon between 1969 and 1972, during the Apollo missions.`);
mc('moonfacts', `What is a meteoroid?`, `A small rock flying through space`, [`A baby Moon`, `A kind of rocket`, `A star`], `When a meteoroid burns up in Earth's air we see a shooting star. On the airless Moon, meteoroids reach the ground!`);
mc('moonfacts', `Seen from the Moon's near side, where is Earth in the sky?`, `It hangs in almost the same spot all the time`, [`It rises and sets every day`, `It is too small to see`, `It is hidden behind the Sun`], `The same side of the Moon always faces Earth, so Earth does not rise or set there. It just hangs in the sky and shows phases, like our Moon.`);
mc('moonfacts', `In what year did Neil Armstrong become the first person to step on the Moon?`, `1969`, [`1869`, `1999`, `1769`], `It happened on 20 July 1969. Armstrong said: "That's one small step for man, one giant leap for mankind."`);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const W = P.Wd, n = W.res.filter(x => x.done).length, s = W.survey.filter(x => x.done).length, M = MODULES[P.m.module];
    h = chip('📦 ' + n + '/' + W.res.length, n === W.res.length ? 'ok' : '') + chip('🔬 ' + s + '/' + W.survey.length, s === W.survey.length ? 'ok' : '') + chip(M.e + ' Build', W.site.done ? 'ok' : P.ready ? 'go' : '');

}
function hudTick() {
  const r = P.r, b = Math.round(r.bat), hl = Math.round(clamp(r.hull, 0, 100));
  $('#gbat').style.width = b + '%'; $('#tbat').textContent = b + '%'; $('#ghull').style.width = hl + '%'; $('#thull').textContent = hl + '%';
  $('.g.bat').classList.toggle('low', b < 18); $('.g.hull').classList.toggle('low', hl < 28);
  updateObjChips();
  if (P.mode === 'launch' && TOUCH) { const co = P.phase === 'coast'; $('#tl').textContent = co ? '▲' : '◀'; $('#tr').textContent = co ? '▼' : '▶'; }
  const sc = $('#scan');
  if (P.mode === 'surf' && P.act) { const o = P.act, site = o.kind === 'site'; sc.classList.remove('hide'); sc.style.left = ((r.x - P.cam.x) * Z) + 'px'; sc.style.top = ((r.y - P.cam.y) * Z - 80) + 'px'; sc.style.transform = 'translate(-50%,-50%)'; sc.firstChild.style.setProperty('--p', Math.round(clamp(o.prog, 0, 1) * 100) + '%'); $('#scani').textContent = site ? '🏗️' : o.res.e; $('#scant').textContent = site ? 'Getting ready to build… hold still' : o.kind === 'res' ? 'Loading cargo… hold still' : 'Surveying… hold still'; } else sc.classList.add('hide');
}

// ====================================================================
//  attract scene (title / map / log background)
// ====================================================================
function drawAttract(t) {
  const W = SW, H = SH; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sk = ctx.createLinearGradient(0, 0, 0, H * .8); sk.addColorStop(0, '#01030a'); sk.addColorStop(1, '#0b1330'); ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H);
  drawStars(ctx, W, H, t, 1, .78);
  if (Math.random() < .004) ATT.shoot.push({ x: Math.random() * W * .8, y: Math.random() * H * .3, l: 1 });
  for (let i = ATT.shoot.length - 1; i >= 0; i--) { const s = ATT.shoot[i]; s.l -= .02; s.x += 9; s.y += 4; if (s.l <= 0) { ATT.shoot.splice(i, 1); continue; } ctx.strokeStyle = 'rgba(255,255,255,' + s.l + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - 60, s.y - 26); ctx.stroke(); }
  const er = clamp(Math.min(W, H) * .1, 40, 100); drawEarth(ctx, W * .87, H * .3, er, t);
  const hy = H * .7;
  const far = [[hy - 6, 40, .004, '#1a1d29'], [hy + 10, 26, .006, '#262a38']];
  far.forEach(([base, amp, f, col], li) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 12) ctx.lineTo(x, base - fbm(x * f + li * 9, 2, 6) * amp); ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); });
  const gy = hy + 46, gg = ctx.createLinearGradient(0, gy, 0, H); gg.addColorStop(0, '#7b7e88'); gg.addColorStop(.35, '#555862'); gg.addColorStop(1, '#262831'); ctx.fillStyle = gg; ctx.fillRect(0, gy, W, H - gy);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  for (let i = 0; i < 9; i++) { const x = (hash2(i, 5, 1) * 1.2 - .1) * W, y = gy + 18 + hash2(i, 6, 1) * (H - gy - 26), w = 24 + hash2(i, 7, 1) * 80; ctx.fillStyle = 'rgba(10,12,22,.4)'; ctx.beginPath(); ctx.ellipse(x, y, w, w * .2, 0, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y, w, w * .2, 0, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke(); }
  const s = clamp(W / 900, .75, 1.6);
  // landed ship + flag
  const lx = W * .14; ctx.strokeStyle = '#d8dde8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx + 70 * s, gy + 40 * s); ctx.lineTo(lx + 70 * s, gy - 20 * s); ctx.stroke(); ctx.fillStyle = '#1f4fbf'; ctx.fillRect(lx + 70 * s, gy - 20 * s, 28 * s, 17 * s); ctx.fillStyle = '#fff'; ctx.font = '800 ' + 12 * s + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', lx + 84 * s, gy - 8 * s);
  drawLanderSide(ctx, lx, gy + 12 * s, 1.3 * s, {});
  // buggy
  const bx = ((t * 38) % (W + 300)) - 150, by = Math.min(H - 16, gy + 70 * s);
  if (Math.random() < .5) ATT.dust.push({ x: bx - 70 * s, y: by - 4, vx: -40 - Math.random() * 40, vy: -10 - Math.random() * 20, l: 1 });
  for (let i = ATT.dust.length - 1; i >= 0; i--) { const d = ATT.dust[i]; d.l -= .02; d.x += d.vx * .016; d.y += d.vy * .016; if (d.l <= 0) { ATT.dust.splice(i, 1); continue; } ctx.fillStyle = 'rgba(190,195,210,' + d.l * .35 + ')'; ctx.beginPath(); ctx.arc(d.x, d.y, 4 + (1 - d.l) * 11, 0, 7); ctx.fill(); }
  drawBuggySide(ctx, bx, by, s, t * 5);
}

// ====================================================================
//  screens
// ====================================================================
function clearToast() { clearTimeout(toastT); $('#msg').innerHTML = ''; }
function showTitle() {
  clearToast(); scr = 'title'; P = null; $('#hud').classList.add('hide'); mini.classList.add('hide'); hideControls(); engineSound(false, 0); $('#ov').classList.add('hide');
  const lv = SAVE.level;
  $('#ui').innerHTML = '<div class="title"><h1><small>BUILD A BASE FROM SCRATCH</small>MOON STARBASE<br>BUILDER</h1><p>Launch a rocket from Earth, land on the Moon, then drive your buggy to build a whole starbase. Answer science questions to power every mission.</p>' +
    '<div class="menu"><div class="row"><button class="btn" data-act="map" style="font-size:24px;padding:14px 34px">▶ Start the mission</button></div>' +
    '<div class="row"><button class="btn alt small" data-act="log">📖 Mission log</button><button class="btn alt small" data-act="quiz">🧠 Quiz lab</button><button class="btn ghost small" data-act="how">❓ How to play</button><button class="btn ghost small" data-act="snd">' + (SAVE.sound ? '🔊 Sound on' : '🔇 Sound off') + '</button></div>' +
    '<div class="seg" id="lvseg">' + Object.entries(LEVELS).map(([k, v]) => '<button data-lv="' + k + '" class="' + (k === lv ? 'on' : '') + '">' + v.name + '</button>').join('') + '</div>' +
    '<div style="color:#dce9ff;font-weight:800;text-shadow:0 2px 8px #000">⭐ ' + totalStars() + ' / 24 stars · 🏗️ ' + builtCount() + ' / 6 modules · 💡 ' + Object.keys(SAVE.facts).length + ' / ' + BANK.length + ' facts</div></div></div>';
}
function toMap() {
  clearToast(); scr = 'map'; P = null; $('#hud').classList.add('hide'); mini.classList.add('hide'); hideControls(); engineSound(false, 0);
  $('#ui').innerHTML = '<div class="panel scr"><div class="top"><div><h2>🗺️ Mission map</h2><div class="sub">Finish a mission to unlock the next. Level: <b>' + LEVELS[SAVE.level].name + '</b></div></div><button class="btn ghost small" data-act="title">⌂ Home</button></div>' +
    '<canvas id="bcv" width="960" height="330"></canvas><div class="sub" style="margin:-6px 0 12px;text-align:center">🌙 <b>Starbase Alpha</b>: ' + builtCount() + ' of 6 modules built' + (builtCount() === 0 ? ' · your base will grow here' : '') + '</div><div class="mgrid">' +
    MISSIONS.map((m, i) => { const s = SAVE.stars[m.id] || 0, un = isUnlocked(i); return '<button class="mc ' + (un ? '' : 'lock') + '" data-mi="' + i + '"><span class="n">#' + m.id + '</span><span class="e">' + m.emoji + '</span><span class="nm">' + esc(m.name) + '</span><span class="tg">' + TOPICS[m.topic].emoji + ' ' + esc(m.tag) + '</span><span class="bd">' + (m.mode === 'launch' ? '🚀 Rocket flight' : m.mode === 'land' ? '🛬 Lander pilot' : '🏗️ Builds: ' + MODULES[m.module].name) + '</span><span class="st">' + [1, 2, 3].map(k => '<span class="star ' + (k > s ? 'off' : '') + '">★</span>').join('') + '</span></button>'; }).join('') + '</div>' +
    (builtCount() ? '<div class="row end"><button class="btn ghost small" data-act="reset">↺ Reset my base</button></div>' : '') + '</div>';
}
let logTab = 'all';
function showLog() {
  scr = 'log'; $('#hud').classList.add('hide');
  const list = BANK.filter(q => logTab === 'all' || q.t === logTab);
  $('#ui').innerHTML = '<div class="panel scr"><div class="top"><div><h2>📖 Mission log</h2><div class="sub">Every question you answer unlocks a science fact. ' + Object.keys(SAVE.facts).length + ' of ' + BANK.length + ' collected.</div></div><button class="btn ghost small" data-act="title">⌂ Home</button></div>' +
    '<div class="tabs"><button data-tab="all" class="' + (logTab === 'all' ? 'on' : '') + '">All</button>' + Object.entries(TOPICS).map(([k, v]) => '<button data-tab="' + k + '" class="' + (logTab === k ? 'on' : '') + '">' + v.emoji + ' ' + v.name + '</button>').join('') + '</div>' +
    '<div class="fgrid">' + list.map(q => SAVE.facts[q.id] ? '<div class="fcard">' + factHTML(q) + '</div>' : '<div class="fcard lk">🔒 ' + TOPICS[q.t].emoji + ' Answer this question in a mission to unlock the fact.</div>').join('') + '</div></div>';
}
function startQuiz() {
  const pool = shuffle(BANK), pr = q => (SAVE.missed[q.id] ? 2 : 0) + (SAVE.facts[q.id] ? 0 : 1), qs = pool.sort((a, b) => pr(b) - pr(a)).slice(0, 8); let i = 0, mist = 0;
  $('#ui').innerHTML = ''; scr = 'quiz'; P = null;
  const next = () => {
    if (i >= qs.length) { const ov = $('#ov'); ov.classList.remove('hide'); ov.innerHTML = '<div class="panel modal" style="text-align:center"><div class="big">🧠</div><h2>Quiz lab done!</h2><p style="font-weight:700">' + (mist ? 'You made ' + mist + ' mistake' + (mist > 1 ? 's' : '') + '. Those questions will come back first next time.' : 'No mistakes at all. Fantastic!') + '</p><div class="row" style="justify-content:center"><button class="btn" data-act="quiz">Another round</button><button class="btn ghost" data-act="title">Home</button></div></div>'; ov.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; ov.classList.add('hide'); ov.onclick = null; act(a.dataset.act); }; return; }
    const q = qs[i++]; ask(q, { practice: true, badge: '🧠 Quiz lab ' + i + ' of ' + qs.length, next: i === qs.length ? 'Finish ▶' : 'Next ▶' }, m => { mist += m; if (m) { SAVE.missed[q.id] = (SAVE.missed[q.id] || 0) + 1; persist(); } next(); });
  };
  next();
}
function howTo() {
  const ov = $('#ov'); ov.classList.remove('hide');
  ov.innerHTML = '<div class="panel modal"><h2>❓ How to play</h2>' +
    '<div class="fcard">🚀 <b>8 missions:</b> launch a rocket from Earth, coast to the Moon, land the lander, then <b>build 6 base modules</b> one by one: solar farm, habitat, ice mine, greenhouse, comms tower and launch pad.</div>' +
    '<div class="fcard" style="margin-top:8px">🧠 <b>Questions power you up.</b> Right answers refill fuel or battery. Wrong answers cost some. Missed questions come back later so you can master them.</div>' +
    '<div class="fcard" style="margin-top:8px">🚙 <b>Base missions:</b> ' + (TOUCH ? 'drag one finger to drive.' : 'arrow keys or <kbd>W A S D</kbd>, <kbd>Space</kbd> to boost.') + ' Stop in a ring and hold still to load crates, survey and build.</div>' +
    '<div class="fcard" style="margin-top:8px">🛬 <b>Rocket and lander:</b> ' + (TOUCH ? 'use the on-screen buttons.' : '<kbd>←</kbd><kbd>→</kbd> to steer or tilt, <kbd>Space</kbd> or <kbd>↑</kbd> for engine power.') + '</div>' +
    '<div class="fcard" style="margin-top:8px">⭐ <b>Stars:</b> 3 stars for 0–1 wrong answers and no repairs or crashes. Your base is saved on this device.</div>' +
    '<div class="row end"><button class="btn" id="hgo">Got it!</button></div></div>';
  $('#hgo').onclick = () => { ov.classList.add('hide'); ov.innerHTML = ''; SAVE.seen = true; persist(); };
}
function act(a) {
  SFX.click();
  if (a === 'map') { audio(); toMap(); if (!SAVE.seen) howTo(); } else if (a === 'title') showTitle(); else if (a === 'log') showLog(); else if (a === 'quiz') startQuiz(); else if (a === 'how') howTo();
  else if (a === 'snd') { SAVE.sound = !SAVE.sound; persist(); showTitle(); }
  else if (a === 'reset') { if (confirm('Remove all built modules and start the base again? Stars and facts stay.')) { SAVE.built = {}; persist(); toMap(); } }
}
$('#ui').addEventListener('click', e => {
  const lv = e.target.closest('[data-lv]'); if (lv) { SAVE.level = lv.dataset.lv; persist(); SFX.click(); $('#lvseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === lv)); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { logTab = tab.dataset.tab; showLog(); return; }
  const mi = e.target.closest('[data-mi]'); if (mi) { SFX.click(); startMission(+mi.dataset.mi); return; }
  const a = e.target.closest('[data-act]'); if (a) act(a.dataset.act);
});
function pause() {
  if (!P || P.paused || scr !== 'play') return; P.paused = true; engineSound(false, 0); const ov = $('#ov'); ov.classList.remove('hide');
  ov.innerHTML = '<div class="panel modal" style="text-align:center"><div class="big">⏸</div><h2>Paused</h2><div class="row" style="justify-content:center"><button class="btn" data-act="resume">▶ Resume</button><button class="btn ghost" data-act="restart">↻ Restart mission</button><button class="btn alt" data-act="map">🗺️ Mission map</button></div></div>';
  ov.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; ov.classList.add('hide'); ov.innerHTML = ''; ov.onclick = null; if (a.dataset.act === 'resume') P.paused = false; else if (a.dataset.act === 'restart') startMission(P.mi); else toMap(); };
}
$('#bpause').onclick = pause;
$('#bmute').onclick = () => { SAVE.sound = !SAVE.sound; persist(); $('#bmute').textContent = SAVE.sound ? '🔊' : '🔇'; if (!SAVE.sound) engineSound(false, 0); };

// ====================================================================
//  main loop
// ====================================================================
const UPD = { launch: dt => updateLaunch(dt), land: dt => updateLand(dt), surf: dt => updateSurf(dt) };
const REN = { launch: t => renderLaunch(t), land: t => renderLand(t), surf: t => renderSurf(t) };
function frame(ts) {
  const dt = Math.min(.05, (ts - wallT) / 1000); wallT = ts; const t = ts / 1000;
  if (scr === 'play' && P) {
    if (!P.paused) { const n = P.ts > 1 ? P.ts : 1; for (let i = 0; i < n && !P.paused && scr === 'play'; i++) UPD[P.mode](dt * (P.ts < 1 ? P.ts : 1)); }
    if (P && scr === 'play') { REN[P.mode](t); hudTick(); }
  } else if (scr !== 'play') { drawAttract(t); }
  const bc = $('#bcv'); if (bc) { const fin = P && P.final; drawBaseScene(bc.getContext('2d'), bc.width, bc.height, t, { night: !!fin }); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(ts => { wallT = ts; frame(ts); });
$('#bmute').textContent = SAVE.sound ? '🔊' : '🔇';
showTitle();

// debug hook (used by the automated tests)
window.__m = { get P() { return P; }, start: startMission, save: SAVE, BANK, MISSIONS, MODULES, genWorld, reachable, ask, title: showTitle, map: toMap, quiz: startQuiz, log: showLog, fin: () => { if (P) finishMission(); } };
</script></body></html>

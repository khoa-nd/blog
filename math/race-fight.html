<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Race Fight</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1128;--acc:#ffb703;--acc2:#ff4d6d;--cy:#2ec4ff;--ok:#5bd35b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:'Nunito',system-ui,sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.chip{background:rgba(10,14,35,.66);border:2px solid rgba(255,255,255,.16);border-radius:14px;padding:5px 12px;backdrop-filter:blur(3px)}
.bung{font-family:'Bungee',Impact,sans-serif;letter-spacing:.02em}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hTL{position:absolute;left:12px;top:10px;display:flex;gap:10px;align-items:center}
#hPos{font-size:34px;line-height:1;color:var(--acc);text-shadow:0 3px 0 #0006}
#hPos small{font-size:16px;color:#fff}
#hStage{font-size:13px;opacity:.9;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hBarW{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(44vw,520px)}
#hBar{position:relative;height:16px;border-radius:99px;background:rgba(10,14,35,.7);border:2px solid rgba(255,255,255,.22)}
#hBar i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;transition:left .12s linear}
#hBar i.me{width:20px;height:20px;z-index:3;border-width:3px;background:var(--acc)}
#hBar .cpm{position:absolute;top:-3px;bottom:-3px;width:3px;background:#ffd23f99;border-radius:2px}
#hBar .fin{position:absolute;right:3px;top:-6px;font-size:14px}
#hTR{position:absolute;right:12px;top:10px;text-align:right;padding:4px 12px}
#hTime{font-size:34px;line-height:1;text-shadow:0 3px 0 #0006}
#hTime.low{color:var(--acc2);animation:pulse .5s infinite alternate}
#hEl{font-size:12px;opacity:.8}
@keyframes pulse{to{transform:scale(1.12)}}
#hBL{position:absolute;left:12px;bottom:12px;display:grid;gap:7px;width:min(46vw,290px)}
.bar{position:relative;height:20px;border-radius:99px;background:rgba(10,14,35,.7);border:2px solid rgba(255,255,255,.22);overflow:hidden}
.bar b{position:absolute;inset:0;width:100%;transform-origin:left;transition:transform .1s}
.bar span{position:absolute;left:10px;top:0;line-height:16px;font-size:12px;text-shadow:0 1px 2px #000}
#bHp b{background:linear-gradient(#ff6b81,#e0243f)}
#bNit b{background:linear-gradient(#ffe45e,#ff8a1f)}
#hAm{display:flex;gap:8px;align-items:center}
#hAm .chip{font-size:20px;padding:3px 12px}
#hAm .chip.empty{color:var(--acc2);animation:pulse .35s infinite alternate}
#hSh{color:var(--cy)}
#hBR{position:absolute;right:12px;bottom:12px;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#hSpd{font-size:38px;line-height:1;text-shadow:0 3px 0 #0006}
#hSpd small{font-size:13px;opacity:.8}
#bPause{pointer-events:auto;width:46px;height:46px;border-radius:50%;background:rgba(10,14,35,.7);border:2px solid rgba(255,255,255,.3);font-size:18px}
#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;font-family:'Bungee',Impact,sans-serif;font-size:clamp(28px,7vw,64px);text-shadow:0 4px 0 #0008,0 0 24px #0006;opacity:0;white-space:nowrap}
#toast.show{animation:toast 1.25s ease-out}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.12)}22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(1)}}
#sub{position:fixed;left:50%;top:calc(26% + clamp(40px,9vw,84px));transform:translateX(-50%);z-index:6;pointer-events:none;font-size:clamp(13px,2.2vw,18px);background:rgba(10,14,35,.7);padding:6px 14px;border-radius:99px;opacity:0;white-space:nowrap}
#sub.show{animation:sub 3.2s ease-out}
@keyframes sub{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,#e0243f 140%);opacity:0}

/* touch */
#touch{position:fixed;inset:0;z-index:7;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.45);color:#fff;font-size:26px;touch-action:none;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
#touch button.on{background:rgba(255,183,3,.55)}
#tL{left:14px;bottom:88px}#tR{left:112px;bottom:88px}
#tF{right:16px;bottom:96px;width:104px!important;height:104px!important;font-size:34px!important;background:rgba(255,77,109,.4)!important}
#tN{right:132px;bottom:88px}
#tB{right:16px;bottom:214px;width:62px!important;height:62px!important;font-size:18px!important}

/* screens */
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:radial-gradient(ellipse at 50% 30%,rgba(20,30,70,.45),rgba(6,8,22,.86));overflow:auto;text-align:center}
.logo{font-family:'Bungee',Impact,sans-serif;font-size:clamp(46px,11vw,112px);line-height:.95;margin:0;background:linear-gradient(#fff 15%,#ffd23f 55%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #5a1d00) drop-shadow(0 0 28px #ff7a1a88);transform:rotate(-2deg)}
.tag{font-size:clamp(14px,2.6vw,22px);opacity:.92;margin:-4px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.lbl{font-size:12px;letter-spacing:.2em;opacity:.75;text-transform:uppercase;width:100%;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opt{padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);font-size:15px;min-width:96px}
.opt.sel{background:var(--acc);color:#2a1a00;border-color:#fff;box-shadow:0 0 0 3px #ffb70355}
.opt small{display:block;font-size:11px;opacity:.8;font-weight:700}
.dchip{width:112px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dchip i{width:42px;height:42px;border-radius:50%;border:3px solid #fff;display:block}
.big{padding:14px 40px;border-radius:16px;font-size:24px;background:linear-gradient(#ffd23f,#ff9f1c);color:#3a2200;box-shadow:0 6px 0 #a35b00,0 10px 24px #0008;font-family:'Bungee',Impact,sans-serif}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #a35b00}
.ghost{padding:10px 20px;border-radius:12px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);font-size:15px}
.help{font-size:13px;opacity:.78;max-width:640px;line-height:1.5}
.help kbd{background:#fff2;border:1px solid #fff5;border-radius:6px;padding:1px 6px;font-family:inherit}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;width:min(960px,100%)}
.card{position:relative;border-radius:18px;padding:12px;text-align:left;border:3px solid rgba(255,255,255,.3);min-height:150px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 18px #0007;overflow:hidden}
.card:hover:not(.lock){transform:translateY(-3px);border-color:#fff}
.card .ic{font-size:40px;line-height:1}
.card h3{margin:0;font-size:17px}
.card .st{font-size:22px;color:#ffd23f;letter-spacing:2px}
.card .meta{font-size:12px;opacity:.85}
.card.lock{filter:grayscale(.9) brightness(.55);cursor:not-allowed}
.card.lock::after{content:'🔒';position:absolute;right:12px;top:10px;font-size:26px}
.res h2{font-size:clamp(30px,6vw,56px);margin:0}
#rPlace{font-size:clamp(70px,16vw,150px);line-height:1;color:var(--acc);text-shadow:0 6px 0 #6a3b00,0 0 40px #ffb70388;margin:0}
#rStars{font-size:48px;letter-spacing:8px;color:#ffd23f;text-shadow:0 4px 0 #0007}
#rStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:min(560px,100%)}
#rStats div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px}
#rStats b{display:block;font-size:22px}
#rStats span{font-size:11px;opacity:.75;letter-spacing:.12em;text-transform:uppercase}
#rTip{max-width:560px;font-size:14px;opacity:.9}

/* phones / touch */
@media (max-width:640px){#hStage{display:none}#hPos{font-size:26px}#hTime{font-size:26px}#hEl{display:none}#hBarW{top:58px;width:calc(100vw - 24px)}}
body.touch #hBL{bottom:auto;top:92px;width:min(42vw,200px);gap:5px}
body.touch #hBL .bar{height:16px}body.touch #hBL .bar span{font-size:10px;line-height:12px}
body.touch #hAm .chip{font-size:15px;padding:2px 10px}
body.touch #hBR{bottom:auto;top:86px}body.touch #hSpd{display:none}
body.touch #hBarW{top:58px;width:min(60vw,calc(100vw - 24px))}
@media (max-height:520px) and (orientation:landscape){body.touch #hBarW{top:12px;width:min(40vw,360px)}body.touch #hBL{top:62px}body.touch #hBR{top:62px}#tL{bottom:30px}#tR{bottom:30px;left:112px}#tF{bottom:30px}#tN{bottom:24px;right:132px}#tB{bottom:150px}}
@media (max-height:520px){.logo{font-size:44px}.scr{gap:8px}.big{padding:8px 26px;font-size:18px}#rPlace{font-size:64px}#rStars{font-size:30px}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="hud" class="hide">
 <div id="hTL"><div id="hPos" class="bung chip">1<small>st / 4</small></div><div id="hStage" class="chip"></div></div>
 <div id="hBarW"><div id="hBar"></div></div>
 <div id="hTR" class="chip"><div id="hTime" class="bung">0</div><div id="hEl"></div></div>
 <div id="hBL">
  <div class="bar" id="bHp"><b></b><span>ARMOR</span></div>
  <div id="hAm"><div class="chip" id="hAmmo">⚡ 0</div><div class="chip hide" id="hSh">🛡️</div></div>
  <div class="bar" id="bNit"><b></b><span>NITRO (Shift)</span></div>
 </div>
 <div id="hBR"><button id="bPause" aria-label="Pause">⏸</button><div id="hSpd" class="bung">0<small> km/h</small></div></div>
</div>
<div id="toast"></div><div id="sub"></div>
<div id="touch" class="hide">
 <button id="tL">◀</button><button id="tR">▶</button><button id="tB">STOP</button><button id="tN">🔥</button><button id="tF">💥</button>
</div>

<div id="scrTitle" class="scr">
 <h1 class="logo">RACE<br>FIGHT</h1>
 <p class="tag">Race. Blast. Cross the line first.</p>
 <div class="row"><div class="lbl">Level</div><div class="seg" id="segLv"></div></div>
 <div class="row"><div class="lbl">Pick your driver</div><div class="seg" id="segDr"></div></div>
 <div class="row"><button class="big" id="bPlay">PLAY</button><button class="ghost" id="bSnd">🔊 Sound on</button></div>
 <div class="help" id="helpKeys"><kbd>←</kbd><kbd>→</kbd> steer · <kbd>↑</kbd> gas · <kbd>↓</kbd> brake · <kbd>Space</kbd> or click = fire · mouse = aim · <kbd>Shift</kbd> nitro · <kbd>P</kbd> pause</div>
</div>

<div id="scrStages" class="scr hide">
 <h2 class="bung" style="margin:0;font-size:clamp(26px,5vw,44px)">Choose a track</h2>
 <div id="grid"></div>
 <button class="ghost" id="bBack">← Back</button>
</div>

<div id="scrPause" class="scr hide">
 <h2 class="bung" style="font-size:48px;margin:0">PAUSED</h2>
 <div class="row"><button class="big" id="bResume">RESUME</button></div>
 <div class="row"><button class="ghost" id="bRestart">↻ Restart</button><button class="ghost" id="bQuit">Track list</button></div>
</div>

<div id="scrResult" class="scr res hide">
 <h2 class="bung" id="rTitle">FINISH!</h2>
 <div class="bung" id="rPlace">1st</div>
 <div id="rStars">★★★</div>
 <div id="rStats"></div>
 <div id="rTip"></div>
 <div class="row"><button class="big" id="bNext">NEXT TRACK</button></div>
 <div class="row"><button class="ghost" id="bRetry">↻ Race again</button><button class="ghost" id="bMenu">Track list</button></div>
</div>

<script>
'use strict';
/* ================= helpers ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = id => document.getElementById(id);
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10 > 3 ? 0 : n % 10]);
const fmtT = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };

/* ================= save ================= */
const SAVE_KEY = 'racefight-save';
const SAVE = { stars: {}, best: {}, level: 'pro', driver: 0, sound: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) Object.assign(SAVE, s); } catch (e) { }
function saveNow() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { } }
function unlockedCount() { let u = 1; for (let i = 0; i < 5; i++) if ((SAVE.stars[i] || 0) > 0) u = Math.max(u, i + 2); return Math.min(u, 5); }

/* ================= audio ================= */
const AU = { c: null, m: null, eng: null, engG: null };
function auInit() {
  if (AU.c) { if (AU.c.state === 'suspended') AU.c.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; AU.c = new C();
    AU.m = AU.c.createGain(); AU.m.gain.value = SAVE.sound ? 0.9 : 0; AU.m.connect(AU.c.destination);
    const o = AU.c.createOscillator(); o.type = 'sawtooth'; const f = AU.c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 480;
    const g = AU.c.createGain(); g.gain.value = 0; o.connect(f); f.connect(g); g.connect(AU.m); o.start();
    AU.eng = o; AU.engG = g;
  } catch (e) { AU.c = null; }
}
function auMute() { if (AU.m) AU.m.gain.value = SAVE.sound ? 0.9 : 0; }
function tone(f, d, type, vol, slide, delay) {
  if (!AU.c) return; const t = AU.c.currentTime + (delay || 0);
  const o = AU.c.createOscillator(), g = AU.c.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol || .06, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(AU.m); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, fq) {
  if (!AU.c) return; const t = AU.c.currentTime, n = Math.floor(AU.c.sampleRate * d);
  const b = AU.c.createBuffer(1, n, AU.c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AU.c.createBufferSource(); s.buffer = b; const f = AU.c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq || 800;
  const g = AU.c.createGain(); g.gain.value = vol || .1; s.connect(f); f.connect(g); g.connect(AU.m); s.start(t);
}
let sfxT = {};
function sfx(n) {
  if (!AU.c) return; const now = performance.now(); if (sfxT[n] && now - sfxT[n] < 45) return; sfxT[n] = now;
  switch (n) {
    case 'shoot': tone(1100, .08, 'square', .035, -700); break;
    case 'eshoot': tone(420, .12, 'sawtooth', .03, -200); break;
    case 'hit': tone(320, .09, 'sawtooth', .06, -200); break;
    case 'hurt': tone(170, .24, 'sawtooth', .1, -100); noise(.16, .07, 900); break;
    case 'boom': noise(.55, .2, 520); tone(95, .45, 'sawtooth', .12, -60); break;
    case 'pick': tone(660, .07, 'triangle', .08); tone(990, .1, 'triangle', .08, 0, .07); break;
    case 'beep': tone(520, .16, 'square', .06); break;
    case 'go': tone(1000, .45, 'square', .07); break;
    case 'empty': tone(120, .06, 'square', .05); break;
    case 'cp': tone(740, .09, 'triangle', .08); tone(988, .09, 'triangle', .08, 0, .09); tone(1318, .16, 'triangle', .08, 0, .18); break;
    case 'boost': tone(260, .5, 'sawtooth', .06, 800); break;
    case 'bump': noise(.1, .09, 320); break;
    case 'win': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .22, 'square', .06, 0, i * .11)); break;
    case 'lose': [440, 392, 330, 262].forEach((f, i) => tone(f, .26, 'sawtooth', .06, 0, i * .17)); break;
    case 'spin': tone(700, .5, 'sine', .06, -500); break;
  }
}

/* ================= data ================= */
const LEVELS = {
  rookie: { name: 'Rookie', sub: 'relaxed rivals', rv: 0.90, rhp: 2, rfire: 3.0, tfire: 3.2, dmg: 7, time: 1.3, tur: 0.9, ammo: 32, band: 0.05, lead: 0.3, range: 430 },
  pro: { name: 'Pro', sub: 'a real race', rv: 0.97, rhp: 3, rfire: 2.1, tfire: 2.3, dmg: 11, time: 1.0, tur: 1.35, ammo: 26, band: 0.09, lead: 0.65, range: 480 },
  champ: { name: 'Champion', sub: 'tough & fast', rv: 1.04, rhp: 4, rfire: 1.5, tfire: 1.6, dmg: 15, time: 0.9, tur: 1.7, ammo: 22, band: 0.13, lead: 0.95, range: 540 }
};
const DRIVERS = [
  { n: 'Dash', col: '#2ec4ff', col2: '#0b6aa3', helm: '#ffd23f', spd: 1.06, hp: 0, fr: 1, pk: 1, perk: '+6% top speed' },
  { n: 'Tank', col: '#6bd36b', col2: '#2b7a2b', helm: '#2b2b2b', spd: 1, hp: 35, fr: 1, pk: 1, perk: '+35 armor' },
  { n: 'Ace', col: '#ff5a5f', col2: '#a3202a', helm: '#fff', spd: 1, hp: 0, fr: 0.74, pk: 1, perk: 'Faster blaster' },
  { n: 'Lucky', col: '#ff8fd0', col2: '#b8438b', helm: '#7a3cff', spd: 1, hp: 0, fr: 1, pk: 1.6, perk: 'Pickups +60%' }
];
const ROSTER = [
  { n: 'Rex', col: '#e63946', col2: '#8f1b26', helm: '#222', spd: 1.0, aggr: .25, fr: 1.0 },
  { n: 'Zippy', col: '#ffd23f', col2: '#b88a00', helm: '#e63946', spd: .98, aggr: .5, fr: 1.15 },
  { n: 'Bruno', col: '#4caf50', col2: '#216c24', helm: '#f5f5f5', spd: 1.02, aggr: .8, fr: .9 },
  { n: 'Luna', col: '#a45cff', col2: '#5b2aa6', helm: '#ffd23f', spd: .96, aggr: .4, fr: 1.1 },
  { n: 'Fang', col: '#ff8a1f', col2: '#a34a00', helm: '#111', spd: 1.03, aggr: .7, fr: .85 },
  { n: 'Baron Blast', col: '#33333d', col2: '#c9a227', helm: '#c9a227', spd: 1.0, aggr: .9, fr: .7, big: true, boss: true }
];
const THEMES = {
  meadow: { ground: '#7ccb6b', spk: ['#8fdc7e', '#62ad52', '#f7e66a', '#ffffff', '#e86a92'], shoulder: '#cfae72', road: '#4b505c', edge: '#ffffff', line: '#f6d24a', wall: ['#e63946', '#f5f5f5'], bg: '#7ccb6b' },

const STEP = 20, WALL = 70;
function genTrack(st) {
  const startS = 520, finishS = startS + st.len, total = finishS + 800, n = Math.ceil(total / STEP) + 1;
  const r = mulberry(st.seed);
  const x = new Float32Array(n), y = new Float32Array(n), ta = new Float32Array(n), ck = new Float32Array(n);
  let px = 0, py = 0, a = -Math.PI / 2; const a0 = a; let k = 0, kt = 0, next = 26;
  for (let i = 0; i < n; i++) {
    x[i] = px; y[i] = py; ta[i] = a;
    if (i >= next) { kt = r() < .26 ? 0 : (r() * 2 - 1) * st.curv; next = i + Math.floor(14 + r() * 38); }
    let kk = i < 26 ? 0 : kt;
    const dev = a - a0;
    kk -= dev * 0.0009 + Math.sign(dev) * Math.max(0, Math.abs(dev) - 0.7) * 0.004;
    k += (kk - k) * 0.1; a += k * STEP;
    if (Math.abs(a - a0) > 1.0) { a = a0 + Math.sign(a - a0) * 1.0; k = 0; }
    px += Math.cos(a) * STEP; py += Math.sin(a) * STEP;
  }
  for (let i = 1; i < n; i++) ck[i] = angDiff(ta[i - 1], ta[i]) / STEP;
  ck[0] = ck[1];
  return { n, x, y, ta, ck, startS, finishS, L: (n - 1) * STEP, STEP };
}
function trackAt(T, s, o) {
  o = o || {}; let f = s / STEP, i = Math.floor(f);
  if (i < 0) { i = 0; f = 0; } else if (i >= T.n - 1) { i = T.n - 2; f = 1; } else f -= i;
  o.x = T.x[i] + (T.x[i + 1] - T.x[i]) * f; o.y = T.y[i] + (T.y[i + 1] - T.y[i]) * f;
  o.a = T.ta[i]; o.nx = -Math.sin(o.a); o.ny = Math.cos(o.a); o.i = i; o.ck = T.ck[i]; return o;
}
function nearest(T, px, py, hint, full) {
  let lo = Math.max(0, hint - 10), hi = Math.min(T.n - 2, hint + 22);
  if (full) { lo = 0; hi = T.n - 2; }
  let best = 1e18, bi = lo, bf = 0;

    const ax = T.x[i], ay = T.y[i], dx = T.x[i + 1] - ax, dy = T.y[i + 1] - ay;
    const f = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    const cx = ax + dx * f - px, cy = ay + dy * f - py, d = cx * cx + cy * cy;
    if (d < best) { best = d; bi = i; bf = f; }
  }

  const lat = (px - cx) * nx + (py - cy) * ny;
  return { i: bi, s: (bi + bf) * STEP, lat };
}

  else if (p.t === 'nitro') { c.beginPath(); c.moveTo(0, -14); c.bezierCurveTo(14, -2, 12, 12, 0, 13); c.bezierCurveTo(-12, 12, -13, 0, 0, -14); c.fill(); c.fillStyle = col; c.beginPath(); c.arc(0, 5, 5, 0, TAU); c.fill(); }
  else { c.beginPath(); c.moveTo(0, -13); c.lineTo(11, -8); c.lineTo(10, 4); c.quadraticCurveTo(8, 11, 0, 14); c.quadraticCurveTo(-8, 11, -10, 4); c.lineTo(-11, -8); c.closePath(); c.fill(); }
  c.restore();
}

/* ---------- main ---------- */
function draw() {
  const g = G; if (!g) return; const c = ctx, th = g.th, pl = g.pl, cam = g.cam, T = g.T, hw = g.hw, tm = g.tick;
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.fillStyle = th.bg; c.fillRect(0, 0, W, H);
  const sx = (Math.random() - .5) * g.shake, sy = (Math.random() - .5) * g.shake;
  c.save(); c.translate(W / 2 + sx, H / 2 + sy); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  const vw = W / cam.z / 2 + 80, vh = H / cam.z / 2 + 80, vx0 = cam.x - vw, vx1 = cam.x + vw, vy0 = cam.y - vh, vy1 = cam.y + vh;
  if (!g.ground) g.ground = makeGround(th, g.st.theme);
  c.fillStyle = g.ground; c.fillRect(vx0, vy0, vw * 2, vh * 2);
  /* road */
  const ci = nearest(T, cam.x, cam.y, pl.i, true).i, i0 = Math.max(0, ci - 70), i1 = Math.min(T.n - 1, ci + 110);
  const path = off => { c.beginPath(); for (let i = i0; i <= i1; i++) { const x = T.x[i] - Math.sin(T.ta[i]) * off, y = T.y[i] + Math.cos(T.ta[i]) * off; if (i === i0) c.moveTo(x, y); else c.lineTo(x, y); } };
  c.lineJoin = 'round'; c.lineCap = 'butt';
  path(0); c.strokeStyle = th.shoulder; c.lineWidth = 2 * (hw + WALL); c.stroke();
  path(0); c.strokeStyle = th.edge; c.lineWidth = 2 * hw + 16; c.stroke();
  path(0); c.strokeStyle = th.road; c.lineWidth = 2 * hw; c.stroke();
  if (g.st.theme === 'city') { path(0); c.globalAlpha = .12; c.strokeStyle = '#00e5ff'; c.lineWidth = 2 * hw - 30; c.stroke(); c.globalAlpha = 1; }
  path(0); c.strokeStyle = th.line; c.lineWidth = 6; c.setLineDash([34, 40]); c.stroke(); c.setLineDash([]);
  /* patches, boosts, gates */
  for (const p of g.patches) if (p.x > vx0 - 100 && p.x < vx1 + 100 && p.y > vy0 - 100 && p.y < vy1 + 100) drawPatch(p, tm);
  for (const b of g.boosts) if (b.x > vx0 - 80 && b.x < vx1 + 80 && b.y > vy0 - 80 && b.y < vy1 + 80) drawBoost(b, tm);
  const sP = trackAt(T, T.startS, _d); if (Math.abs(sP.x - cam.x) < vw + 200 && Math.abs(sP.y - cam.y) < vh + 200) drawGate(g, T.startS, 'START', 'check');
  const fP = trackAt(T, T.finishS, _d); if (Math.abs(fP.x - cam.x) < vw + 200 && Math.abs(fP.y - cam.y) < vh + 200) drawGate(g, T.finishS, 'FINISH', 'check');
  for (const cp of g.cps) { const q = trackAt(T, cp.s, _d); if (Math.abs(q.x - cam.x) < vw + 200 && Math.abs(q.y - cam.y) < vh + 200) drawGate(g, cp.s, 'CHECKPOINT', 'cp'); }
  /* barrier */
  for (const sd of [-1, 1]) {
    path(sd * (hw + WALL)); c.lineWidth = 18; c.strokeStyle = th.wall[0]; c.setLineDash([24, 24]); c.stroke();
    path(sd * (hw + WALL)); c.strokeStyle = th.wall[1]; c.lineDashOffset = 24; c.stroke(); c.lineDashOffset = 0; c.setLineDash([]);
  }
  /* decor */
  const dA = lowerBound(g.decor, pl.s - 1800), dB = lowerBound(g.decor, pl.s + 2400);
  for (let i = dA; i < dB; i++) { const d = g.decor[i]; if (d.x > vx0 - d.r && d.x < vx1 + d.r && d.y > vy0 - d.r && d.y < vy1 + d.r) drawDecor(d, tm); }
  /* objects */
  for (const o of g.obs) if (!o.dead && o.x > vx0 - 40 && o.x < vx1 + 40 && o.y > vy0 - 40 && o.y < vy1 + 40) drawObs(o);
  for (const t of g.turrets) if (t.x > vx0 - 60 && t.x < vx1 + 60 && t.y > vy0 - 60 && t.y < vy1 + 60) drawTurret(t, th, tm);
  for (const p of g.picks) if (p.x > vx0 - 40 && p.x < vx1 + 40 && p.y > vy0 - 40 && p.y < vy1 + 40) drawPick(p, tm);
  /* cars */
  for (const r of g.rivals) {
    if (r.x < vx0 - 80 || r.x > vx1 + 80 || r.y < vy0 - 80 || r.y > vy1 + 80) continue;
    if (r.wreck > 0) { drawWreck(r, tm); continue; }
    drawCar({ x: r.x, y: r.y, a: r.a, gunA: r.gunA, col: r.ro.col, col2: r.ro.col2, helm: r.ro.helm, big: r.ro.big, flash: r.flash, alpha: r.inv > 0 ? (Math.sin(tm * 30) > 0 ? .45 : 1) : 1, tip: '#ff4d6d' });
    if (r.tele) { c.save(); c.translate(r.x, r.y - 52); c.fillStyle = '#ff3b57'; c.font = "22px 'Bungee',Impact"; c.textAlign = 'center'; c.fillText('!', 0, 0); c.restore(); c.save(); c.translate(r.x, r.y); c.rotate(r.gunA); c.strokeStyle = 'rgba(255,60,80,.8)'; c.lineWidth = 3; c.setLineDash([8, 8]); c.beginPath(); c.moveTo(46, 0); c.lineTo(180, 0); c.stroke(); c.restore(); }
    c.save(); c.translate(r.x, r.y - 44); c.font = "11px 'Nunito',sans-serif"; c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.85)'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 3; c.strokeText(r.ro.n, 0, 0); c.fillText(r.ro.n, 0, 0);
    if (r.hp < r.maxhp) { c.fillStyle = '#0009'; c.fillRect(-18, 5, 36, 6); c.fillStyle = '#ff6b81'; c.fillRect(-17, 6, 34 * r.hp / r.maxhp, 4); } c.restore();
  }
  if (pl.dead <= 0) {
    const nOn = input.nit && pl.nit > 0 && (input.up || input.tGas || g.auto);
    drawCar({ x: pl.x, y: pl.y, a: pl.a, gunA: pl.gunA, col: g.dr.col, col2: g.dr.col2, helm: g.dr.helm, flash: pl.flash > 0 ? 1 : 0, alpha: pl.inv > 0 && pl.shield <= 0 ? (Math.sin(tm * 30) > 0 ? .4 : 1) : 1, flame: nOn || pl.boost > 0, tip: '#7df9ff' });
    if (pl.shield > 0) drawShieldFx(pl, tm);
    if (!g.demo) { c.save(); c.translate(pl.x, pl.y); c.rotate(pl.gunA); c.strokeStyle = 'rgba(125,249,255,.35)'; c.lineWidth = 2; c.setLineDash([4, 10]); c.beginPath(); c.moveTo(50, 0); c.lineTo(260, 0); c.stroke(); c.restore(); }
  }
  /* bolts */
  for (const b of g.bolts) {
    c.strokeStyle = b.col; c.lineCap = 'round'; c.lineWidth = b.r * 1.7; c.globalAlpha = .55; c.beginPath(); c.moveTo(b.x - b.vx * .035, b.y - b.vy * .035); c.lineTo(b.x, b.y); c.stroke(); c.globalAlpha = 1;
    circ(c, b.x, b.y, b.r, b.col); circ(c, b.x, b.y, b.r * .5, '#fff');
  }
  c.lineCap = 'butt';
  /* particles */
  for (const p of g.parts) {
    const k = p.life / p.max;
    if (p.k === 2) { c.globalAlpha = k * .6; circ(c, p.x, p.y, p.r * (1.6 - k * .6), p.col); }
    else if (p.k === 3) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = k; circ(c, p.x, p.y, p.r * (.4 + k * .8), p.col); c.globalCompositeOperation = 'source-over'; }
    else if (p.k === 4) { c.globalAlpha = Math.min(1, k * 2); c.fillStyle = p.col; c.fillRect(p.x, p.y, p.r, p.r * 1.6); }
    else { c.globalAlpha = k; c.fillStyle = p.col; c.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  }
  c.globalAlpha = 1;
  /* floaters */
  c.textAlign = 'center'; c.font = "20px 'Bungee',Impact,sans-serif"; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.7)';
  for (const f of g.flo) { c.globalAlpha = clamp(f.life / .5, 0, 1); c.fillStyle = f.col; c.strokeText(f.txt, f.x, f.y); c.fillText(f.txt, f.x, f.y); }
  c.globalAlpha = 1;
  c.restore();
  /* speed lines */
  const sp = pl.speed || 0;
  if (sp > 450 && !g.demo) { c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, d1 = Math.min(W, H) * (.35 + Math.random() * .25), d2 = d1 + 60 + Math.random() * 80; c.beginPath(); c.moveTo(W / 2 + Math.cos(a) * d1, H / 2 + Math.sin(a) * d1); c.lineTo(W / 2 + Math.cos(a) * d2, H / 2 + Math.sin(a) * d2); c.stroke(); } }
  /* night tint */
  if (g.st.theme === 'city' || g.st.theme === 'volcano') { c.fillStyle = g.st.theme === 'city' ? 'rgba(10,8,40,.12)' : 'rgba(40,5,0,.1)'; c.fillRect(0, 0, W, H); }
}

/* ================= HUD ================= */
let hudCache = {}, appState = 'title';
function setTxt(id, v, html) { if (hudCache[id] !== v) { hudCache[id] = v; const e = $(id); if (html) e.innerHTML = v; else e.textContent = v; } }
function hudInit() {
  hudCache = {}; const g = G, bar = $('hBar'); bar.innerHTML = '';
  if (g.demo) return;
  g.cps.forEach(cp => { const m = document.createElement('div'); m.className = 'cpm'; m.style.left = (4 + 92 * (cp.s - g.T.startS) / g.st.len) + '%'; bar.appendChild(m); });
  const f = document.createElement('div'); f.className = 'fin'; f.textContent = '🏁'; bar.appendChild(f);
  g.rivals.forEach(r => { const d = document.createElement('i'); d.style.background = r.ro.col; r._dot = d; bar.appendChild(d); });
  const me = document.createElement('i'); me.className = 'me'; me.style.background = g.dr.col; g._me = me; bar.appendChild(me);
  $('hStage').textContent = g.st.name;
}
function rankNow() { const g = G, pl = g.pl; let k = 1; for (const r of g.rivals) if (r.fin || r.s > pl.s) k++; return k; }
function hudUpdate() {
  const g = G; if (!g || g.demo) return; const pl = g.pl;
  const rk = g.state === 'done' ? g.place : rankNow();
  setTxt('hPos', ord(rk).replace(/(\d+)(\D+)/, '$1<small>$2 / ' + (g.rivals.length + 1) + '</small>'), true);
  setTxt('hTime', String(Math.ceil(g.time))); $('hTime').classList.toggle('low', g.time < 10 && g.state === 'race');
  setTxt('hEl', 'race time ' + fmtT(g.elapsed));
  g._hpRatio = pl.hp / pl.maxHp; $('bHp').firstChild.style.transform = 'scaleX(' + clamp(pl.hp / pl.maxHp, 0, 1) + ')';
  $('bNit').firstChild.style.transform = 'scaleX(' + clamp(pl.nit, 0, 1) + ')';
  setTxt('hAmmo', '⚡ ' + pl.ammo); $('hAmmo').classList.toggle('empty', pl.ammo <= 0);
  $('hSh').classList.toggle('hide', !(pl.shield > 0)); if (pl.shield > 0) setTxt('hSh', '🛡️ ' + Math.ceil(pl.shield));
  setTxt('hSpd', Math.round(pl.speed * .3) + '<small> km/h</small>', true);
  const L = g.st.len, pos = s => (4 + 92 * clamp((s - g.T.startS) / L, 0, 1)) + '%';
  g.rivals.forEach(r => { r._dot.style.left = pos(r.s); }); g._me.style.left = pos(pl.s);
  $('vig').style.opacity = g.vig * .8;
}

/* ================= screens ================= */
function showOnly(id) { for (const s of ['scrTitle', 'scrStages', 'scrPause', 'scrResult']) $(s).classList.toggle('hide', s !== id); }
function hudOn(on) { $('hud').classList.toggle('hide', !on); $('touch').classList.toggle('hide', !(on && input.touch)); if (!on) $('vig').style.opacity = 0; }
function toDemo() { if (!G || !G.demo) { startStage(0, { demo: true }); } hudOn(false); }
function goTitle() { toDemo(); appState = 'title'; showOnly('scrTitle'); }
function goStages() { toDemo(); appState = 'stages'; renderStages(); showOnly('scrStages'); }
function startRace(idx) { auInit(); showOnly(null); $('toast').classList.remove('show'); $('sub').classList.remove('show'); startStage(idx); appState = 'race'; hudOn(true); input.tGas = input.touch ? 1 : 0; }
function togglePause(force) {
  if (!G || G.demo || G.over || appState === 'result') return;
  const p = force === undefined ? !G.paused : force; G.paused = p; appState = p ? 'paused' : 'race'; showOnly(p ? 'scrPause' : null);
}
function renderStages() {
  const grid = $('grid'); grid.innerHTML = ''; const u = unlockedCount();
  STAGES.forEach((st, i) => {
    const b = document.createElement('button'); b.className = 'card' + (i >= u ? ' lock' : ''); b.style.background = 'linear-gradient(145deg,' + st.grad[0] + ',' + st.grad[1] + ')';
    const stars = SAVE.stars[i] || 0, best = SAVE.best[i];
    b.innerHTML = '<div class="ic">' + st.ic + '</div><h3>' + st.name + '</h3><div class="st">' + '★'.repeat(stars) + '<span style="opacity:.35">' + '★'.repeat(3 - stars) + '</span></div><div class="meta">Track ' + (i + 1) + ' · ' + (st.rivals + 1) + ' racers · ' + Math.round(st.len / 1000 * 10) / 10 + ' km' + (best ? '<br>Best ' + fmtT(best) : '') + '</div>';
    if (i < u) b.onclick = () => startRace(i);
    grid.appendChild(b);
  });
}
function showResult(win) {
  const g = G; appState = 'result'; hudOn(false); showOnly('scrResult'); $('vig').style.opacity = 0; $('toast').classList.remove('show'); $('sub').classList.remove('show');
  let stars = 0;
  if (win) { stars = g.place === 1 ? 3 : g.place <= 3 ? 2 : 1; if (stars > (SAVE.stars[g.idx] || 0)) SAVE.stars[g.idx] = stars; if (!SAVE.best[g.idx] || g.elapsed < SAVE.best[g.idx]) SAVE.best[g.idx] = g.elapsed; saveNow(); }
  const last = g.idx === STAGES.length - 1;
  $('rTitle').textContent = win ? (last && g.place === 1 ? 'CHAMPION OF THE VOLCANO!' : g.place === 1 ? 'YOU WON!' : 'YOU FINISHED!') : "TIME'S UP!";
  $('rPlace').textContent = win ? ord(g.place) : '⏱️';
  $('rStars').innerHTML = '★'.repeat(stars) + '<span style="opacity:.3">' + '★'.repeat(3 - stars) + '</span>';
  const s = g.stats, acc = s.shots ? Math.round(100 * s.hits / s.shots) : 0;
  $('rStats').innerHTML = [[fmtT(g.elapsed), 'Race time'], [s.kills, 'Wrecked'], [s.wrecks, 'Times wrecked'], [acc + '%', 'Accuracy'], [s.picks, 'Pickups']].map(a => '<div><b>' + a[0] + '</b><span>' + a[1] + '</span></div>').join('');
  $('rTip').textContent = win ? (g.place === 1 ? '3 stars! Try a harder level for a bigger challenge.' : g.place <= 3 ? 'Almost! Finish 1st for 3 stars: wreck the leaders to slow them down.' : 'Wreck rivals to grab their ammo, and use nitro on the straights.') : 'Drive through the checkpoint gates for extra seconds, and use nitro on long straights.';
  $('bNext').classList.toggle('hide', !(win && !last));
  if (win) { auInit(); }
}

/* ================= input ================= */
const KEYS = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'dn', KeyS: 'dn', Space: 'fire', KeyJ: 'fire', KeyZ: 'fire', ShiftLeft: 'nit', ShiftRight: 'nit', KeyX: 'nit' };
window.addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape') { if (!e.repeat) togglePause(); e.preventDefault(); return; }
  if (e.code === 'Enter' && appState === 'title') { auInit(); goStages(); return; }
  const k = KEYS[e.code]; if (k) { input[k] = 1; if (appState === 'race') e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) input[k] = 0; });
window.addEventListener('blur', () => { for (const k of ['l', 'r', 'up', 'dn', 'fire', 'nit']) input[k] = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden && appState === 'race') togglePause(true); });
window.addEventListener('mousemove', e => { input.mx = e.clientX; input.my = e.clientY; if (appState === 'race') input.mAct = 8; });
function bindHold(id, key) {
  const el = $(id), on = e => { e.preventDefault(); input[key] = 1; el.classList.add('on'); input.touch = true; document.body.classList.add('touch'); }, off = e => { input[key] = 0; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
cv = $('cv'); ctx = cv.getContext('2d');
cv.addEventListener('pointerdown', e => { if (appState !== 'race') return; if (e.pointerType === 'mouse') { input.fire = 1; input.mx = e.clientX; input.my = e.clientY; input.mAct = 8; } });
window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') input.fire = 0; });
bindHold('tL', 'l'); bindHold('tR', 'r'); bindHold('tB', 'dn'); bindHold('tN', 'nit'); bindHold('tF', 'fire');
input.touch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window;
document.body.classList.toggle('touch', input.touch);
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);

/* ================= wiring ================= */
function buildTitle() {
  const sl = $('segLv'); sl.innerHTML = '';
  Object.keys(LEVELS).forEach(k => { const b = document.createElement('button'); b.className = 'opt' + (SAVE.level === k ? ' sel' : ''); b.innerHTML = LEVELS[k].name + '<small>' + LEVELS[k].sub + '</small>'; b.onclick = () => { SAVE.level = k; saveNow(); buildTitle(); }; sl.appendChild(b); });
  const sd = $('segDr'); sd.innerHTML = '';
  DRIVERS.forEach((d, i) => { const b = document.createElement('button'); b.className = 'opt dchip' + (SAVE.driver === i ? ' sel' : ''); b.innerHTML = '<i style="background:' + d.col + '"></i>' + d.n + '<small>' + d.perk + '</small>'; b.onclick = () => { SAVE.driver = i; saveNow(); buildTitle(); }; sd.appendChild(b); });
  $('bSnd').textContent = SAVE.sound ? '🔊 Sound on' : '🔇 Sound off';
  if (input.touch) $('bNit').lastChild.textContent = 'NITRO';
  if (input.touch) $('helpKeys').innerHTML = 'Touch: ◀ ▶ steer (gas is automatic) · 💥 fire (auto-aims ahead) · 🔥 nitro · STOP = brake';
}
$('bPlay').onclick = () => { auInit(); goStages(); };
$('bSnd').onclick = () => { auInit(); SAVE.sound = !SAVE.sound; saveNow(); auMute(); buildTitle(); };
$('bBack').onclick = goTitle;
$('bPause').onclick = () => togglePause();
$('bResume').onclick = () => togglePause(false);
$('bRestart').onclick = () => startRace(G.idx);
$('bQuit').onclick = goStages;
$('bNext').onclick = () => startRace(Math.min(STAGES.length - 1, G.idx + 1));
$('bRetry').onclick = () => startRace(G.idx);
$('bMenu').onclick = goStages;

/* ================= loop ================= */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  const g = G;
  if (g && !g.paused && !(g.over && !g.demo)) {
    const total = dt * g.ts, n = Math.max(1, Math.ceil(total / (1 / 45))), step = total / n;
    for (let i = 0; i < n; i++) if (G === g) update(step);
  }
  if (G) { draw(); if (appState === 'race') hudUpdate(); }
  /* engine sound */
  if (AU.c && AU.eng) { const gg = G; const run = gg && appState === 'race' && !gg.paused && gg.pl.dead <= 0 && gg.state !== 'done'; const sp = run ? gg.pl.speed : 0; AU.eng.frequency.value = 52 + sp * .27 + (input.nit && gg && gg.pl.nit > 0 ? 25 : 0); AU.engG.gain.value = run ? .018 + sp / 430 * .02 : 0; }
  requestAnimationFrame(frame);
}

window.__rf = {
  get G() { return G; }, input, SAVE, start: startRace, pause: togglePause,
  ts: v => { if (G) G.ts = v; }, auto: v => { if (G) G.auto = v; }, god: v => { if (G) G.god = v; },
  tp: s => { const p = G.pl, c = trackAt(G.T, s, {}); p.x = c.x; p.y = c.y; p.a = c.a; p.gunA = c.a; p.vx = Math.cos(c.a) * 200; p.vy = Math.sin(c.a) * 200; p.i = nearest(G.T, p.x, p.y, 0, true).i; p.s = s; G.cam.x = p.x; G.cam.y = p.y; },
  titles: goTitle, stages: goStages
};
resize(); buildTitle(); startStage(0, { demo: true }); hudOn(false); appState = 'title'; showOnly('scrTitle');
requestAnimationFrame(frame);


</script>
</body></html>

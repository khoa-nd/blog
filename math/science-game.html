<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Science Island · Grade 2 Memory Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b3a;--soft:#5d7186;--bg:#e8f5ff;--card:#fff;--line:#d3e2ef;--green:#38b24d;--blue:#2e8bff;--orange:#ff9f1c;--red:#ff5a5f;--purple:#8e5bff;--teal:#19b3b3;--pink:#ff7aa8;--c:#38b24d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfeaff;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
h1,h2,h3,.fr{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#bfe6ff,#e9f7ff 60%,#f4fbff)}
#top{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top);background:#fff;border-bottom:3px solid var(--line)}
#top .ttl{font-family:Fredoka;font-weight:600;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;background:#eef6fd;border:2px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.ib:active{transform:scale(.94)}
.chip{padding:4px 12px;border-radius:99px;background:#fff6dc;border:2px solid #ffd978;font-family:Fredoka;font-weight:600;font-size:16px;white-space:nowrap}
#stage{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#tip{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:3px solid var(--line);min-height:64px}
#tip svg{width:52px;height:52px;flex:none}
#say{flex:1;font-size:15px;line-height:1.3;background:#f2f9ff;border:2px solid var(--line);border-radius:14px;padding:7px 12px;position:relative}
#say.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:16px;background:var(--c);color:#fff;font-family:Fredoka;font-weight:600;font-size:19px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 14px;font-size:16px;border-radius:12px}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 22px}
.card{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 rgba(31,77,120,.07)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{justify-content:center;text-align:center}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:14px;height:14px;border-radius:50%;background:#dbe7f2;border:2px solid #c3d3e3}
.pip.on{background:var(--c);border-color:var(--c)}.pip.cur{background:#fff;border-color:var(--c);transform:scale(1.25)}
.labbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);color:#fff}
.labbar h2{font-size:22px;flex:1}
.labbar .pips .pip{background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.6)}
.labbar .pips .pip.on{background:#fff;border-color:#fff}.labbar .pips .pip.cur{background:transparent;border-color:#fff}
/* hub */
.hub{position:relative;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:16/11;min-height:430px}
.hub svg.bg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;transition:transform .15s}
.node:hover{transform:translate(-50%,-50%) scale(1.08)}
.node .dot{width:68px;height:68px;border-radius:50%;background:var(--c);border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:34px;animation:bob 3s ease-in-out infinite}
.node:nth-child(odd) .dot{animation-delay:-1.2s}
.node .nm{font-family:Fredoka;font-weight:600;font-size:14px;line-height:1.05;background:#fff;border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.12);text-align:center}
.node .st{font-size:15px;letter-spacing:1px;color:#ffb300;text-shadow:0 1px 0 #fff;min-height:19px}
.node .st i{font-style:normal;color:#c9d6e3}
@keyframes bob{50%{transform:translateY(-5px)}}
.hubfoot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 12px 16px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px 14px}
.bdg{width:42px;height:42px;border-radius:50%;background:#e6eef6;display:flex;align-items:center;justify-content:center;font-size:22px;filter:grayscale(1);opacity:.5;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.bdg.on{filter:none;opacity:1;background:#fff3c4}
/* questions */
.q{font-family:Fredoka;font-weight:600;font-size:clamp(19px,3.4vw,26px);line-height:1.25;margin:4px 0 10px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{padding:14px 14px;border-radius:16px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:17px;text-align:left;line-height:1.25;display:flex;gap:10px;align-items:center}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.good{background:#dff7e3;border-color:var(--green);box-shadow:0 5px 0 #98d9a3}
.opt.bad{background:#ffe2e3;border-color:var(--red);box-shadow:0 5px 0 #f3a9ab;animation:shake .4s}
.opt.off{opacity:.35;pointer-events:none}.opt.sel{background:#e5f1ff;border-color:var(--blue);box-shadow:0 5px 0 #a4c8f5}
.opt .em{font-size:30px;flex:none}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:12px;border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.35;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.ok{background:#dff7e3;border:3px solid var(--green)}.fb.no{background:#fff0d6;border:3px solid var(--orange)}
.vis{display:flex;justify-content:center;margin:6px 0 10px}
.vis svg{max-width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.wc{padding:8px 14px;border-radius:12px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;user-select:none;touch-action:none}
.wc.sel{border-color:var(--blue);background:#e5f1ff}.wc.used{opacity:.3;pointer-events:none}
.gap{display:inline-block;min-width:90px;border-bottom:4px dashed #9db4c9;text-align:center;padding:0 6px;margin:0 3px;color:var(--c);cursor:pointer}
.gap.ok{border-bottom-color:var(--green);color:#1f8a35}.gap.no{border-bottom-color:var(--red);color:var(--red)}
.dragging{opacity:.92;transform:rotate(-4deg) scale(1.06);box-shadow:0 10px 18px rgba(0,0,0,.25)!important}
.lift{opacity:.35}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;margin-bottom:10px}
.bin{border:4px dashed var(--bc);border-radius:18px;background:color-mix(in srgb,var(--bc) 12%,#fff);min-height:120px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,background .12s}
.bin.over{transform:scale(1.03);background:color-mix(in srgb,var(--bc) 30%,#fff)}
.bin h3{font-size:16px;text-align:center;color:var(--bc);display:flex;gap:6px;justify-content:center;align-items:center}
.bin .stack{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.it{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 10px;border-radius:14px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:14px;min-width:84px;text-align:center;user-select:none;touch-action:none;cursor:grab;line-height:1.1}
.it .e{font-size:34px;line-height:1.1}
.it.sel{border-color:var(--blue);background:#e5f1ff}
.it.good{border-color:var(--green);background:#e5fae9}.it.bad{animation:shake .4s;border-color:var(--red)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px;border-radius:16px;background:#f1f7fc;min-height:80px;position:relative}
.belt{height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,#9aa8b6 0 14px,#7f8da0 14px 28px);animation:belt 1s linear infinite;margin-top:-8px}
@keyframes belt{to{background-position:28px 0}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:9px 16px;border-radius:14px;background:#fff;border:3px solid var(--line);font-family:Fredoka;font-weight:600;font-size:17px;box-shadow:0 4px 0 var(--line)}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.scene{background:linear-gradient(#cdeeff,#eef9ff);border:3px solid var(--line);border-radius:22px;overflow:hidden;position:relative}
.scene svg,.scene canvas{display:block;width:100%;height:auto}
.note{background:#fffbe8;border:3px solid #ffe08a;border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.35}
.trick{background:linear-gradient(135deg,#fff7d6,#ffeaa8);border:3px solid #ffcf56;border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.35}
.trick b.k{font-family:Fredoka;letter-spacing:.06em}
.hot{cursor:pointer}
.hot .ring{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:6 6;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.slider{width:100%;accent-color:var(--c);height:28px}
.lbl{font-family:Fredoka;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.node{width:84px}.node .dot{width:52px;height:52px;font-size:26px}.node .nm{font-size:12px;padding:1px 6px}.hub{min-height:760px;aspect-ratio:auto;height:760px}}
.ovl{position:fixed;inset:0;background:rgba(20,40,70,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ovl .card{max-width:520px;width:100%;text-align:center;animation:pop .4s}
.stars{font-size:54px;letter-spacing:6px;color:#ffb300;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.stars i{font-style:normal;color:#d5dfe9}
.stars span{display:inline-block;animation:starIn .6s both}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
.fc{perspective:900px;width:min(92vw,460px);height:260px;margin:0 auto;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:4px solid var(--c);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.1)}
.fc .b{transform:rotateY(180deg);background:#f5fff6}
.fc .em{font-size:64px;line-height:1}
.fc .t{font-family:Fredoka;font-size:24px;line-height:1.2}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1d2b3a;color:#fff;padding:8px 16px;border-radius:99px;font-family:Fredoka;z-index:70;animation:toast 2s both}
@keyframes toast{0%{opacity:0;top:50px}10%,80%{opacity:1;top:70px}100%{opacity:0}}
.hz{position:absolute;transform:translate(-50%,-50%);font-size:clamp(28px,6vw,48px);line-height:1;cursor:pointer;user-select:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2));transition:transform .15s}
.hz:hover{transform:translate(-50%,-50%) scale(1.12)}
.hz.found{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 8px #ff5a5f)}
.hz .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-family:Fredoka;font-size:13px;background:#fff;color:#c33;border:2px solid #ff5a5f;border-radius:8px;padding:0 6px;margin-top:2px}
.hz.safe .tag{color:#1f8a35;border-color:var(--green)}
</style></head><body>
<div id="app">
  <div id="top"><button class="ib" id="bHome" title="Home">🏝️</button><div class="ttl" id="ttl">Science Island</div><div class="chip" id="chStars">⭐ 0</div><button class="ib" id="bSnd" title="Sound">🔊</button></div>
  <div id="stage"></div>
  <div id="tip"><div id="mas"></div><div id="say">Hi! I'm Sprout. Pick a lab and let's learn by playing!</div></div>
</div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const e = document.createElement(tag);
  if (a) for (const [x, v] of Object.entries(a)) {

const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const lerp = (a, b, t) => a + (b - a) * t;
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- cleanup of running scenes ---------- */
let CLEAN = [];
const onLeave = f => CLEAN.push(f);
function leave() { CLEAN.forEach(f => { try { f(); } catch (e) { } }); CLEAN = []; $$('.dragging').forEach(g => g.parentNode && g.parentNode.removeChild(g)); }
function loop(fn) { // rAF loop that stops when leaving the scene

  const t = now => { if (!on) return; const dt = Math.min(.05, (now - last) / 1000); last = now; fn(dt, now / 1000); requestAnimationFrame(t); };
  requestAnimationFrame(t); const stop = () => on = false; onLeave(stop); return stop;
}

/* ---------- save ---------- */
let SAVE = { stars: {}, miss: {}, cards: {}, plays: 0 };
try { const s = JSON.parse(localStorage.getItem('sciisland-save')); if (s) SAVE = Object.assign(SAVE, s); } catch (e) { }
const save = () => { try { localStorage.setItem('sciisland-save', JSON.stringify(SAVE)); } catch (e) { } };
const totalStars = () => Object.values(SAVE.stars).reduce((a, b) => a + b, 0);

/* ---------- audio ---------- */
let AC = null, MUTE = false; try { MUTE = localStorage.getItem('sciisland-mute') === '1'; } catch (e) { }
function tone(f, t, d, type = 'sine', v = .15, slide) {
  if (MUTE) return; try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, AC.currentTime + t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + t + d);
    g.gain.setValueAtTime(0, AC.currentTime + t); g.gain.linearRampToValueAtTime(v, AC.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t + d);
    o.connect(g).connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + d + .05);
  } catch (e) { }
}
function sfx(n) {
  if (n === 'ok') { tone(660, 0, .12, 'triangle'); tone(880, .1, .2, 'triangle'); }
  else if (n === 'bad') { tone(220, 0, .25, 'sawtooth', .08, 140); }
  else if (n === 'pop') tone(500, 0, .08, 'sine', .12, 900);
  else if (n === 'star') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .25, 'triangle', .13)); }
  else if (n === 'splash') { tone(300, 0, .2, 'sine', .08, 120); tone(200, .05, .25, 'sine', .06, 90); }
  else if (n === 'whoosh') tone(200, 0, .3, 'sine', .06, 800);
  else if (n === 'tick') tone(900, 0, .04, 'square', .05);
}
$('#bSnd').onclick = () => { MUTE = !MUTE; try { localStorage.setItem('sciisland-mute', MUTE ? '1' : '0'); } catch (e) { } $('#bSnd').textContent = MUTE ? '🔇' : '🔊'; if (!MUTE) sfx('pop'); };
$('#bSnd').textContent = MUTE ? '🔇' : '🔊';

/* ---------- mascot + tip bar ---------- */
$('#mas').innerHTML = `<svg viewBox="0 0 64 64"><g id="sp"><path d="M32 22 C32 12 26 8 18 8 C18 17 24 22 32 22Z" fill="#43c15a"/><path d="M32 22 C32 14 38 9 47 10 C46 19 40 23 32 22Z" fill="#2ea84a"/>
<path d="M14 30 H50 L45 58 H19 Z" fill="#e8895a"/><rect x="11" y="25" width="42" height="9" rx="4" fill="#f0a070"/>
<circle cx="25" cy="42" r="6.5" fill="#fff" stroke="#2b6fb8" stroke-width="2.5"/><circle cx="39" cy="42" r="6.5" fill="#fff" stroke="#2b6fb8" stroke-width="2.5"/><path d="M31.5 42H32.5" stroke="#2b6fb8" stroke-width="2.5"/>
<circle cx="25.5" cy="42.5" r="2.2" fill="#222"/><circle cx="38.5" cy="42.5" r="2.2" fill="#222"/><path d="M27 51 Q32 55 37 51" stroke="#7a3b1c" stroke-width="2" fill="none" stroke-linecap="round"/></g></svg>`;
function say(msg) { const s = $('#say'); s.innerHTML = msg; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
function toast(m) { const t = h('div', { class: 'toast' }, m); document.body.append(t); setTimeout(() => t.remove(), 2100); }

/* ---------- confetti ---------- */
function confetti(n = 70) {
  const c = h('canvas', { class: 'confetti' }); c.width = innerWidth; c.height = innerHeight; document.body.append(c); const g = c.getContext('2d');
  const P = Array.from({ length: n }, () => ({ x: rnd(0, c.width), y: rnd(-200, -10), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), r: rnd(4, 9), a: rnd(0, 6), c: pick(['#ff5a5f', '#ffb300', '#38b24d', '#2e8bff', '#8e5bff', '#ff7aa8']) }));
  let t = 0; (function f() { g.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; g.fillStyle = p.c; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }); if (++t < 140) requestAnimationFrame(f); else c.remove(); })();
}

/* ---------- drag or tap-to-place ---------- */
// items: elements; zones: elements; onDrop(zone, item) -> true if accepted
function DD(items, zones, onDrop) {
  let sel = null;
  const clear = () => { if (sel) sel.classList.remove('sel'); sel = null; };
  const zoneAt = (x, y) => { for (const el of document.elementsFromPoint(x, y)) { const z = el.closest && el.closest('[data-zone]'); if (z && zones.includes(z)) return z; } return null; };
  items.forEach(el => {
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', e => {
      if (el.dataset.lock) return; e.preventDefault();
      const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, sx = e.clientX, sy = e.clientY; let moved = false, g = null, over = null;
      const mv = ev => {
        if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;

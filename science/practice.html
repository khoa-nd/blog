<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprout's Science Lab · Grade 2 Practice</title>
<meta name="description" content="Grade 2 Science practice game: plants, living things, states of matter, mixtures and dissolving.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f5ea;--bg2:#cdeefb;--ink:#12372a;--ink2:#3d5f52;--card:#fff;--g:#3dbb6c;--gd:#25904f;--y:#ffd43b;--yd:#e0a800;--o:#ff8a3d;--b:#4dabf7;--bd:#2b86d4;--p:#9775fa;--r:#ff6b6b;--rd:#d94b4b;--pk:#f783ac;--sh:0 5px 0 rgba(18,55,42,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#e4f5ea}
html,body{margin:0;min-height:100%}
body{font-family:"Fredoka","Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 340px,var(--bg) 100%) fixed;font-size:18px;line-height:1.35;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.hide{display:none!important}
#app{max-width:1000px;margin:0 auto;padding:10px 14px 24px;position:relative}
h1,h2,h3{margin:0;font-weight:700}
h2{font-size:22px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
small,.sm{font-size:14px}
.vi{color:var(--ink2);font-size:.82em;display:block;margin-top:2px;font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:999px;border:3px solid var(--ink);background:var(--y);font-weight:700;font-size:20px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;position:relative;top:0}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.btn.g{background:var(--g);color:#fff}.btn.b{background:var(--b);color:#fff}.btn.w{background:#fff}.btn.r{background:var(--r);color:#fff}
.btn.sm{font-size:16px;padding:8px 16px;box-shadow:0 3px 0 var(--ink)}
.ib{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:22px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-weight:600;font-size:15px}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
#top .logo{font-weight:700;font-size:19px;display:flex;align-items:center;gap:6px;cursor:pointer}
#top .sp{flex:1}
#xpWrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1;max-width:340px}
#xpWrap .bar{flex:1;height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;position:relative}
#xpWrap .bar i{display:block;height:100%;background:linear-gradient(90deg,#4dd88a,#b7e34a);width:0;transition:width .6s}
#hudSprout{width:40px;flex:none;margin-bottom:-6px}
.stagename{font-size:13px;font-weight:600;white-space:nowrap}

/* cover */
#cover{text-align:center;padding:20px 8px}
#cover .title{font-size:clamp(34px,7vw,60px);line-height:1;margin:6px 0 4px;text-shadow:0 4px 0 #fff}
#cover .title span{color:var(--gd)}
#cover .csub{font-size:19px;color:var(--ink2);margin-bottom:12px}
#covSprout{width:min(300px,70vw);margin:0 auto;display:block;animation:bob 2.6s ease-in-out infinite}
.nameBox{display:inline-flex;flex-direction:column;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 18px;box-shadow:var(--sh);margin:8px 0 16px}
.nameBox input{font:inherit;font-size:22px;text-align:center;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;width:min(300px,70vw);background:#f6fffa;color:var(--ink);-webkit-user-select:text;user-select:text}
.covFoot{margin-top:18px;font-size:14px;color:var(--ink2)}
@keyframes bob{50%{transform:translateY(-10px) rotate(1.5deg)}}

/* home */
.hero{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:12px 16px;box-shadow:var(--sh);margin-top:8px}
.hero #heroSprout{width:110px;flex:none}
.hero .hi{font-size:26px;font-weight:700}
.hero .bar{height:22px;border:3px solid var(--ink);border-radius:99px;background:#f2fbf5;overflow:hidden;margin:6px 0 4px}
.hero .bar i{display:block;height:100%;background:linear-gradient(90deg,#4dd88a,#b7e34a);transition:width .6s}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lands{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.land{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:12px;text-align:center;box-shadow:var(--sh);position:relative;transition:transform .12s;overflow:hidden;min-height:170px;display:flex;flex-direction:column;align-items:center;gap:2px}
.land:hover{transform:translateY(-4px) rotate(-.6deg)}.land:active{transform:translateY(2px)}
.land .band{position:absolute;inset:0 0 auto 0;height:70px;background:var(--c);opacity:.28;border-radius:0 0 50% 50%/0 0 30px 30px}
.land .num{position:absolute;top:8px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:1}
.land .em{font-size:50px;line-height:1;margin-top:6px;position:relative;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.land b{font-size:19px;position:relative}
.land .tt{font-size:13px;color:var(--ink2);position:relative}
.land .st{font-size:22px;letter-spacing:2px;position:relative;margin-top:auto}
.land .st .off{filter:grayscale(1);opacity:.35}
.land .bossb{position:absolute;top:8px;right:10px;font-size:22px;z-index:1}
.land.next::after{content:"👆 Next!";position:absolute;bottom:40px;right:8px;font-size:13px;background:var(--y);border:2px solid var(--ink);border-radius:99px;padding:0 8px;animation:bounce 1s infinite;z-index:2}
@keyframes bounce{50%{transform:translateY(-5px)}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.act{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 8px;text-align:center;box-shadow:var(--sh);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.act:hover{transform:translateY(-3px)}.act:active{transform:translateY(2px)}
.act .em{font-size:34px}.act small{font-weight:500;color:var(--ink2);line-height:1.15}
.act.hot{background:#fff4c2}
.foot{text-align:center;color:var(--ink2);font-size:13px;margin-top:26px}

/* learn */
.sheet{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px;box-shadow:var(--sh)}
.sheetHead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheetHead .em{font-size:46px}
.facts{display:grid;gap:10px;margin:12px 0}
.fact{display:flex;gap:12px;align-items:flex-start;background:#f3fbf6;border:3px solid var(--ink);border-radius:18px;padding:10px 12px}
.fact .e{font-size:32px;flex:none;width:44px;text-align:center}
.fact div b{color:var(--gd)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* play */
.ptop{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
#pDots{flex:1;display:flex;gap:5px;flex-wrap:nowrap}
#pDots i{flex:1;height:14px;border-radius:99px;border:3px solid var(--ink);background:#fff;min-width:8px;transition:background .3s}
#pDots i.ok{background:var(--g)}#pDots i.no{background:var(--r)}#pDots i.cur{background:var(--y);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scaleY(1.4)}}
#pHearts{font-size:22px;white-space:nowrap}
#boss{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#ffe3e3,#fff);border:3px solid var(--ink);border-radius:22px;padding:8px 14px;margin-bottom:12px;box-shadow:var(--sh)}
#bossFace{font-size:54px;line-height:1;transition:transform .2s}
#bossFace.hit{animation:shake .5s}
#boss .hp{height:20px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:4px}
#boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffa94d);transition:width .5s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-6deg)}50%{transform:translateX(10px) rotate(6deg)}80%{transform:translateX(-6px)}}
#qcard{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px 18px 18px;box-shadow:var(--sh);position:relative;min-height:200px}
#qTag{font-size:14px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
#qTag .t{background:var(--c,var(--g));color:#fff;border-radius:99px;padding:1px 10px;border:2px solid var(--ink)}
#qStem{font-size:23px;font-weight:600;line-height:1.28;display:flex;gap:10px;align-items:flex-start}
#qStem .sq{flex:1}
#qStem .spk{flex:none;font-size:20px;width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);background:#e9f7ff;display:flex;align-items:center;justify-content:center}
#qStem b{color:var(--bd)}
#qFig{margin:10px 0 4px;text-align:center}
#qFig svg{max-width:100%;height:auto;max-height:300px}
#qBody{margin-top:10px}
#coach{display:flex;gap:10px;align-items:flex-end;margin:14px 0 0;min-height:76px;scroll-margin-bottom:100px}
#coachFace{width:70px;flex:none}
#coachBubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-size:17px;flex:1;box-shadow:0 4px 0 rgba(18,55,42,.15)}
#coachBubble::before{content:"";position:absolute;left:-12px;bottom:16px;width:18px;height:18px;background:inherit;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
#coachBubble.ok{background:#e1f8e9}#coachBubble.no{background:#ffe8e8}#coachBubble.hint{background:#fff6cf}
#coachBubble .vi{margin-top:4px}
.pbar{position:sticky;bottom:0;margin:12px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#e4f5ea 75%,rgba(228,245,234,0));display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.pbar .in{max-width:1000px;width:100%;display:flex;gap:10px;align-items:center}
.pbar .grow{flex:1}
#bHint small{opacity:.8}
.cardf{margin-left:4px}

/* answer widgets */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c1{grid-template-columns:1fr}
.opt{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;font-size:19px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(18,55,42,.25);transition:transform .08s,background .15s;min-height:56px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:#eef7ff;font-size:15px;display:flex;align-items:center;justify-content:center}
.opt .oe{font-size:30px;flex:none}
.opt:hover{background:#f4fff8}.opt:active{transform:translateY(3px)}
.opt.sel{background:#fff6cf;border-color:var(--ink);box-shadow:0 4px 0 var(--yd);transform:translateY(-2px)}
.opt.sel .k{background:var(--y)}
.opt.ok{background:#c9f5d9;animation:pop .4s}.opt.no{background:#ffd5d5;animation:shake .4s}
.opt.gone{opacity:.28;text-decoration:line-through;pointer-events:none}
.opt.show{outline:4px dashed var(--g);outline-offset:2px}
.opt.tf{justify-content:center;font-size:24px;padding:16px}
@keyframes pop{40%{transform:scale(1.07)}}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px;padding:10px;background:#f3fbf6;border:3px dashed var(--ink2);border-radius:18px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-size:18px;font-weight:600;box-shadow:0 3px 0 rgba(18,55,42,.25);touch-action:none;cursor:grab;position:relative}
.chip .ce{font-size:26px}
.chip.sel{background:#fff6cf;box-shadow:0 3px 0 var(--yd);transform:translateY(-3px)}
.chip.ok{background:#c9f5d9}.chip.no{background:#ffd5d5}
.chip.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:scale(1.1) rotate(-3deg);box-shadow:0 10px 18px rgba(0,0,0,.3)}
.chip.used{opacity:.3;pointer-events:none}
.bins{display:grid;gap:12px}
.bins.n2{grid-template-columns:repeat(2,1fr)}.bins.n3{grid-template-columns:repeat(3,1fr)}
.bin{border:3px solid var(--ink);border-radius:20px;background:var(--bc,#e8f5ff);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.bin.over,.bin.ready{box-shadow:0 0 0 5px var(--y);transform:scale(1.02)}
.bin h4{margin:0;text-align:center;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;flex:1}
.bin .chip{font-size:15px;padding:4px 9px;box-shadow:0 2px 0 rgba(18,55,42,.25)}.bin .chip .ce{font-size:20px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;position:relative}
.pairs .col{display:grid;gap:10px;align-content:start}
.pr{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px 12px;font-weight:600;font-size:18px;box-shadow:0 3px 0 rgba(18,55,42,.25);display:flex;align-items:center;gap:8px;min-height:52px;position:relative}
.pr.sel{background:#fff6cf;transform:scale(1.03)}
.pr.p0{background:#ffe0e0}.pr.p1{background:#dff0ff}.pr.p2{background:#e5ffe0}.pr.p3{background:#f3e5ff}.pr.p4{background:#fff0d0}
.pr .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff;margin-left:auto;flex:none}
.pr.ok{outline:4px solid var(--g)}.pr.no{outline:4px solid var(--r)}
.sent{font-size:23px;line-height:2.1;font-weight:500}
.gap{display:inline-block;min-width:96px;height:42px;line-height:36px;border:3px dashed var(--ink2);border-radius:12px;background:#f3fbf6;text-align:center;vertical-align:middle;padding:0 8px;margin:0 4px;font-weight:700;color:var(--bd);cursor:pointer}
.gap.fill{border-style:solid;border-color:var(--ink);background:#fff6cf}
.gap.ok{background:#c9f5d9}.gap.no{background:#ffd5d5}.gap.ready{box-shadow:0 0 0 4px var(--y)}
.tfs{display:grid;gap:10px}
.tfrow{display:flex;gap:10px;align-items:center;background:#f6fffa;border:3px solid var(--ink);border-radius:16px;padding:8px 10px}
.tfrow .tx{flex:1;font-size:18px;font-weight:600}
.tfrow .tb{display:flex;gap:6px}
.tfrow button{border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:700;background:#fff;box-shadow:0 3px 0 rgba(18,55,42,.25)}
.tfrow button.sel{background:var(--y)}
.tfrow.ok{background:#d4f7e0}.tfrow.no{background:#ffdede}
.tfrow .mk{font-size:22px;width:26px;text-align:center}
.ordr{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ordr .chip{flex-direction:column;padding:10px 14px;min-width:120px;text-align:center}
.ordr .chip .ce{font-size:42px}
.ordr .chip .no_{position:absolute;top:-10px;left:-10px;width:30px;height:30px;border-radius:50%;background:var(--y);border:3px solid var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center}
.stagebox{position:relative;border:3px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden}
.stagebox svg{display:block;width:100%;height:auto}
.hs{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px dashed var(--ink);background:rgba(255,255,255,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;text-align:center;line-height:1;transition:transform .1s}
.hs.ready{box-shadow:0 0 0 5px var(--y);transform:scale(1.1)}
.hs.fill{border-style:solid;background:#fff6cf;width:auto;min-width:70px;height:34px;border-radius:12px;padding:0 8px;margin:-17px 0 0 -35px}
.hs.ok{background:#c9f5d9}.hs.no{background:#ffd5d5}
.hz{position:absolute;transform:translate(-50%,-50%);font-size:clamp(30px,6.5vw,52px);cursor:pointer;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2));transition:transform .15s}
.hz:hover{transform:translate(-50%,-50%) scale(1.12)}
.hz.found::after{content:"⚠️";position:absolute;right:-12px;top:-14px;font-size:22px}
.hz.found{filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 8px #ff4d4d)}
.hz.safe{animation:shake .4s}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tool{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(18,55,42,.25)}
.tool .te{font-size:30px}
.tool:active{transform:translateY(3px)}.tool.sel{background:#fff6cf}
.tool:disabled{opacity:.5}
.sim{position:relative;border:3px solid var(--ink);border-radius:20px;background:linear-gradient(#f4fbff,#e3f3ff);overflow:hidden;height:210px}
.bit{position:absolute;font-size:30px;transition:all .8s ease;line-height:1}
.simtxt{text-align:center;font-weight:600;min-height:30px;margin-top:8px}
.glassWrap{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.glassWrap svg{width:200px;height:auto;flex:none}
.shelf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sub{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(18,55,42,.25);font-size:17px}
.sub .se{font-size:26px}
.sub.done{background:#eaf7ff}
.sub .rs{font-size:13px;font-weight:700;padding:0 6px;border-radius:8px;background:var(--y)}
.sub .rs.s{background:#b8f0cb}.sub .rs.i{background:#ffd0b0}
.cht{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin-top:4px}
.chcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.chcol .stp{display:flex;gap:4px}
.chcol .stp button{width:36px;height:34px;border-radius:10px;border:3px solid var(--ink);background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(18,55,42,.25)}
.chcol.ok b{color:var(--gd)}.chcol.no b{color:var(--rd)}

/* cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fc{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:10px;text-align:center;box-shadow:var(--sh);position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fc .band{position:absolute;inset:0 0 auto 0;height:58px;background:var(--c);opacity:.35}
.fc .em{font-size:44px;position:relative;margin-top:4px}
.fc b{font-size:15px;position:relative;line-height:1.1}
.fc.lock{background:#e7efe9}.fc.lock .em{filter:grayscale(1) brightness(.5);opacity:.5}
.fc.lock b{color:var(--ink2)}
.bigcard{max-width:380px;margin:0 auto;text-align:center;padding:20px 18px}
.bigcard .em{font-size:90px;line-height:1}
.bigcard h3{font-size:30px;margin:6px 0}
.bigcard .df{font-size:19px;font-weight:600}
.bigcard .exm{background:#f3fbf6;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin-top:10px;font-size:16px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center;background:#fff;box-shadow:var(--sh);font-size:14px}
.bdg .em{font-size:40px}.bdg b{display:block;font-size:15px}
.bdg.lock{background:#e7efe9;opacity:.7}.bdg.lock .em{filter:grayscale(1)}
.rep{display:grid;gap:8px;margin-top:8px}
.rep .rw{display:flex;align-items:center;gap:10px;background:#f6fffa;border:3px solid var(--ink);border-radius:14px;padding:6px 10px}
.rep .rw .nm{flex:1;font-weight:600;font-size:16px}
.rep .rw .mt{width:110px;height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}

let DT=0;const recentDrag=()=>performance.now()-DT<120;
function dragify(el,onTap,onDrop,isLocked){
  el.addEventListener('pointerdown',e=>{
    if(isLocked&&isLocked())return;const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false,over=null;
    const tgt=(x,y)=>{const els=document.elementsFromPoint(x,y);for(const t of els){const d=t.closest&&t.closest('[data-drop]');if(d)return d}return null};
    const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){moved=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.opacity='';document.body.appendChild(ghost);el.style.opacity='.3'}
      if(moved){ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px';const t=tgt(ev.clientX,ev.clientY);if(over&&over!==t)over.classList.remove('over');over=t;if(t)t.classList.add('over')}};
    const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointercancel',up);if(over)over.classList.remove('over');DT=performance.now();
      if(moved){ghost.remove();el.style.opacity='';const t=tgt(ev.clientX,ev.clientY);if(t){const dv=t.getAttribute('data-drop');setTimeout(()=>onDrop(dv),0)}}else setTimeout(onTap,0)};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up,{once:true});window.addEventListener('pointercancel',up,{once:true});
  });
}

  sh.innerHTML=subs.map(s=>`<button class="sub" data-k="${s.k}"><span class="se">${s.e}</span>${cap1(s.n)}<span class="rs hide"></span></button>`).join('');
  let raf=0,gen=0;const tested=new Set();
  const stop=()=>{cancelAnimationFrame(raf);gen++};STOPS.push(stop);
  function test(s){
    stop();const my=gen;G.innerHTML='';W.setAttribute('fill','#9fdcff');SP.setAttribute('x',100);SP.setAttribute('y',34);SK.setAttribute('opacity',0);
    const N=s.k==='pebbles'?7:s.k==='clip'?6:s.k==='beads'?8:16,gr=[];
    for(let i=0;i<N;i++){let el;
      if(s.k==='clip')el=mk('rect',{width:12,height:3.5,rx:1.5,fill:'#9aa7b3',stroke:'#5b6772','stroke-width':1},G);
      else if(s.k==='rice')el=mk('ellipse',{rx:4.5,ry:2.4,fill:'#fffdf2',stroke:'#b9b49a','stroke-width':1},G);
      else if(s.k==='pebbles')el=mk('circle',{r:6+rnd()*3,fill:'#9a9a9a',stroke:'#555','stroke-width':1.5},G);
      else if(s.k==='beads')el=mk('circle',{r:4.5,fill:'#5c7cfa',stroke:'#2b4acb','stroke-width':1},G);
      else if(s.k==='sand')el=mk('circle',{r:2.4+rnd()*1.2,fill:'#dfb76f'},G);
      else if(s.k==='coffee')el=mk('circle',{r:2.4+rnd()*1.2,fill:'#6b4423'},G);
      else el=mk('rect',{width:5,height:5,rx:1,fill:s.k==='sugar'?'#ffffff':'#f4f4f4',stroke:'#9aa7b3','stroke-width':1},G);
      const big=s.k==='pebbles'?7:3,fx=64+rnd()*70,fy=198-rnd()*(s.k==='pebbles'?10:14)-(i%3)*(s.k==='pebbles'?4:2);
      gr.push({el,x0:76+rnd()*48,fx,fy,ph:rnd()*6.28,big,k:s.k});
    }
    const t0=performance.now(),dur=3300;
    tx.innerHTML=`${s.e} Dropping <b>${s.n}</b> into the water…`;
    function frame(now){if(my!==gen)return;const t=now-t0;
      const fall=Math.min(1,t/900),stir=Math.max(0,Math.min(1,(t-1000)/1900));
      const swirl=t>1000&&t<2900;
      gr.forEach(g=>{
        let x,y,op=1,sc=1;
        const e=1-Math.pow(1-fall,2);
        x=g.x0+(g.fx-g.x0)*e;y=20+(g.fy-20)*e;
        if(swirl){const a=g.ph+stir*14;const amp=(s.s?26:16)*Math.sin(Math.PI*stir)*1;x=g.fx+Math.cos(a)*amp*.9;y=g.fy-Math.abs(Math.sin(a*.8+g.ph))*(s.s?60:34)*Math.sin(Math.PI*stir)}
        if(s.s){op=1-Math.max(0,(stir-.25)/.7);sc=Math.max(0,1-stir*.9)}
        if(t>=2900&&s.s){op=0}
        const el=g.el,tag=el.tagName;
        if(tag==='circle'){el.setAttribute('cx',x);el.setAttribute('cy',y)}
        else if(tag==='ellipse'){el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('transform',`rotate(${g.ph*30} ${x} ${y})`)}
        else{el.setAttribute('x',x-3);el.setAttribute('y',y-2);el.setAttribute('transform',`rotate(${g.ph*40} ${x} ${y})`)}
        el.setAttribute('opacity',op);if(s.s&&tag==='circle')el.setAttribute('r',(2+g.big*.4)*sc+.01)
      });
      if(t>1000){const w=(t-1000)/180;const r=t<2900?1:0;SP.setAttribute('x',100+Math.cos(w)*26*r);SP.setAttribute('y',(t<2900?120:34)+Math.sin(w)*8*r);if(t>=2900)SP.setAttribute('y',34+(Math.max(0,3300-t)<400?0:0))}
      if(s.k==='coffee'&&stir>0){W.setAttribute('fill',`rgb(${Math.round(159-stir*14)},${Math.round(220-stir*125)},${Math.round(255-stir*185)})`)}
      if(s.s&&stir>.6){SK.setAttribute('opacity',.9*Math.abs(Math.sin(t/160)));SK.setAttribute('x',70+Math.abs(Math.sin(t/230))*60)}
      if(t<dur)raf=requestAnimationFrame(frame);else finish();
    }
    function finish(){SK.setAttribute('opacity',0);tested.add(s.k);
      const b=sh.querySelector(`[data-k="${s.k}"]`);b.classList.add('done');const r=b.querySelector('.rs');r.classList.remove('hide');r.classList.add(s.s?'s':'i');r.textContent=s.s?'soluble':'insoluble';
      tx.innerHTML=s.s?`${s.e} <b>${cap1(s.n)} dissolved!</b><br>The grains seem to disappear — but they are still in the water. So it is <b>soluble</b>.${s.k==='coffee'?'<br>See how the water turned brown?':''}`:`${s.e} <b>${cap1(s.n)} did NOT dissolve.</b><br>You can still see it at the bottom. So it is <b>insoluble</b>.`;
      sfx(s.s?'ok':'pop')}
    raf=requestAnimationFrame(frame);
  }
  sh.querySelectorAll('.sub').forEach(b=>b.onclick=()=>{sfx('click');test(SBY[b.dataset.k])});
  return{tested};
}

/* --- matter playground (canvas particles) --- */
function matterToy(host){
  host.innerHTML=`<div class="toolbar" id="mtS"><button class="tool sel" data-s="S"><span class="te">🧊</span>Solid</button><button class="tool" data-s="L"><span class="te">💧</span>Liquid</button><button class="tool" data-s="G"><span class="te">🎈</span>Gas</button></div><canvas id="mtC" width="380" height="240" style="width:100%;max-width:440px;border:3px solid ${INK};border-radius:18px;background:#f4fbff;display:block;margin:auto"></canvas><div class="toolbar" id="mtK"><button class="tool sel" data-c="wide">▭ Wide box</button><button class="tool" data-c="tall">▯ Tall box</button><button class="tool" data-c="jar">⬜ Jar</button></div><div class="simtxt" id="mtT" style="min-height:64px"></div>`;
  const cv=host.querySelector('#mtC'),cx=cv.getContext('2d'),tx=host.querySelector('#mtT');
  const SH={wide:{x:20,y:70,w:340,h:150},tall:{x:140,y:12,w:100,h:210},jar:{x:90,y:50,w:200,h:170}};
  let st='S',sh='wide',alive=true,last=performance.now(),rehome=0;
  const N=72,r=4,P=[];for(let i=0;i<N;i++)P.push({x:100+rnd()*180,y:100+rnd()*100,vx:(rnd()-.5)*100,vy:(rnd()-.5)*100,hx:0,hy:0});
  const TXT={S:['<b>Solid:</b> the particles are packed tightly and only wiggle. A solid <b>keeps its own shape</b>, whatever box it is in.'],L:['<b>Liquid:</b> the particles slide past each other. A liquid <b>flows</b> and <b>takes the shape of its container</b>.'],G:['<b>Gas:</b> the particles zoom about. A gas <b>spreads out to fill the whole container</b>.']};
  const upT=()=>{tx.innerHTML=TXT[st][0]};upT();
  function homes(all){const c=SH[sh],bot=c.y+c.h,lh=Math.min(c.h-8,7600/c.w),top=bot-lh;
    P.forEach((p,i)=>{if(st==='S'){const cols=12,sp=2*r+1.2,bw=cols*sp;p.hx=c.x+c.w/2-bw/2+(i%cols)*sp+sp/2;p.hy=bot-r-2-Math.floor(i/cols)*sp}
      else if(st==='L'&&(all||rnd()<.12)){p.hx=c.x+r+rnd()*(c.w-2*r);p.hy=top+r+rnd()*(lh-2*r)}})}
  host.querySelectorAll('#mtS .tool').forEach(b=>b.onclick=()=>{st=b.dataset.s;host.querySelectorAll('#mtS .tool').forEach(x=>x.classList.toggle('sel',x===b));sfx('pop');upT();homes(true)});
  host.querySelectorAll('#mtK .tool').forEach(b=>b.onclick=()=>{sh=b.dataset.c;host.querySelectorAll('#mtK .tool').forEach(x=>x.classList.toggle('sel',x===b));sfx('pop');homes(true)});
  homes(true);
  function frame(now){if(!alive||!document.body.contains(cv))return;const dt=Math.min(.033,(now-last)/1000);last=now;const c=SH[sh],bot=c.y+c.h;
    const lh=Math.min(c.h-8,7600/c.w),top=bot-lh;rehome+=dt;if(st==='L'&&rehome>.25){rehome=0;homes(false)}
    P.forEach(p=>{
      if(st==='G'){p.x+=p.vx*dt;p.y+=p.vy*dt;const sp=Math.hypot(p.vx,p.vy);if(sp<70){p.vx*=1.4;p.vy*=1.4}if(sp>170){p.vx*=.85;p.vy*=.85}}
      else{const k=st==='S'?90:9,nz=st==='S'?160:420,dm=st==='S'?.82:.9;p.vx+=((p.hx-p.x)*k+(rnd()-.5)*nz)*dt;p.vy+=((p.hy-p.y)*k+(rnd()-.5)*nz)*dt;p.vx*=dm;p.vy*=dm;p.x+=p.vx*dt*6;p.y+=p.vy*dt*6}
      if(p.x<c.x+r){p.x=c.x+r;p.vx=Math.abs(p.vx)}if(p.x>c.x+c.w-r){p.x=c.x+c.w-r;p.vx=-Math.abs(p.vx)}
      if(p.y<c.y+r){p.y=c.y+r;p.vy=Math.abs(p.vy)}if(p.y>bot-r){p.y=bot-r;p.vy=-Math.abs(p.vy)}
    });
    cx.clearRect(0,0,380,240);cx.fillStyle='#fff';cx.fillRect(c.x,c.y,c.w,c.h);
    if(st==='L'){cx.fillStyle='rgba(60,160,255,.2)';cx.fillRect(c.x,top,c.w,lh)}
    P.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.fillStyle=st==='S'?'#6ec1ff':st==='L'?'#3b9cff':'#b197fc';cx.fill();cx.lineWidth=1.2;cx.strokeStyle=INK;cx.stroke()});
    cx.lineWidth=5;cx.strokeStyle=INK;cx.strokeRect(c.x,c.y,c.w,c.h);
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);STOPS.push(()=>{alive=false});
}

/* =====================  QUEST / EXAM FLOW  ===================== */
let Q=null,lastAct=Date.now();
const wsample=(w,n)=>{const idx=w.map((_,i)=>i),out=[];while(out.length<n&&idx.length){const tot=idx.reduce((a,i)=>a+w[i],0);let r=rnd()*tot,k=0;for(;k<idx.length-1;k++){r-=w[idx[k]];if(r<=0)break}out.push(idx.splice(k,1)[0])}return out};
function newQ(mode,o){Q=Object.assign({mode,queue:[],i:0,phase:'norm',slots:[],hearts:3,hp:3,res:[],wrong:[],newCards:[],xp:0,combo:0,bossUsed:[],stage0:stageOf(S.xp),title:''},o);Q.slots=Q.queue.map(()=>'');S.played++;save();show('play');nextQuestion()}
function startQuest(id){const pool=QF[id],w=pool.map((f,i)=>{const s=S.seen[id+'-'+i];return s?(s.bad>s.ok?3:1):2.2}),idx=wsample(w,7);newQ('quest',{land:id,title:LBY[id].n,queue:idx.map(i=>({fk:id+'-'+i,gen:pool[i]}))})}
function startExam(){newQ('exam',{title:"Teacher's Test",queue:EXAM.map((g,i)=>({fk:'E-'+i,gen:g}))})}
function startMock(){const q=[];LANDS.forEach(l=>sample(QF[l.id].map((g,i)=>i),3).forEach(i=>q.push({fk:l.id+'-'+i,gen:QF[l.id][i]})));const extra=[];while(extra.length<2){const l=pick(LANDS),i=Math.floor(rnd()*QF[l.id].length);if(!q.concat(extra).some(e=>e.fk===l.id+'-'+i))extra.push({fk:l.id+'-'+i,gen:QF[l.id][i]})}newQ('mock',{title:'Mock Exam',queue:shuffle([...q,...extra])})}
function startFix(){let ks=Object.keys(S.seen).filter(k=>S.seen[k].bad>0&&!k.startsWith('E')).sort((a,b)=>(S.seen[b].bad-S.seen[b].ok)-(S.seen[a].bad-S.seen[a].ok)).slice(0,8);
  if(ks.length<6){const all=[];LANDS.forEach(l=>QF[l.id].forEach((g,i)=>{const k=l.id+'-'+i;if(!ks.includes(k))all.push(k)}));ks=ks.concat(sample(all,6-ks.length))}
  newQ('fix',{title:'Fix-it',queue:shuffle(ks).map(k=>{const [l,i]=k.split('-');return {fk:k,gen:QF[+l][+i]}})})}
const isExam=()=>Q&&(Q.mode==='exam'||Q.mode==='mock');
const bossEntry=()=>{const pool=QF[Q.land];let c=pool.map((_,i)=>i).filter(i=>!Q.bossUsed.includes(i));if(!c.length){Q.bossUsed=[];c=pool.map((_,i)=>i)}const i=pick(c);Q.bossUsed.push(i);return{fk:Q.land+'-'+i,gen:pool[i],boss:1}};
function nextQuestion(){
  let entry;
  if(Q.phase==='norm'){if(Q.i>=Q.queue.length)return endNorm();entry=Q.queue[Q.i]}else entry=bossEntry();
  Q.cur={entry,q:entry.gen(),hint:0,state:'ans',ctl:null};renderQ();
}
function topUI(){
  const boss=Q.phase==='boss',L=Q.land?LBY[Q.land]:null;
  $('boss').classList.toggle('hide',!boss);$('pHearts').classList.toggle('hide',!boss);
  if(boss){$('bossFace').textContent=L.boss.i;$('bossName').textContent=L.boss.n;$('bossHp').style.width=(Q.hp/3*100)+'%';$('pHearts').textContent='❤️'.repeat(Q.hearts)+'🖤'.repeat(3-Q.hearts)}
  $('pDots').innerHTML=Q.slots.map((s,i)=>`<i class="${s}${(i===Q.i&&Q.phase==='norm'&&s==='')?' cur':''}"></i>`).join('');
  $('hintLeft').textContent=Q.cur?`(${2-Q.cur.hint})`:'';
  $('bHint').classList.toggle('hide',isExam());
  $('qcard').style.setProperty('--c',L?L.c:'#3dbb6c');
}
function coach(html,cls,mood){const st=stageOf(S.xp);$('coachFace').innerHTML=sproutSVG(st,mood||'happy');const b=$('coachBubble');b.className=cls||'';b.innerHTML=html}
function renderQ(){
  const c=Q.cur,q=c.q;LOCK=false;stopLabs();lastAct=Date.now();
  const exam=isExam(),n=Q.queue.length;
  const where=Q.phase==='boss'?`<span class="t" style="background:var(--r)">⚔️ Boss</span>`:`<span class="t">${exam?(q.sec||'Mock'):Q.mode==='fix'?'Fix-it':'Quest '+Q.land}</span>`;
  $('qTag').innerHTML=`${where}<span>${Q.phase==='boss'?'Beat '+LBY[Q.land].boss.n+'!':`Question ${Math.min(Q.i+1,n)} of ${n}`}</span>${(q.marks||1)>1||exam?`<span>· ${q.marks||1} mark${(q.marks||1)>1?'s':''}</span>`:''}`;
  $('qStem').innerHTML=`<div class="sq">${q.q}</div><button class="spk" id="spk" aria-label="Read aloud">🔊</button>`;
  $('spk').onclick=()=>{lastAct=Date.now();speakQ()};
  $('qFig').innerHTML=q.fig||'';
  if(q.lab==='dissolve'){const d=document.createElement('div');d.style.marginTop='10px';$('qFig').appendChild(d);dissolveLab(d,q.subs)}
  const api={commit(frac){setTimeout(()=>{if(Q&&Q.cur===c&&c.state==='ans')submit({frac})},900)},flag(f){S.flags[f]=1;save();checkBadges()}};
  const chg=()=>{lastAct=Date.now();if(Q.cur===c&&c.state==='ans'&&c.ctl)$('bCheck').disabled=c.ctl.auto?true:!c.ctl.ready()};
  c.ctl=R[q.type](q,$('qBody'),chg,api);
  $('bCheck').innerHTML=exam?(Q.i>=n-1?'Finish ✔':'Next ▶'):'Check ✔';$('bCheck').className='btn g';$('bCheck').disabled=true;
  $('bHint').classList.remove('wig');if(c.ctl.auto)$('bCheck').textContent='Choose a tool';
  topUI();
  if(!exam){coach(Q.i===0&&Q.phase==='norm'&&!Q.seenHi?(Q.seenHi=1,`Hi ${esc(S.name||'Scientist')}! Take your time. Stuck? Tap <b>💡 Hint</b>.`):pick(['Think like a scientist! 🔬','You can do it!','Read carefully…','Look at the picture too!','Take your time 🌱']),'','think')}
  else coach('Exam mode — no hints and no answers until the end. Do your best! 💪','','happy');
  if(S.set.voice)speakQ();
  chg();
}
function speakQ(){const q=Q.cur.q;let t=stripH(q.q);if(q.type==='mc'&&!q.tf)t+='. '+q.opts.map((o,i)=>'Option '+'ABCD'[i]+': '+optT(o)).join('. ');speak(t,'en-US')}
function explain(q){const f=FACTS[q.rem];return `${q.ex?`<div>${q.ex}</div>`:''}${f?`<div class="sm" style="margin-top:3px">💡 ${f.e}</div>`:''}`}
function ansText(q){
  if(q.type==='mc')return esc(optT(q.opts[q.a]));
  if(q.type==='pick')return esc(q.right.join(', '));
  if(q.type==='sort')return q.bins.map(b=>`<b>${b.t}</b>: ${q.items.filter(i=>i.b===b.id).map(i=>esc(i.t)).join(', ')}`).join(' · ');
  if(q.type==='match')return q.pairs.map(p=>`${p[0]} → ${p[1]}`).join('; ');
  if(q.type==='blank')return q.text.replace(/\{(\d)\}/g,(m,i)=>`<b>${esc(q.ans[+i])}</b>`);
  if(q.type==='tfset')return q.items.map(i=>`${esc(i.t)} <b>${i.b?'True':'False'}</b>`).join('<br>');
  if(q.type==='order')return q.steps.map(s=>esc(s.t)).join(' → ');
  if(q.type==='parts')return q.labels.map(cap1).join(', ');
  if(q.type==='hot')return 'e.g. '+HAZ.filter(h=>h.h).slice(0,4).map(h=>h.t).join('; ');
  if(q.type==='sepa')return 'Use a '+q.mix.t;
  if(q.type==='chart')return q.data.map(d=>d.l+' = '+d.v+' cm').join(', ');
  return '';
}
const PRAISE=['Brilliant!','You got it!','Science star!','Yes! Well done!','Super scientist!','Correct!','Fantastic!','Great thinking!'];
function submit(commit){
  const c=Q.cur;if(!c||c.state!=='ans')return;
  const r=commit||c.ctl.eval(),ok=r.frac>=.999,q=c.q,fk=c.entry.fk;
  c.frac=r.frac;c.ok=ok;c.state='fb';
  const marks=q.marks||1;
  if(isExam()){Q.res.push({q,frac:r.frac,marks,sec:q.sec||'Mixed',fk});Q.slots[Q.i]='dn';
    if(!ok)Q.wrong.push({stem:q.q,ans:ansText(q),ex:explain(q)});
    if(ok&&q.card&&unlockCard(q.card))Q.newCards.push(q.card);
    const s=S.seen[fk]||(S.seen[fk]={ok:0,bad:0});if(ok)s.ok++;else s.bad++;save();return advance()}
  LOCK=true;c.ctl.reveal();
  const s=S.seen[fk]||(S.seen[fk]={ok:0,bad:0});if(ok)s.ok++;else s.bad++;
  let gain=0;
  if(ok){Q.combo++;S.bestCombo=Math.max(S.bestCombo||0,Q.combo);gain=Math.max(4,10-c.hint*3)+Math.min(Q.combo-1,5)*2;if(c.entry.retry)gain=Math.round(gain/2);if(c.entry.boss)gain+=6;sfx('ok');if(Q.combo>=3)setTimeout(()=>floatTxt('🔥 combo x'+Q.combo,$('qcard')),150)}
  else{Q.combo=0;gain=Math.round(r.frac*5);sfx('bad')}
  Q.xp+=gain;S.xp+=gain;
  if(gain)floatTxt('+'+gain+' 💧',$('bCheck'));
  const credit=ok?(c.hint>0?.75:1):r.frac*.5;
  if(Q.phase==='norm'){Q.slots[Q.i]=ok?'ok':'no';if(!c.entry.retry)Q.res.push({fk,credit});
    if(!ok&&!c.entry.retry&&Q.mode!=='fix'){Q.queue.push({fk,gen:c.entry.gen,retry:1});Q.slots.push('')}}
  if(!ok)Q.wrong.push({stem:q.q,ans:ansText(q),ex:explain(q)});
  let newCard=null;if(ok&&q.card&&unlockCard(q.card)){newCard=CBY[q.card];Q.newCards.push(q.card);setTimeout(()=>sfx('coin'),500)}
  if(Q.phase==='boss'){if(ok){Q.hp--;const bf=$('bossFace');bf.classList.remove('hit');void bf.offsetWidth;bf.classList.add('hit');sfx('hit')}else Q.hearts--}
  const mood=ok?'cheer':'sad';
  coach(`${ok?`<b>${pick(PRAISE)}</b>${Q.phase==='boss'?' Direct hit! 💥':''}`:`<b>${r.frac>0?'Almost!':'Not quite.'}</b> ${q.type==='mc'?'The answer is <b>'+esc(optT(q.opts[q.a]))+'</b>.':'See the correct answers above.'}${Q.phase==='norm'&&Q.mode!=='fix'&&!c.entry.retry?' We\'ll try this one again later.':''}`}<div style="margin-top:4px">${explain(q)}</div>${newCard?`<div style="margin-top:4px">🃏 New card unlocked: <b>${newCard.t}</b></div>`:''}`,ok?'ok':'no',mood);
  hud();topUI();save();checkBadges();
  const bc=$('bCheck');bc.disabled=false;
  bc.innerHTML=Q.phase==='boss'?(Q.hp<=0?'Victory! 🏆':Q.hearts<=0?'Oh no… ▶':'Next ▶'):(Q.i>=Q.queue.length-1&&Q.mode!=='fix'?'Boss time! ⚔️':Q.i>=Q.queue.length-1?'Finish ✔':'Next ▶');
  if(Q.mode==='fix'&&Q.i>=Q.queue.length-1)bc.innerHTML='Finish ✔';
  setTimeout(()=>{const cb=$('coach');if(cb&&cur==='play')cb.scrollIntoView({block:'nearest',behavior:'smooth'})},120);
  if(S.set.voice&&!ok)speak('The answer is. '+stripH(ansText(q)),'en-US');
}
function advance(){
  if(isExam()){Q.i++;return Q.i>=Q.queue.length?finishExam():nextQuestion()}
  if(Q.phase==='boss'){if(Q.hp<=0)return bossWin();if(Q.hearts<=0)return bossLose();return nextQuestion()}
  Q.i++;nextQuestion();
}
function endNorm(){
  if(Q.mode==='fix')return finishQuest();
  const L=LBY[Q.land];
  openModal(`<div style="font-size:92px;line-height:1">${L.boss.i}</div><h2 style="justify-content:center;margin:6px 0">Boss battle!</h2><div style="font-size:20px"><b>${L.boss.n}</b> blocks the way!<br>Answer questions right to hit it. You have <b>3 ❤️</b>.</div><br><button class="btn r" id="mFight" style="font-size:24px">⚔️ Fight!</button>`);
  sfx('hit');$('mFight').onclick=()=>{closeModal();Q.phase='boss';Q.hearts=3;Q.hp=3;nextQuestion()};
}
function bossWin(){
  const id=Q.land,s=S.lands[id]||(S.lands[id]={});const first=!s.boss;s.boss=1;S.xp+=40;Q.xp+=40;Q.bossWon=true;save();confetti(36);sfx('win');
  openModal(`<div style="font-size:80px;line-height:1">🏆</div><h2 style="justify-content:center">You beat ${LBY[id].boss.n}!</h2><div style="font-size:20px">${first?'First victory! ':''}+40 💧 bonus</div><br><button class="btn g" id="mOk">Continue ▶</button>`);
  $('mOk').onclick=()=>{closeModal();finishQuest()};
}
function bossLose(){
  openModal(`<div style="font-size:70px;line-height:1">😵</div><h2 style="justify-content:center">${LBY[Q.land].boss.n} got away!</h2><div style="font-size:19px">Sprout is out of ❤️. Don't worry — every scientist tries again!</div><br><div class="row" style="justify-content:center"><button class="btn g" id="mAgain">↻ Try again</button><button class="btn w" id="mHome">🏠 Home</button></div>`);
  $('mAgain').onclick=()=>{closeModal();Q.hearts=3;Q.hp=3;nextQuestion()};$('mHome').onclick=()=>{closeModal();finishQuest(true)};
}
function finishQuest(bossLost){
  const n=Q.res.length||1,acc=Q.res.reduce((a,r)=>a+r.credit,0)/n;
  let st=acc>=.9?3:acc>=.7?2:1;if(Q.mode==='fix')st=0;
  const bonus=st*10;S.xp+=bonus;Q.xp+=bonus;
  if(Q.land){const s=S.lands[Q.land]||(S.lands[Q.land]={});s.done=1;s.stars=Math.max(s.stars||0,st);s.best=Math.max(s.best||0,Math.round(acc*100))}
  save();checkBadges();hud();showResult({kind:'quest',acc,st,bossLost});
}
function finishExam(){
  let sc=0,tot=0;const sec={};Q.res.forEach(r=>{const m=Math.round(r.marks*r.frac*2)/2;sc+=m;tot+=r.marks;const k=r.sec;sec[k]=sec[k]||[0,0];sec[k][0]+=m;sec[k][1]+=r.marks});
  const pct=Math.round(sc/tot*100);
  if(Q.mode==='exam'){S.exBest=Math.max(S.exBest,sc);S.exSec=sec}else S.mockBest=Math.max(S.mockBest,pct);
  const gain=Math.round(sc*2)+10;S.xp+=gain;Q.xp+=gain;save();checkBadges();hud();showResult({kind:'exam',sc,tot,pct,sec});
}
function showResult(o){

    <div class="rbox"><div class="rline"><span>🎯 Accuracy</span><span>${Math.round(o.acc*100)}%</span></div><div class="rline"><span>💧 Water earned</span><span>+${Q.xp}</span></div>${Q.mode==='quest'?`<div class="rline"><span>⚔️ Boss</span><span>${Q.bossWon?'Defeated 🏅':o.bossLost?'Escaped — try again!':'—'}</span></div>`:''}<div class="rline"><span>🃏 New cards</span><span>${newC.length?newC.map(c=>c.i).join(' '):'—'}</span></div></div>`;
    if(o.st===3||Q.bossWon)setTimeout(()=>{if(cur==='result'){confetti();sfx('win')}},200);else sfx('ok');
  }else{
    const g=o.pct>=90?['🏆','Outstanding!']:o.pct>=75?['🌟','Great job!']:o.pct>=55?['👍','Good effort — keep practising!']:['🌱','Keep growing! Practise with the quests.'];
    h=`<div style="font-size:58px">${g[0]}</div><h1>${Q.mode==='exam'?"Teacher's Test":'Mock Exam'}</h1><div class="stars" style="font-size:44px;letter-spacing:0">${o.sc} / ${o.tot} <span style="font-size:26px">marks</span></div><div style="font-size:22px;font-weight:700">${o.pct}% — ${g[1]}</div>
    <div class="rbox">${Object.entries(o.sec).map(([k,v])=>`<div class="rline"><span>${k}</span><span>${v[0]} / ${v[1]}</span></div>`).join('')}<div class="rline"><span>🃏 New cards</span><span>${newC.length?newC.map(c=>c.i).join(' '):'—'}</span></div><div class="rline"><span>💧 Water earned</span><span>+${Q.xp}</span></div></div>`;
    if(o.pct>=75){setTimeout(()=>{confetti();sfx('win')},200)}else sfx('ok');
  }
  if(Q.wrong.length)h+=`<h2 style="justify-content:center">🔎 Let's learn from these </h2><div class="rbox mist">${Q.wrong.slice(0,12).map(w=>`<div class="mi"><div>${w.stem}</div><div style="margin-top:4px"><b>Answer:</b> ${w.ans}</div><div class="sm" style="margin-top:3px;color:var(--ink2)">${w.ex}</div></div>`).join('')}</div>`;
  const nl=Q.land&&Q.land<6?Q.land+1:null;
  h+=`<div class="row" style="justify-content:center;margin:16px 0"><button class="btn g" id="rAgain">↻ ${Q.mode==='exam'?'Try again':'Play again'}</button>${nl&&Q.mode==='quest'?`<button class="btn b" id="rNext">Next quest ▶</button>`:''}<button class="btn w" id="rHome">🏠 Home</button></div>`;
  $('result').innerHTML=h;show('result');
  $('rAgain').onclick=()=>({quest:()=>startQuest(Q.land),exam:startExam,mock:startMock,fix:startFix})[Q.mode]();
  const rn=$('rNext');if(rn)rn.onclick=()=>{buildLearn(nl);show('learn')};
  $('rHome').onclick=()=>{buildHome();show('home')};
  if(grew)setTimeout(()=>{if(cur==='result')levelUp()},1400);
}
function levelUp(){const st=stageOf(S.xp);confetti(40);sfx('grow');openModal(`<div style="width:180px;margin:0 auto">${sproutSVG(st,'cheer')}</div><h2 style="justify-content:center">Sprout grew!</h2><div style="font-size:21px">Sprout is now a <b>${STAGES[st].n}</b>! 🌟</div><br><button class="btn g" onclick="closeModal()">Yay! ▶</button>`)}

/* ---------- hints ---------- */
function useHint(auto){
  if(!Q||isExam()||cur!=='play')return;const c=Q.cur;if(!c||c.state!=='ans'||c.hint>=2)return;lastAct=Date.now();c.hint++;sfx('hint');
  const f=FACTS[c.q.rem];
  if(c.hint===1)coach(`💡 <b>Hint:</b> ${f?f.e:'Read the question again slowly and look at the picture.'}`,'hint','think');
  else{c.ctl.hint2();coach(`💡 <b>Bigger hint:</b> I ${c.q.type==='mc'||c.q.type==='pick'?'crossed out a wrong choice':'helped with one answer'} for you!`,'hint','think')}
  $('hintLeft').textContent=`(${2-c.hint})`;$('bHint').classList.remove('wig');
}
setInterval(()=>{if(cur==='play'&&Q&&Q.cur&&Q.cur.state==='ans'&&!isExam()&&!Q.cur.nudged&&Q.cur.hint<2&&!LOCK&&Date.now()-lastAct>20000){Q.cur.nudged=1;$('bHint').classList.add('wig');coach(`Stuck? Tap <b>💡 Hint</b> — it's OK to ask for help!`,'hint','think')}},2000);

/* ---------- settings ---------- */
function openSettings(){
  const row=(k,t,v)=>`<div class="tg"><span>${t}</span><button class="sw${S.set[k]?' on':''}" data-k="${k}" aria-label="${t}"></button></div>`;
  openModal(`<h2 style="justify-content:center">⚙️ Settings</h2>${row('voice','🗣️ Read questions aloud automatically')}${row('snd','🔊 Sound effects')}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn w sm" id="sName">✏️ Change name</button><button class="btn r sm" id="sReset">🗑️ Reset progress</button></div><br><button class="btn g" onclick="closeModal()">Done</button>`);
  $('modalBox').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.set[k]=S.set[k]?0:1;b.classList.toggle('on',!!S.set[k]);if(k==='snd'&&master)master.gain.value=S.set.snd?.6:0;save();sfx('click')});
  $('sName').onclick=()=>{const n=prompt('Your name?',S.name||'');if(n!=null){S.name=n.trim().slice(0,14);save();$('nameIn').value=S.name;if(cur==='home')buildHome()}};
  $('sReset').onclick=()=>{if(confirm('Delete ALL progress (stars, cards, badges, water)?')){store.set('sci-save',null);try{localStorage.removeItem('sci-save')}catch(e){}location.reload()}};
}

/* ---------- init ---------- */
function init(){
  $('covSprout').innerHTML=sproutSVG(stageOf(S.xp),'cheer');$('nameIn').value=S.name||'';
  const go=()=>{S.name=$('nameIn').value.trim().slice(0,14);save();ac();sfx('pop');buildHome();show('home')};
  $('bStart').onclick=go;$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  if(S.xp>0||S.played>0)$('bStart').textContent='▶ Continue';
  $('bHome').onclick=()=>{if(cur==='play'&&Q&&!confirm('Leave this quest?'))return;stopLabs();buildHome();show('home')};
  $('bSet').onclick=openSettings;
  $('pBack').onclick=()=>{if(confirm('Leave this quest? Your progress in it will be lost.')){buildHome();show('home')}};
  $('bHint').onclick=()=>useHint();
  $('bCheck').onclick=()=>{lastAct=Date.now();const c=Q.cur;if(!c)return;if(c.state==='ans')submit();else if(c.state==='fb')advance()};
  document.addEventListener('pointerdown',()=>{lastAct=Date.now()});
  document.addEventListener('keydown',e=>{
    if(!$('modal').classList.contains('hide')){if(e.key==='Escape')closeModal();return}
    if(cur==='cover'&&e.key==='Enter')return;
    if(cur!=='play'||!Q||!Q.cur)return;if(e.target.tagName==='INPUT')return;
    const c=Q.cur;
    if(e.key==='Enter'||(e.key===' '&&c.state==='fb')){e.preventDefault();const b=$('bCheck');if(!b.disabled)b.click();return}
    if(c.state==='ans'){if(e.key==='h'||e.key==='H')useHint();const k='1234'.indexOf(e.key);if(k>=0&&c.ctl.key)c.ctl.key(k);const l='abcdABCD'.indexOf(e.key);if(l>=0&&c.ctl.key)c.ctl.key(l%4)}
  });
  $('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal')&&$('modalBox').querySelector('.sw'))closeModal()});
  show('cover');
}
init();
window.__sci={S,get Q(){return Q},QF,EXAM,R,show,buildHome,buildLearn,startQuest,startExam,startMock,startFix,submit,advance,useHint,CARDS,FACTS,
  solve(){const c=Q.cur;c.ctl.solve();return c.ctl.ready()},answerWrong(){const c=Q.cur,q=c.q;if(q.type==='mc'){c.ctl.key((q.a+1)%q.opts.length)}return c.ctl.ready()},
  nq:nextQuestion,openToy,buildBench,buildCards,buildBadges,levelUp,showResult,finishQuest,finishExam,bossWin,openSettings};
</script>
